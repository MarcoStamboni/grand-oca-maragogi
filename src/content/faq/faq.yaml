d-01:
  pergunta: Onde fica Maragogi?
  resposta: Maragogi fica no litoral norte de Alagoas, entre as cidades de Recife e Maceió, e é conhecida como a Costa dos Corais. Reúne praias de coqueirais, mar azul-esmeralda, recifes de corais e piscinas naturais, e é a segunda cidade turística do estado, atrás apenas de Maceió.
