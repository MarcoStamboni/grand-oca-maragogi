dg-06:
  pergunta: Quais feriados costumam ter mais procura no Grand Oca Maragogi?
  resposta: Costumam ter mais procura o Réveillon, o Carnaval, o Natal, a Páscoa e os feriados que formam emenda com o fim de semana, como Tiradentes, Dia do Trabalho, 7 de Setembro, Dia das Crianças, Finados, Proclamação da República e Consciência Negra. Em cada ano, a posição no calendário muda o interesse.
