d-post-resort-com-criancas-04:
  pergunta: A recreação leva as crianças para a praia?
  resposta: Leva. A programação infantil prevê atividades na areia, além das piscinas, e a Praia de Ponta de Mangue fica a poucos metros, com águas claras e tranquilas na maré baixa. A caminhada ecológica é outra opção da agenda voltada aos pequenos hóspedes.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 7154
  fontes:
    - /blog/resort-com-criancas/
d-post-resort-com-criancas-05:
  pergunta: As crianças podem usar o parque aquático sem um adulto?
  resposta: O resort não divulga regras de idade para o parque aquático e as piscinas. Como orientação geral, menores devem estar acompanhados de um responsável nas áreas de banho, e as atividades da recreação são organizadas por faixa etária. Confirme eventuais restrições na chegada.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 7155
  fontes:
    - /blog/resort-com-criancas/
d-post-resort-com-criancas-06:
  pergunta: O que os adolescentes fazem no Grand Oca Maragogi?
  resposta: A recreação atende até 12 anos, então quem passou dessa idade acompanha a programação para adultos, das 9h às 23h, com beach tênis, vôlei, futebol, caiaque, dança e academia. A experiência VIP Premium, cobrada à parte, aceita hóspedes a partir de 14 anos.
  tema: lazer
