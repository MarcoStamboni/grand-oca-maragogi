  resposta: Os Apartamentos Standard e o Standard Comunicante têm estilo e decoração rústica, com ambiente aconchegante, e ficam em meio a uma área de jardins. Já os quartos Deluxe da área D’Água têm decoração clara e contemporânea, com varanda, o que dá ao hóspede duas propostas distintas para escolher.
