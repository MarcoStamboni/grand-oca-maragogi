  resposta: Sim. O Grand Oca Maragogi fica em uma região próxima aos recifes e às piscinas naturais de Maragogi, na área de Ponta de Mangue. O centro de mergulho do resort oferece aulas e passeios até esses pontos, em mergulho com cilindro ou em snorkel, contratados à parte.
