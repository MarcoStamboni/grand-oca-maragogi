  pergunta: O que são os recifes de Maragogi?
  resposta: Os recifes de Maragogi são formações de corais que criam as piscinas naturais da Costa dos Corais, no litoral norte de Alagoas, em área protegida como APA, Área de Preservação Ambiental. Abrigam grande variedade de espécies marinhas, com destaque para os peixes coloridos, e são uma das principais atrações turísticas.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5520
  fontes: *id006
e-guia-costa-dos-corais-02:
  pergunta: Qual é a profundidade das piscinas naturais de Maragogi?
  resposta: A profundidade média da área de corais de Maragogi não passa de cerca de um metro, o que torna a região adequada tanto para o mergulho quanto para o snorkel. As marés influenciam a visibilidade e o acesso, então os passeios seguem os horários definidos pelos operadores.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5521
  fontes: *id006
e-guia-costa-dos-corais-03:
  pergunta: Dá para fazer mergulho com cilindro em Maragogi?
  resposta: Sim. O centro de mergulho do Grand Oca Maragogi tem certificação PADI e oferece aulas e passeios às piscinas naturais, tanto no mergulho quanto no snorkel. O serviço é contratado à parte, e os horários dependem das marés e das condições do mar no dia.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5522
  fontes: *id006
e-guia-costa-dos-corais-04:
  pergunta: Como é a praia em frente ao Grand Oca Maragogi?
  resposta: O resort fica a cerca de 10 metros da Praia de Ponta de Mangue, conhecida pelas águas claras e tranquilas, sobretudo na maré baixa, com coqueirais ao fundo. Há um bar na área da praia e atividades como caiaque na programação diurna do resort.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5523
  fontes: *id006
e-guia-costa-dos-corais-05:
  pergunta: A região de Maragogi é protegida?
  resposta: Sim. Os recifes de corais e as piscinas naturais de Maragogi ficam em uma APA, Área de Preservação Ambiental, o que justifica regras de visitação e cuidado com os corais. Os passeios organizados pela agência do resort e pelo centro de mergulho seguem as orientações dos operadores.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5524
  fontes: *id006
e-guia-costa-dos-corais-06:
  pergunta: Qual é a distância da Costa dos Corais até as capitais próximas?
  resposta: 'Maragogi fica entre Recife e Maceió: o Grand Oca Maragogi informa cerca de 126 km até o Recife e 136 km até Maceió, além de 153 km até Caruaru. As distâncias são rodoviárias e aproximadas, e o tempo de viagem varia conforme o trânsito.'
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5525
  fontes: *id006
e-guia-cidade-de-maragogi-01:
  pergunta: Qual é a história de Maragogi?
  resposta: Maragogi foi uma vila de pescadores, com a pesca e a agricultura, sobretudo a cana-de-açúcar, como principais fontes de recursos. Hoje o turismo é a principal atividade, e a cidade é a segunda mais turística de Alagoas, atrás da capital, Maceió, por causa das praias, dos recifes e das piscinas naturais.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5540
  fontes: *id006
e-guia-cidade-de-maragogi-02:
  pergunta: Quais igrejas de Maragogi vale a pena conhecer?
  resposta: 'Maragogi tem três igrejas históricas: a Matriz de Santo Antônio, do fim do século XIX, e as igrejas de Nossa Senhora da Guia e de São Bento, do século XVII, que hoje conservam apenas as paredes externas. Formam o principal patrimônio arquitetônico da cidade.'
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5541
  fontes: *id006
e-guia-cidade-de-maragogi-03:
  pergunta: O Carnaval de Maragogi é famoso?
  resposta: O Carnaval é a festa mais importante da cidade, com bailes, frevo e desfiles pelas ruas, e atrai milhares de visitantes. É um dos períodos mais procurados do ano, e os hotéis e resorts da região, como o Grand Oca Maragogi, costumam ter alta ocupação nessa época.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5542
  fontes: *id006
e-guia-cidade-de-maragogi-04:
  pergunta: O Grand Oca Maragogi fica no centro de Maragogi?
  resposta: Não. O Grand Oca Maragogi fica em Ponta de Mangue, ao norte do centro da cidade, e normalmente é preciso usar táxi, transfer ou carro para ir ao centro. O resort tem agência de viagens que reserva traslados e passeios pelos arredores, contratados à parte.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5543
  fontes: *id006
e-guia-cidade-de-maragogi-05:
  pergunta: Como chegar a Maragogi saindo de Recife ou de Maceió?
  resposta: Saindo de Recife, o acesso é feito por estrada, pelo litoral sul de Pernambuco até Maragogi, em cerca de 126 km. Saindo de Maceió, pelo litoral norte de Alagoas, são cerca de 136 km até Ponta de Mangue. O trecho final costuma ser feito de carro, táxi ou transfer.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5544
  fontes: *id006
e-guia-cidade-de-maragogi-06:
  pergunta: Maragogi é um destino bom para famílias?
  resposta: Sim. A cidade combina praias calmas, piscinas naturais rasas e estrutura de hospedagem, e o Grand Oca Maragogi oferece Kids Club, parque aquático e playground para as crianças. Passeios às piscinas naturais exigem atenção com horários de maré e cuidados com os corais.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5545
  fontes: *id006
e-post-como-escolher-acomodacao-01:
  pergunta: Como escolher a acomodação ideal no Grand Oca Maragogi?
  resposta: Comece pelo número de hóspedes e pela idade das crianças, depois compare a vista e a localização. Os bangalôs ficam ao lado das piscinas, o Standard Comunicante reúne até seis pessoas, os quartos Deluxe têm varanda para a piscina da área D’Água, e a Suíte Deluxe, de 72 m², é a maior do resort.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5560
  fontes: *id003
e-post-como-escolher-acomodacao-02:
  pergunta: Vale a pena pagar mais por um quarto na área D’Água?
  resposta: Depende do perfil. A área D’Água é a mais nova do Grand Oca Maragogi, com varanda para a piscina, solário, parque aquático e decoração mais clara, e é indicada para quem valoriza conforto e vista. Quem prefere um ambiente mais reservado e rústico pode ficar nos apartamentos Standard ou nos bangalôs.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5561
  fontes: *id003
e-post-como-escolher-acomodacao-03:
  pergunta: Qual é a melhor acomodação para casal no Grand Oca Maragogi?
  resposta: Para casais, o Grand Oca Maragogi tem o Bangalô, a Suíte, com cama king e vista parcial para a praia, e os quartos Deluxe, de varanda para a piscina. As Suítes são apenas duas, então reserve cedo, e os bangalôs oferecem a escolha entre vista para o jardim e para a piscina.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5562
  fontes: *id003
e-post-como-escolher-acomodacao-04:
  pergunta: Qual é a melhor acomodação para uma família grande no Grand Oca Maragogi?
  resposta: Para famílias maiores, o Standard Comunicante acomoda até seis hóspedes em dois quartos e dois banheiros, e a Suíte Deluxe, de 72 m², recebe até seis, com no máximo quatro adultos e duas crianças. O Duplo Deluxe acomoda cinco, e a idade das crianças muda a tarifa.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5563
  fontes: *id003
e-post-o-que-levar-na-mala-01:
  pergunta: O que levar na mala para a praia e as piscinas do Grand Oca Maragogi?
  resposta: Leve duas ou três roupas de banho, canga ou toalha de praia, chinelo, chapéu, óculos de sol e protetor solar, que deve ser reaplicado depois de cada mergulho. O resort fica a cerca de 10 metros da Praia de Ponta de Mangue, então a maior parte do tempo é de roupa leve e de banho.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5580
  fontes: *id001
e-post-o-que-levar-na-mala-02:
  pergunta: O que levar para os passeios às piscinas naturais de Maragogi?
  resposta: Leve calçado próprio para a água, roupa de proteção solar, uma capa para o celular e, se quiser, máscara de snorkel. A profundidade média dos recifes é de cerca de um metro, mas o fundo tem corais. Aulas e passeios de mergulho são contratados à parte, no resort.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5581
  fontes: *id001
e-post-o-que-levar-na-mala-03:
  pergunta: As tomadas do Grand Oca Maragogi são 110 V ou 220 V?
  resposta: Os apartamentos do Grand Oca Maragogi têm tomadas de 220 volts. Antes de viajar, confira se carregadores, secadores e outros aparelhos são bivolt ou leve um adaptador adequado. O resort oferece Wi-Fi, e um carregador portátil é útil para os passeios.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5582
  fontes: *id001
e-post-o-que-levar-na-mala-04:
  pergunta: Que documentos levar para o Grand Oca Maragogi?
  resposta: Leve documento oficial com foto de todos os hóspedes, inclusive das crianças, CPF (estrangeiros levam o passaporte) e, para menores que viajam sem os pais, a autorização dos responsáveis. A certidão de nascimento ou o RG comprova a filiação de cada criança, conforme o Estatuto da Criança e do Adolescente.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5583
  fontes: *id001
e-post-resort-com-criancas-01:
  pergunta: Como funciona a recreação infantil para quem viaja com crianças ao Grand Oca Maragogi?
  resposta: O Kids Club organiza atividades diárias para crianças de 4 a 12 anos, das 9h às 12h e das 14h às 18h, com jogos, oficinas, shows e opções na piscina e na praia. Menores de 4 anos participam de algumas atividades com um responsável, e a programação muda ao longo da semana.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5600
  fontes: *id005
e-post-resort-com-criancas-02:
  pergunta: Onde as crianças brincam no Grand Oca Maragogi?
  resposta: As crianças brincam no Kids Club, no parque aquático com toboágua, nas áreas rasas das piscinas, no playground com cama elástica e escorregadores e na praia de Ponta de Mangue. O Play Zone é outro espaço de brinquedos, e a baby area apoia as famílias com bebês.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5601
  fontes: *id005
e-post-resort-com-criancas-03:
  pergunta: Qual acomodação escolher para a família no Grand Oca Maragogi?
  resposta: Para três pessoas, o Apartamento Standard e o Bangalô Triplo funcionam bem; para cinco, o Duplo Deluxe; para seis, o Standard Comunicante ou a Suíte Deluxe. A idade de cada criança deve ser informada na cotação, porque ela define a tarifa e a capacidade.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5602
  fontes: *id005
e-post-resort-com-criancas-04:
  pergunta: Há berço e estrutura para bebês no Grand Oca Maragogi?
  resposta: O resort tem uma baby area para atender hóspedes com crianças pequenas, e os bangalôs aceitam dois adultos e um bebê em berço. Confirme com a equipe da Resorts Online a disponibilidade do berço na categoria escolhida e as idades consideradas, antes de finalizar a reserva.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5603
  fontes: *id005
