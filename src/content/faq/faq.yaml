  ordem: 1902
  fontes: *id001
f-04:
  pergunta: Há fotos de todas as acomodações do Grand Oca Maragogi?
  resposta: Há fotos de todas as nove categorias, algumas com mais imagens, como a Suíte Deluxe, e outras com poucas, como a Suíte. A página de cada acomodação reúne as fotos do quarto, do banheiro e da varanda disponíveis, e a equipe pode enviar mais detalhes sob consulta.
