d-05:
  pergunta: Como era Maragogi antes do turismo?
  resposta: Maragogi era uma vila de pescadores, e a pesca e a agricultura, em especial a cana-de-açúcar, eram as principais fontes de recursos. Hoje o turismo é a principal atividade da região, e a cidade é a segunda mais turística de Alagoas, atrás da capital, Maceió.
  tema: destino
  paginas:
