e-acomodacao-apartamento-standard-01:
  pergunta: Como é o Apartamento Standard do Grand Oca Maragogi?
  resposta: Os 120 Apartamentos Standard do Grand Oca Maragogi têm estilo e decoração rústica, vista para os jardins e o coqueiral e ar-condicionado split, TV de 32 polegadas, frigobar, telefone e banheiro com chuveiro e secador de cabelo. É a categoria mais numerosa do resort e atende casais, pequenos grupos e famílias.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 5020
  fontes: *a3
e-acomodacao-apartamento-standard-02:
  pergunta: Quantas pessoas cabem no Apartamento Standard do Grand Oca Maragogi?
  resposta: O Apartamento Standard acomoda até três adultos, ou dois adultos e uma criança de até 12 anos, conforme a configuração da reserva. As camas são uma de casal e uma de solteiro, ou três de solteiro. Informe a idade de cada criança na cotação, porque ela define a tarifa.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 5021
  fontes: *a3
e-acomodacao-apartamento-standard-03:
  pergunta: Qual é a vista do Apartamento Standard do Grand Oca Maragogi?
  resposta: O Apartamento Standard fica voltado para os jardins e o coqueiral do resort, em um ambiente mais verde e tranquilo do que o das categorias de frente para a piscina. Os prédios têm dois andares com varandas de madeira, em meio ao gramado e às palmeiras.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 5022
  fontes: *a3
e-acomodacao-apartamento-standard-04:
  pergunta: Qual é a diferença entre o Apartamento Standard e o Standard Comunicante?
  resposta: O Apartamento Standard tem um quarto, para até três hóspedes. O Standard Comunicante reúne dois quartos interligados, com duas varandas e dois banheiros, com uma cama de casal e três de solteiro. Os dois têm estilo rústico, e a escolha depende do tamanho do grupo.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 5023
  fontes: *a3
e-acomodacao-apartamento-standard-05:
  pergunta: Para quem o Apartamento Standard do Grand Oca Maragogi é indicado?
  resposta: O Standard é indicado para casais, pequenos grupos e famílias com uma criança que pretendem aproveitar o dia nas piscinas, na praia e nos restaurantes e usar o quarto para descansar. Para famílias maiores, o Standard Comunicante e as categorias Deluxe oferecem mais espaço.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 5024
  fontes: *a3
e-acomodacao-standard-comunicante-01:
  pergunta: Como é o Standard Comunicante do Grand Oca Maragogi?
  resposta: O Standard Comunicante do Grand Oca Maragogi une dois quartos comunicantes, com duas varandas e dois banheiros, em uma extensa área de jardins cercada pela natureza. Tem estilo e decoração rústica, grandes janelas, ar-condicionado split, Smart TV, frigobar e telefone, e é indicado para grupos e famílias numerosas.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 5040
  fontes: *a3
e-acomodacao-standard-comunicante-02:
  pergunta: Quais camas tem o Standard Comunicante do Grand Oca Maragogi?
  resposta: O Standard Comunicante tem uma cama de casal e três camas de solteiro, distribuídas entre os dois quartos, e cada quarto tem o seu banheiro com chuveiro e secador de cabelo. A configuração permite a famílias e grupos dividir o mesmo espaço sem abrir mão da privacidade.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 5041
  fontes: *a3
e-acomodacao-standard-comunicante-03:
  pergunta: O Standard Comunicante do Grand Oca Maragogi é adaptado para mobilidade reduzida?
  resposta: Não. O Grand Oca Maragogi informa que o Standard Comunicante não possui adaptação para hóspedes com deficiência física ou mobilidade reduzida. Quem precisa de acessibilidade deve informar a necessidade na cotação, para a equipe da Resorts Online confirmar com o resort a categoria mais adequada.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 5042
  fontes: *a3
e-acomodacao-standard-comunicante-04:
  pergunta: O Standard Comunicante do Grand Oca Maragogi tem varanda em cada quarto?
  resposta: Sim. O Standard Comunicante tem duas varandas, uma para cada quarto, e duas portas de comunicação entre os ambientes. As grandes janelas e as varandas convidam ao descanso, com vista para o gramado e os coqueiros do resort. Vale pedir a vista preferida na cotação.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 5043
  fontes: *a3
e-acomodacao-standard-comunicante-05:
  pergunta: Para quem o Standard Comunicante do Grand Oca Maragogi é indicado?
  resposta: O Standard Comunicante é indicado para duas famílias ou para grupos grandes que querem ficar lado a lado, mas com a privacidade de dois quartos e dois banheiros separados. É uma opção prática para quem prefere uma única reserva para o grupo todo.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 5044
  fontes: *a3
e-acomodacao-bangalo-vista-jardim-01:
  pergunta: Como é o Bangalô Vista Jardim do Grand Oca Maragogi?
  resposta: O Bangalô Vista Jardim é uma das 49 unidades do Grand Oca Maragogi ao lado das piscinas, com vista para o jardim. Tem cama de casal ou duas de solteiro, ar-condicionado split, TV LED de 32 polegadas, frigobar, telefone e banheiro com chuveiro, secador de cabelo e comodidades exclusivas.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 5060
  fontes: *a3
e-acomodacao-bangalo-vista-jardim-02:
  pergunta: Quantas pessoas o Bangalô Vista Jardim acomoda?
  resposta: O Bangalô Vista Jardim acomoda dois adultos ou dois adultos e um bebê em berço. Para um terceiro hóspede que não seja bebê, o Bangalô Triplo, com cama extra, e o Apartamento Standard são alternativas, e a Resorts Online confirma a configuração na cotação.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 5061
  fontes: *a3
e-acomodacao-bangalo-vista-jardim-03:
  pergunta: Qual é a diferença entre o Bangalô Vista Jardim e o Vista Piscina?
  resposta: 'A principal diferença é a vista: o Vista Jardim, com 49 unidades, é voltado para o paisagismo e o verde do resort, e o Vista Piscina, com 48, olha para a água e para a área de lazer. Camas, equipamentos e capacidade são os mesmos nas duas versões.'
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 5062
  fontes: *a3
e-acomodacao-bangalo-vista-jardim-04:
  pergunta: O Bangalô Vista Jardim do Grand Oca Maragogi fica perto das piscinas?
  resposta: Sim. Os bangalôs ficam ao lado das piscinas do Grand Oca Maragogi, que se estendem por quase 400 metros em frente a eles. Isso facilita ir da porta para a água e para os bares, e a Praia de Ponta de Mangue fica a poucos passos.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 5063
  fontes: *a3
e-acomodacao-bangalo-vista-jardim-05:
  pergunta: Para quem o Bangalô Vista Jardim é indicado?
  resposta: O Bangalô Vista Jardim é indicado para casais, com ou sem bebê de colo, que preferem uma casinha térrea a um prédio de apartamentos e gostam de um ambiente mais reservado, com paisagismo, coqueiros e o movimento das piscinas por perto.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 5064
  fontes: *a3
e-acomodacao-bangalo-vista-piscina-01:
  pergunta: Como é o Bangalô Vista Piscina do Grand Oca Maragogi?
  resposta: O Bangalô Vista Piscina é uma das 48 unidades do Grand Oca Maragogi ao lado das piscinas, com vista para a água. Tem cama de casal ou duas de solteiro, ar-condicionado split, TV LED de 32 polegadas, frigobar, telefone e banheiro com chuveiro, secador de cabelo e comodidades exclusivas.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 5080
  fontes: *a3
e-acomodacao-bangalo-vista-piscina-02:
  pergunta: Quantas pessoas o Bangalô Vista Piscina acomoda?
  resposta: O Bangalô Vista Piscina acomoda dois adultos ou dois adultos e um bebê em berço, com cama de casal ou duas camas de solteiro. Confirme com a equipe da Resorts Online a disponibilidade do berço na categoria escolhida ao pedir a cotação.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 5081
  fontes: *a3
e-acomodacao-bangalo-vista-piscina-03:
  pergunta: 'Qual bangalô escolher: Vista Piscina ou Vista Jardim?'
  resposta: O Vista Piscina agrada a quem quer ficar de frente para a área de lazer e para a água, mais movimentada. O Vista Jardim é voltado para o verde, em clima mais reservado. Metragem não informada, camas e capacidade são os mesmos, e a escolha depende só da vista.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 5082
  fontes: *a3
e-acomodacao-bangalo-vista-piscina-04:
  pergunta: O Bangalô Vista Piscina do Grand Oca Maragogi aceita bebê em berço?
  resposta: Sim. Os Bangalôs Vista Jardim e Vista Piscina acomodam dois adultos e um bebê em berço. Informe a idade do bebê na cotação, porque ela muda a tarifa, e confirme a disponibilidade do berço com a equipe da Resorts Online antes de finalizar a reserva.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 5083
  fontes: *a3
e-acomodacao-bangalo-vista-piscina-05:
  pergunta: Para quem o Bangalô Vista Piscina é indicado?
  resposta: O Bangalô Vista Piscina é indicado para casais, com ou sem bebê de colo, que querem acordar de frente para as piscinas, perto dos bares e da programação de lazer, em uma acomodação térrea e descontraída, a poucos passos da Praia de Ponta de Mangue.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 5084
  fontes: *a3
e-acomodacao-bangalo-triplo-01:
  pergunta: Como é o Bangalô Triplo do Grand Oca Maragogi?
  resposta: O Bangalô Triplo do Grand Oca Maragogi tem vista para os jardins, fica ao lado das piscinas principais e conta com cama de casal ou duas de solteiro, mais uma cama extra. Tem ar-condicionado split, TV LCD de 32 polegadas, frigobar, telefone e banheiro com chuveiro e secador de cabelo.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 5100
  fontes: *a3
e-acomodacao-bangalo-triplo-02:
  pergunta: Quantas pessoas o Bangalô Triplo do Grand Oca Maragogi acomoda?
  resposta: O Bangalô Triplo oferece uma cama de casal ou duas de solteiro e uma cama extra, o que o torna a categoria de bangalô para até três hóspedes. É prática para casais com uma criança, pequenas famílias e trios de amigos, e a idade das crianças deve constar na cotação.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 5101
  fontes: *a3
e-acomodacao-bangalo-triplo-03:
  pergunta: Qual é a vista do Bangalô Triplo do Grand Oca Maragogi?
  resposta: O Bangalô Triplo tem vista para os jardins do resort, com gramado, canteiros floridos e coqueiros, e fica próximo às piscinas principais. É uma categoria voltada ao verde, em ambiente agradável e descontraído, perto da área de lazer. A vista é a mesma para todas as unidades da categoria.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 5102
  fontes: *a3
e-acomodacao-bangalo-triplo-04:
  pergunta: Quantos Bangalôs Triplos o Grand Oca Maragogi tem?
  resposta: O Grand Oca Maragogi tem 49 Bangalôs Triplos, ao lado das piscinas principais. Os Bangalôs Vista Jardim somam 49 e os Vista Piscina, 48, e os Triplos são os bangalôs com cama extra para um terceiro hóspede. A disponibilidade varia conforme a data e a ocupação.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 5103
  fontes: *a3
e-acomodacao-bangalo-triplo-05:
  pergunta: Para quem o Bangalô Triplo do Grand Oca Maragogi é indicado?
  resposta: O Bangalô Triplo é indicado para casais, famílias com uma criança, pequenos grupos e crianças maiores, já que a cama extra acomoda o terceiro hóspede. Mantém a vantagem de ficar perto das piscinas principais, em um ambiente térreo entre os jardins.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 5104
  fontes: *a3
e-acomodacao-suite-01:
  pergunta: Como são as Suítes do Grand Oca Maragogi?
  resposta: O Grand Oca Maragogi tem apenas duas Suítes, no andar superior, perto da piscina central. São unidades diferenciadas, com cama king size, ar-condicionado split, Smart TV de 50 polegadas, frigobar com serviço premium e configuração de sala, quarto e banheiro, com banheiro amplo em mármore, chuveiro separado e amenities exclusivos.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 5120
  fontes: *a3
e-acomodacao-suite-02:
  pergunta: As Suítes do Grand Oca Maragogi têm vista para o mar?
  resposta: As Suítes oferecem vista para a piscina e vista parcial para a Praia de Ponta de Mangue, descrita pelo resort como a melhor praia de Maragogi. Ficam no andar superior, perto da piscina central, e são as únicas acomodações do resort com vista parcial para a praia.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 5121
  fontes: *a3
e-acomodacao-suite-03:
  pergunta: As Suítes do Grand Oca Maragogi têm cama king size?
  resposta: Sim. As Suítes do Grand Oca Maragogi têm cama king size, sala separada do quarto e banheiro amplo em mármore, com chuveiro separado e amenities exclusivos. A capacidade depende da configuração da reserva e deve ser confirmada na cotação com a equipe da Resorts Online.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 5122
  fontes: *a3
e-acomodacao-suite-04:
  pergunta: Quantas Suítes o Grand Oca Maragogi tem?
  resposta: O Grand Oca Maragogi tem apenas duas Suítes, o que as torna uma das opções mais exclusivas do resort. Por serem tão poucas, a disponibilidade é muito limitada, e as datas de alta procura, como feriados e fim de ano, esgotam rápido. Reserve com antecedência.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 5123
  fontes: *a3
e-acomodacao-suite-05:
  pergunta: Qual é o diferencial do frigobar das Suítes do Grand Oca Maragogi?
  resposta: As Suítes contam com frigobar com serviço premium, um dos diferenciais da categoria. Além dele, oferecem Smart TV de 50 polegadas, ar-condicionado split, cama king size e uma configuração única de sala, quarto e banheiro, o que as coloca entre as acomodações de padrão superior do resort.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 5124
  fontes: *a3
e-acomodacao-deluxe-duas-camas-grandes-01:
  pergunta: Como é o Deluxe com 2 Camas Grandes do Grand Oca Maragogi?
  resposta: O Deluxe com 2 Camas Grandes fica na nova área D’Água do Grand Oca Maragogi, em um espaço amplo e iluminado, com duas camas extragrandes, Smart TV e varanda de frente para a piscina. É indicado para quem quer a estrutura da área mais nova do resort.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 5140
  fontes: *a3
e-acomodacao-deluxe-duas-camas-grandes-02:
  pergunta: Quantas pessoas o Deluxe com 2 Camas Grandes acomoda?
  resposta: O Deluxe com 2 Camas Grandes acomoda até quatro hóspedes, com duas camas extragrandes. A categoria atende casais, famílias pequenas e amigos que viajam juntos, e a metragem não é informada, ao contrário do Duplo Deluxe, de 50 m², e da Suíte Deluxe, de 72 m².
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 5141
  fontes: *a3
e-acomodacao-deluxe-duas-camas-grandes-03:
  pergunta: O Deluxe com 2 Camas Grandes tem varanda?
  resposta: Sim. O Deluxe com 2 Camas Grandes tem varanda com vista para a piscina e o parque aquático da área D’Água. É um dos ambientes preferidos de quem quer acompanhar o movimento da área de lazer sem sair do quarto.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 5142
  fontes: *a3
e-acomodacao-deluxe-duas-camas-grandes-04:
  pergunta: O que é a nova área D’Água, onde fica o Deluxe com 2 Camas Grandes?
  resposta: A área D’Água é a parte mais nova do Grand Oca Maragogi, com piscinas, solário, borda infinita, parque aquático e um bar com snacks e gelados, além do chá da tarde. É onde ficam os quartos Deluxe, com varandas voltadas para a piscina.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 5143
  fontes: *a3
e-acomodacao-deluxe-duas-camas-grandes-05:
  pergunta: Para quem o Deluxe com 2 Camas Grandes do Grand Oca Maragogi é indicado?
  resposta: O Deluxe é indicado para casais e famílias que querem mais conforto na área mais nova do resort, com vista para a piscina e Smart TV no quarto. A varanda de frente para o parque aquático é um diferencial para quem viaja com crianças.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 5144
  fontes: *a3
e-acomodacao-duplo-deluxe-sofa-cama-01:
  pergunta: Como é o Duplo Deluxe com Sofá-cama do Grand Oca Maragogi?
  resposta: O Duplo Deluxe com Sofá-cama tem 50 m² e fica na nova área D’Água do Grand Oca Maragogi, com configuração fixa de duas camas de casal e um sofá-cama. Tem varanda com vista para a piscina e foi pensado para famílias que querem mais espaço durante a hospedagem.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 5160
  fontes: *a3
e-acomodacao-duplo-deluxe-sofa-cama-02:
  pergunta: Quantas pessoas o Duplo Deluxe com Sofá-cama acomoda?
  resposta: O Duplo Deluxe acomoda até cinco hóspedes, no máximo quatro adultos e uma criança, com duas camas de casal e um sofá-cama. A configuração é fixa, o que permite a famílias com crianças ou grupos de amigos dividir o mesmo apartamento com conforto.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 5161
  fontes: *a3
e-acomodacao-duplo-deluxe-sofa-cama-03:
  pergunta: Qual é a metragem do Duplo Deluxe com Sofá-cama?
  resposta: O Duplo Deluxe com Sofá-cama tem 50 m², menos que a Suíte Deluxe, de 72 m², a maior do resort. É um quarto amplo, com a varanda de frente para a piscina da área D’Água, que se soma à área interna e dá mais espaço às famílias.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 5162
  fontes: *a3
e-acomodacao-duplo-deluxe-sofa-cama-04:
  pergunta: O Duplo Deluxe tem vista para a piscina?
  resposta: Sim. O Duplo Deluxe tem varanda com vista para a piscina da área D’Água, uma das opções do Grand Oca Maragogi para quem quer ver o movimento da área de lazer, a poucos passos dos bares e do solário. Confirme a disponibilidade da categoria para as suas datas.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 5163
  fontes: *a3
e-acomodacao-duplo-deluxe-sofa-cama-05:
  pergunta: Para quem o Duplo Deluxe com Sofá-cama é indicado?
  resposta: O Duplo Deluxe é indicado para famílias com crianças que buscam mais espaço na área mais nova do resort, com a comodidade do sofá-cama para uma pessoa a mais. Para seis hóspedes, a opção é a Suíte Deluxe ou o Standard Comunicante.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 5164
  fontes: *a3
e-acomodacao-suite-deluxe-01:
  pergunta: Como é a Suíte Deluxe do Grand Oca Maragogi?
  resposta: A Suíte Deluxe é a maior acomodação do Grand Oca Maragogi, com 72 m², duas camas extragrandes e sala de estar com sofá-cama. Tem cafeteira Nespresso, Smart TV e varanda com vista para a piscina da nova área D’Água, e é um quarto pensado para as férias em família.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 5180
  fontes: *a3
e-acomodacao-suite-deluxe-02:
  pergunta: Quantas pessoas a Suíte Deluxe do Grand Oca Maragogi acomoda?
  resposta: A Suíte Deluxe acomoda até seis hóspedes, no máximo quatro adultos e duas crianças, com duas camas extragrandes e um sofá-cama na sala de estar. É a categoria de maior capacidade do Grand Oca Maragogi, ao lado do Standard Comunicante, e a mais espaçosa para famílias.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 5181
  fontes: *a3
e-acomodacao-suite-deluxe-03:
  pergunta: A Suíte Deluxe do Grand Oca Maragogi tem cafeteira Nespresso?
  resposta: Sim. A cafeteira Nespresso faz parte da Suíte Deluxe do Grand Oca Maragogi, junto com a Smart TV e a varanda com vista para a nova área D’Água. É a categoria de maior metragem do resort, com 72 m². Confirme os itens da categoria na cotação com a equipe.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 5182
  fontes: *a3
e-acomodacao-suite-deluxe-04:
  pergunta: Qual é a vista da Suíte Deluxe do Grand Oca Maragogi?
  resposta: A Suíte Deluxe tem varanda com vista para a piscina da nova área D’Água, de frente para o parque aquático e para o solário. Os edifícios da área ficam de frente para a água, o que dá ao hóspede um cenário de piscina e céu aberto.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 5183
  fontes: *a3
e-acomodacao-suite-deluxe-05:
  pergunta: Para quem a Suíte Deluxe do Grand Oca Maragogi é indicada?
  resposta: A Suíte Deluxe é indicada para famílias que buscam o máximo de espaço e conforto do resort, com sala própria e cafeteira Nespresso na maior acomodação da propriedade. É também uma das opções mais procuradas em feriados, quando esgota com antecedência.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 5184
  fontes: *a3
e-restaurante-restaurante-dos-corais-01:
  pergunta: Como é o Restaurante dos Corais do Grand Oca Maragogi?
  resposta: O Restaurante dos Corais é o principal do Grand Oca Maragogi. Fica de frente para o mar, com janelas panorâmicas que criam sensação de amplitude, e serve café da manhã, almoço e jantar em buffet de culinária regional, com opções variadas, show cooking e mesas para famílias e grupos.
  tema: all-inclusive
  paginas:
    - restaurante:restaurante-dos-corais
  ordem: 5200
  fontes: *a4
e-restaurante-restaurante-dos-corais-02:
  pergunta: Qual a capacidade do Restaurante dos Corais?
  resposta: O Restaurante dos Corais tem capacidade para 340 pessoas e fica de frente para o mar, com janelas panorâmicas. É o maior restaurante do Grand Oca Maragogi, e os horários de refeições são distribuídos ao longo do dia, o que ajuda a evitar filas e a manter o serviço ágil.
