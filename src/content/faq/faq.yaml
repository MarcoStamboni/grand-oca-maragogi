  resposta: Depende do número de hóspedes. O Duplo Deluxe acomoda cinco em 50 m², o Standard Comunicante reúne até seis em dois quartos, a Suíte Deluxe recebe até seis, com no máximo quatro adultos e duas crianças. A idade das crianças muda a tarifa, então informe-a na cotação.
