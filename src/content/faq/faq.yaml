  ordem: 310
  fontes: *a3
a-12:
  pergunta: Qual acomodação do Grand Oca Maragogi acomoda cinco pessoas?
  resposta: 'O Grand Oca Maragogi tem uma opção para cinco pessoas: o Duplo Deluxe com Sofá-cama, de 50 m², com no máximo quatro adultos e uma criança. Para seis hóspedes, as alternativas são o Standard Comunicante e a Suíte Deluxe. A idade das crianças deve constar na cotação, pois muda a tarifa.'
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
    - acomodacao:suite-deluxe
  ordem: 311
  fontes: *a3
a-13:
  pergunta: Os apartamentos do Grand Oca Maragogi são rústicos?
  resposta: Os Apartamentos Standard e o Standard Comunicante têm estilo e decoração rústica, com ambiente aconchegante, e ficam em meio a uma área de jardins. Já os quartos Deluxe da área D’Água têm decoração clara e contemporânea, com varanda, o que dá ao hóspede duas propostas distintas para escolher.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
    - acomodacao:bangalo-vista-piscina
  ordem: 312
  fontes: *a3
a-14:
  pergunta: Como escolher entre vista para o jardim e vista para a piscina no Grand Oca Maragogi?
  resposta: A vista para o jardim agrada a quem prefere um ambiente mais reservado, com paisagismo e coqueiros. A vista para a piscina serve a quem quer ficar de frente para a área de lazer, mais movimentada. Os bangalôs, por exemplo, têm as duas versões, com a mesma metragem e capacidade.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
