    - acomodacao:suite
  ordem: 1500
  fontes: *a7
rs-02:
  pergunta: Qual a diferença entre só hospedagem e pacote com aéreo?
  resposta: A reserva só de hospedagem serve para quem já tem passagem aérea, vai de carro ou prefere organizar o deslocamento até Maragogi. O pacote com hotel e aéreo reúne hospedagem all inclusive e passagens numa única cotação. Em ambos, o all inclusive e as acomodações são os mesmos.
  tema: reservas
  paginas:
    - blog
  ordem: 1501
  fontes: *a7
rs-03:
  pergunta: Dá para parcelar a reserva do Grand Oca Maragogi?
  resposta: Sim. A Resorts Online oferece parcelamento em até 10 vezes sem juros no cartão de crédito para hospedagem e pacote com aéreo. As condições valem para as tarifas elegíveis e podem variar conforme a oferta e o período, e as válidas são sempre as exibidas no momento da reserva.
  tema: reservas
  paginas:
    - outrosResorts
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 1502
  fontes: *a7
rs-04:
  pergunta: Há desconto para pagar no Pix?
  resposta: Sim. A Resorts Online informa desconto de 5% para pagamento à vista no Pix, em hospedagem e pacote com aéreo. O desconto vale para as tarifas elegíveis, e as condições podem variar conforme a oferta e o período. Confirme as regras na cotação, antes de finalizar o pagamento.
  tema: reservas
  paginas:
    - reservas
    - data-especial:pascoa
  ordem: 1503
  fontes: *a7
rs-05:
  pergunta: Como confirmar a disponibilidade do Grand Oca Maragogi?
  resposta: Para consultar a disponibilidade, informe as datas, o número de quartos, os adultos e a idade de cada criança na página de reservas ou fale com a central da Resorts Online, por telefone ou WhatsApp. A equipe consulta a categoria desejada e envia a tarifa, que depende da data e da ocupação.
  tema: reservas
  paginas:
    - reservas
    - data-especial:tiradentes
  ordem: 1504
  fontes: *a7
rs-06:
  pergunta: O que conferir antes de finalizar a reserva do Grand Oca Maragogi?
  resposta: Antes de finalizar, confira as datas e o número de noites, a idade de cada criança, a categoria e a capacidade, a regra de cancelamento da tarifa, o que está incluso no all inclusive e os documentos de todos os hóspedes. Tarifas promocionais podem ter regras diferentes das tarifas flexíveis.
  tema: reservas
  paginas:
    - reservas
    - data-especial:dia-do-trabalho
  ordem: 1505
  fontes: *a7
rs-07:
  pergunta: Como funciona o cancelamento da reserva do Grand Oca Maragogi?
  resposta: O cancelamento segue a regra da tarifa escolhida, informada antes do pagamento, e tarifas promocionais podem não ser reembolsáveis. Compras a distância podem ser canceladas em até 7 dias após a contratação, com devolução integral, conforme o art. 49 do Código de Defesa do Consumidor.
  tema: reservas
  paginas:
    - reservas
    - acomodacao:standard-comunicante
  ordem: 1506
  fontes: *a7
rs-08:
  pergunta: Com quanto tempo de antecedência reservar o Grand Oca Maragogi?
  resposta: Quanto antes, melhor, em especial para feriados, Réveillon, Carnaval e férias escolares, quando as categorias esgotam mais rápido e as tarifas variam conforme a ocupação. A disponibilidade das categorias menores, como as duas Suítes, é mais limitada. Consulte a equipe da Resorts Online para saber a melhor data.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 1507
  fontes: *a7
rs-09:
  pergunta: A Resorts Online é o site oficial do Grand Oca Maragogi?
  resposta: Não. Este site é um portal da Resorts Online, agência de viagens que vende hospedagem e pacotes para o Grand Oca Maragogi. As informações sobre o resort foram reunidas a partir de fontes públicas e reescritas, e o atendimento de reservas é feito pela central da agência.
  tema: reservas
  paginas:
    - datasEspeciais
