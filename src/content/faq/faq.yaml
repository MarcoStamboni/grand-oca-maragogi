s-02:
  pergunta: O Grand Oca Maragogi tem estacionamento?
  resposta: O resort não informa dados sobre estacionamento, como número de vagas ou cobrança. Quem pretende ir de carro deve confirmar a disponibilidade com a recepção do Grand Oca Maragogi, que fica na Rodovia AL-101 Norte, em Ponta de Mangue, com acesso direto pela rodovia.
