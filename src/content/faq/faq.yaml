l-04:
  pergunta: Como é a Praia de Ponta de Mangue, em frente ao resort?
  resposta: A Praia de Ponta de Mangue é conhecida pelas águas claras e tranquilas, sobretudo em períodos de maré baixa, e tem coqueirais ao fundo. É uma das praias mais procuradas de Maragogi e fica a poucos passos do Grand Oca Maragogi, que também integra a região dos recifes e das piscinas naturais.
