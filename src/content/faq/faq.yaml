d-04:
  pergunta: Maragogi é boa para mergulho e snorkel?
  resposta: Sim. Maragogi é uma das áreas de corais mais conhecidas do país, em uma região protegida, com grande variedade de espécies marinhas, como peixes coloridos. A profundidade média, de cerca de um metro, também a torna indicada para o snorkel. O Grand Oca Maragogi tem um centro de mergulho PADI.
