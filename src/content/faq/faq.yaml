d-09:
  pergunta: Qual é a melhor época para viajar a Maragogi?
  resposta: A fonte consultada não indica uma melhor época. Em geral, feriados prolongados e as férias escolares têm mais procura, com tarifas e disponibilidade variando conforme a data, a ocupação e a antecedência. Quem quer observar as piscinas naturais deve consultar os horários de maré com o centro de mergulho.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 1408
  fontes: *a6
d-10:
  pergunta: O que fazer em Maragogi além do resort?
  resposta: Além do resort, Maragogi permite passeios às piscinas naturais, mergulho e snorkel, caminhadas pelas praias de coqueirais e visitas ao centro da cidade, com suas igrejas históricas. Em época de Carnaval, a cidade tem bailes, frevo e desfiles. A agência do Grand Oca reserva traslados e passeios.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 1409
  fontes: *a6
d-11:
  pergunta: Quando o Aeroporto Costa dos Corais deve começar a operar?
  resposta: Ainda não há uma data definitiva confirmada para o início das operações do Aeroporto Costa dos Corais, em Maragogi, que está em construção e não opera voos comerciais regulares. Por enquanto, os hóspedes chegam ao Grand Oca Maragogi pelos aeroportos de Recife ou de Maceió.
  tema: destino
  paginas:
    - perguntasFrequentes
  ordem: 1410
  fontes: *a6
rs-01:
  pergunta: Como reservar o Grand Oca Maragogi?
  resposta: É possível reservar o Grand Oca Maragogi pelo site, escolhendo só a hospedagem ou o pacote com aéreo, ou pela central de reservas da Resorts Online, no 0800 737 6787. Informe as datas, os hóspedes e a idade das crianças, e a equipe confirma a disponibilidade e as condições.
  tema: reservas
  paginas:
