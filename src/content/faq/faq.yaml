  resposta: O almoço e o jantar em buffet trazem saladas, pratos quentes, massas, acompanhamentos e sobremesas variadas, além do serviço de show cooking. O cardápio muda ao longo da estadia, e as marcas e as receitas podem ser alteradas sem aviso, conforme a operação.
