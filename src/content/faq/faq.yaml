e-guia-costa-dos-corais-01:
  pergunta: O que são os recifes de Maragogi?
  resposta: Os recifes de Maragogi são formações de corais que criam as piscinas naturais da Costa dos Corais, no litoral norte de Alagoas, em área protegida como APA, Área de Preservação Ambiental. Abrigam grande variedade de espécies marinhas, com destaque para os peixes coloridos, e são uma das principais atrações turísticas.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5520
  fontes: *a6
e-guia-costa-dos-corais-02:
  pergunta: Qual é a profundidade das piscinas naturais de Maragogi?
  resposta: A profundidade média da área de corais de Maragogi não passa de cerca de um metro, o que torna a região adequada tanto para o mergulho quanto para o snorkel. As marés influenciam a visibilidade e o acesso, então os passeios seguem os horários definidos pelos operadores.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5521
  fontes: *a6
e-guia-costa-dos-corais-03:
  pergunta: Dá para fazer mergulho com cilindro em Maragogi?
  resposta: Sim. O centro de mergulho do Grand Oca Maragogi tem certificação PADI e oferece aulas e passeios às piscinas naturais, tanto no mergulho quanto no snorkel. O serviço é contratado à parte, e os horários dependem das marés e das condições do mar no dia.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5522
  fontes: *a6
e-guia-costa-dos-corais-04:
  pergunta: Como é a praia em frente ao Grand Oca Maragogi?
  resposta: O resort fica a cerca de 10 metros da Praia de Ponta de Mangue, conhecida pelas águas claras e tranquilas, sobretudo na maré baixa, com coqueirais ao fundo. Há um bar na área da praia e atividades como caiaque na programação diurna do resort.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5523
  fontes: *a6
e-guia-costa-dos-corais-05:
  pergunta: A região de Maragogi é protegida?
  resposta: Sim. Os recifes de corais e as piscinas naturais de Maragogi ficam em uma APA, Área de Preservação Ambiental, o que justifica regras de visitação e cuidado com os corais. Os passeios organizados pela agência do resort e pelo centro de mergulho seguem as orientações dos operadores.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5524
  fontes: *a6
e-guia-costa-dos-corais-06:
  pergunta: Qual é a distância da Costa dos Corais até as capitais próximas?
  resposta: 'Maragogi fica entre Recife e Maceió: o Grand Oca Maragogi informa cerca de 126 km até o Recife e 136 km até Maceió, além de 153 km até Caruaru. As distâncias são rodoviárias e aproximadas, e o tempo de viagem varia conforme o trânsito.'
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 5525
  fontes: *a6
e-guia-cidade-de-maragogi-01:
  pergunta: Qual é a história de Maragogi?
  resposta: Maragogi foi uma vila de pescadores, com a pesca e a agricultura, sobretudo a cana-de-açúcar, como principais fontes de recursos. Hoje o turismo é a principal atividade, e a cidade é a segunda mais turística de Alagoas, atrás da capital, Maceió, por causa das praias, dos recifes e das piscinas naturais.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5540
  fontes: *a6
e-guia-cidade-de-maragogi-02:
  pergunta: Quais igrejas de Maragogi vale a pena conhecer?
  resposta: 'Maragogi tem três igrejas históricas: a Matriz de Santo Antônio, do fim do século XIX, e as igrejas de Nossa Senhora da Guia e de São Bento, do século XVII, que hoje conservam apenas as paredes externas. Formam o principal patrimônio arquitetônico da cidade.'
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5541
  fontes: *a6
e-guia-cidade-de-maragogi-03:
  pergunta: O Carnaval de Maragogi é famoso?
  resposta: O Carnaval é a festa mais importante da cidade, com bailes, frevo e desfiles pelas ruas, e atrai milhares de visitantes. É um dos períodos mais procurados do ano, e os hotéis e resorts da região, como o Grand Oca Maragogi, costumam ter alta ocupação nessa época.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5542
  fontes: *a6
e-guia-cidade-de-maragogi-04:
  pergunta: O Grand Oca Maragogi fica no centro de Maragogi?
  resposta: Não. O Grand Oca Maragogi fica em Ponta de Mangue, ao norte do centro da cidade, e normalmente é preciso usar táxi, transfer ou carro para ir ao centro. O resort tem agência de viagens que reserva traslados e passeios pelos arredores, contratados à parte.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5543
  fontes: *a6
e-guia-cidade-de-maragogi-05:
  pergunta: Como chegar a Maragogi saindo de Recife ou de Maceió?
  resposta: Saindo de Recife, o acesso é feito por estrada, pelo litoral sul de Pernambuco até Maragogi, em cerca de 126 km. Saindo de Maceió, pelo litoral norte de Alagoas, são cerca de 136 km até Ponta de Mangue. O trecho final costuma ser feito de carro, táxi ou transfer.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5544
  fontes: *a6
e-guia-cidade-de-maragogi-06:
  pergunta: Maragogi é um destino bom para famílias?
  resposta: Sim. A cidade combina praias calmas, piscinas naturais rasas e estrutura de hospedagem, e o Grand Oca Maragogi oferece Kids Club, parque aquático e playground para as crianças. Passeios às piscinas naturais exigem atenção com horários de maré e cuidados com os corais.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 5545
  fontes: *a6
e-post-como-escolher-acomodacao-01:
  pergunta: Como escolher a acomodação ideal no Grand Oca Maragogi?
  resposta: Comece pelo número de hóspedes e pela idade das crianças, depois compare a vista e a localização. Os bangalôs ficam ao lado das piscinas, o Standard Comunicante reúne até seis pessoas, os quartos Deluxe têm varanda para a piscina da área D’Água, e a Suíte Deluxe, de 72 m², é a maior do resort.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5560
  fontes: *a3
e-post-como-escolher-acomodacao-02:
  pergunta: Vale a pena pagar mais por um quarto na área D’Água?
  resposta: Depende do perfil. A área D’Água é a mais nova do Grand Oca Maragogi, com varanda para a piscina, solário, parque aquático e decoração mais clara, e é indicada para quem valoriza conforto e vista. Quem prefere um ambiente mais reservado e rústico pode ficar nos apartamentos Standard ou nos bangalôs.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5561
  fontes: *a3
e-post-como-escolher-acomodacao-03:
  pergunta: Qual é a melhor acomodação para casal no Grand Oca Maragogi?
  resposta: Para casais, o Grand Oca Maragogi tem o Bangalô, a Suíte, com cama king e vista parcial para a praia, e os quartos Deluxe, de varanda para a piscina. As Suítes são apenas duas, então reserve cedo, e os bangalôs oferecem a escolha entre vista para o jardim e para a piscina.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5562
  fontes: *a3
e-post-como-escolher-acomodacao-04:
  pergunta: Qual é a melhor acomodação para uma família grande no Grand Oca Maragogi?
  resposta: Para famílias maiores, o Standard Comunicante acomoda até seis hóspedes em dois quartos e dois banheiros, e a Suíte Deluxe, de 72 m², recebe até seis, com no máximo quatro adultos e duas crianças. O Duplo Deluxe acomoda cinco, e a idade das crianças muda a tarifa.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 5563
  fontes: *a3
e-post-o-que-levar-na-mala-01:
  pergunta: O que levar na mala para a praia e as piscinas do Grand Oca Maragogi?
  resposta: Leve duas ou três roupas de banho, canga ou toalha de praia, chinelo, chapéu, óculos de sol e protetor solar, que deve ser reaplicado depois de cada mergulho. O resort fica a cerca de 10 metros da Praia de Ponta de Mangue, então a maior parte do tempo é de roupa leve e de banho.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5580
  fontes: *a1
e-post-o-que-levar-na-mala-02:
  pergunta: O que levar para os passeios às piscinas naturais de Maragogi?
  resposta: Leve calçado próprio para a água, roupa de proteção solar, uma capa para o celular e, se quiser, máscara de snorkel. A profundidade média dos recifes é de cerca de um metro, mas o fundo tem corais. Aulas e passeios de mergulho são contratados à parte, no resort.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5581
  fontes: *a1
e-post-o-que-levar-na-mala-03:
  pergunta: As tomadas do Grand Oca Maragogi são 110 V ou 220 V?
  resposta: Os apartamentos do Grand Oca Maragogi têm tomadas de 220 volts. Antes de viajar, confira se carregadores, secadores e outros aparelhos são bivolt ou leve um adaptador adequado. O resort oferece Wi-Fi, e um carregador portátil é útil para os passeios.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5582
  fontes: *a1
e-post-o-que-levar-na-mala-04:
  pergunta: Que documentos levar para o Grand Oca Maragogi?
  resposta: Leve documento oficial com foto de todos os hóspedes, inclusive das crianças, CPF (estrangeiros levam o passaporte) e, para menores que viajam sem os pais, a autorização dos responsáveis. A certidão de nascimento ou o RG comprova a filiação de cada criança, conforme o Estatuto da Criança e do Adolescente.
  tema: resort
  paginas:
    - post:o-que-levar-na-mala
  ordem: 5583
  fontes: *a1
e-post-resort-com-criancas-01:
  pergunta: Como funciona a recreação infantil para quem viaja com crianças ao Grand Oca Maragogi?
  resposta: O Kids Club organiza atividades diárias para crianças de 4 a 12 anos, das 9h às 12h e das 14h às 18h, com jogos, oficinas, shows e opções na piscina e na praia. Menores de 4 anos participam de algumas atividades com um responsável, e a programação muda ao longo da semana.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5600
  fontes: *a5
e-post-resort-com-criancas-02:
  pergunta: Onde as crianças brincam no Grand Oca Maragogi?
  resposta: As crianças brincam no Kids Club, no parque aquático com toboágua, nas áreas rasas das piscinas, no playground com cama elástica e escorregadores e na praia de Ponta de Mangue. O Play Zone é outro espaço de brinquedos, e a baby area apoia as famílias com bebês.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5601
  fontes: *a5
e-post-resort-com-criancas-03:
  pergunta: Qual acomodação escolher para a família no Grand Oca Maragogi?
  resposta: Para três pessoas, o Apartamento Standard e o Bangalô Triplo funcionam bem; para cinco, o Duplo Deluxe; para seis, o Standard Comunicante ou a Suíte Deluxe. A idade de cada criança deve ser informada na cotação, porque ela define a tarifa e a capacidade.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5602
  fontes: *a5
e-post-resort-com-criancas-04:
  pergunta: Há berço e estrutura para bebês no Grand Oca Maragogi?
  resposta: O resort tem uma baby area para atender hóspedes com crianças pequenas, e os bangalôs aceitam dois adultos e um bebê em berço. Confirme com a equipe da Resorts Online a disponibilidade do berço na categoria escolhida e as idades consideradas, antes de finalizar a reserva.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 5603
  fontes: *a5
g-home-01:
  pergunta: Vale a pena se hospedar no Grand Oca Maragogi Resort?
  resposta: Para quem quer praia e all inclusive em Alagoas, o Grand Oca Maragogi Resort entrega a areia a cerca de dez metros, piscinas por quase quatrocentos metros, quatro restaurantes, sete bares e recreação infantil na mesma diária. A estrutura atende casais e famílias; mergulho, spa e passeios ficam fora do regime.
  tema: resort
  paginas:
    - home
  ordem: 6000
  fontes:
    - /
g-home-02:
  pergunta: Como é um dia no Grand Oca Maragogi Resort?
  resposta: Um dia comum começa com o café no Restaurante dos Corais, das 7h às 10h, segue para a praia e as piscinas, tem almoço das 12h30 às 15h, chá da tarde das 16h30 às 17h30 e jantar das 19h às 22h. A programação para adultos vai das 9h às 23h.
  tema: resort
  paginas:
    - home
  ordem: 6001
  fontes:
    - /
g-home-03:
  pergunta: Quantas noites vale a pena ficar no Grand Oca Maragogi Resort?
  resposta: Não existe número fixo. Como a quantidade de jantares incluídos nos três restaurantes temáticos varia conforme as noites contratadas, estadias mais longas permitem conhecer mais deles. A central de reservas ajuda a dimensionar o período pelas datas e pelo perfil do grupo.
  tema: reservas
  paginas:
    - home
  ordem: 6002
  fontes:
    - /
g-home-04:
  pergunta: O Grand Oca Maragogi Resort tem outro nome?
  resposta: Sim. O nome completo é Grand Oca Maragogi Beach & Leisure Resort, e o hotel aparece nas buscas também como Grand Oca Maragogi All Inclusive Resort, Grand Oca Resort ou apenas Grand Oca Maragogi. Todas as variações indicam o mesmo endereço, na Praia de Ponta de Mangue, em Maragogi, Alagoas.
  tema: resort
  paginas:
    - home
  ordem: 6003
  fontes:
    - /
g-home-05:
  pergunta: O Grand Oca Maragogi Resort é um resort grande?
  resposta: 'É um resort de porte: 420 unidades de hospedagem em nove categorias espalhadas por jardins de coqueiros, um conjunto de piscinas que se estende por quase 400 metros, quatro restaurantes, sete bares e praça de alimentação. Caminhos de pedra ligam as acomodações às piscinas, aos restaurantes e à faixa de areia.'
  tema: resort
  paginas:
    - home
  ordem: 6004
  fontes:
    - /
g-home-06:
  pergunta: O Grand Oca Maragogi Resort é indicado para a primeira viagem a Maragogi?
  resposta: Sim. Quem visita Maragogi pela primeira vez encontra a praia logo adiante, refeições e bebidas selecionadas já na diária e uma agência de viagens dentro do resort para reservar traslados e passeios aos recifes. O centro de mergulho PADI organiza as saídas às piscinas naturais, contratadas à parte.
  tema: resort
  paginas:
    - home
  ordem: 6005
  fontes:
    - /
g-home-07:
  pergunta: O Grand Oca Maragogi Resort fica no litoral norte ou no litoral sul de Alagoas?
  resposta: 'Fica no litoral norte de Alagoas, na Praia de Ponta de Mangue, em Maragogi, dentro da região conhecida como Costa dos Corais. Esse trecho de praias está entre duas capitais: Recife, a 126 quilômetros, e Maceió, a 136 quilômetros, pelas distâncias rodoviárias que o hotel informa.'
  tema: localizacao
  paginas:
    - home
  ordem: 6006
  fontes:
    - /
g-home-08:
  pergunta: O Grand Oca Maragogi Resort é mais indicado para casais ou para famílias?
  resposta: Atende os dois perfis. As famílias contam com Kids Club de 4 a 12 anos, parque aquático, playground e categorias para até seis hóspedes. Os casais têm bangalôs para duas pessoas, a Suíte do andar superior, com vista parcial para a praia, e bares dedicados a coquetéis.
  tema: resort
  paginas:
    - home
  ordem: 6007
  fontes:
    - /
g-home-09:
  pergunta: O Grand Oca Maragogi Resort tem praia privativa?
  resposta: O resort está a cerca de 10 metros da Praia de Ponta de Mangue e mantém um bar na areia com serviço de bebidas, mas não divulga praia privativa. A Experiência VIP Premium reserva um trecho de praia a quem contrata o serviço, das 9h às 17h, para maiores de 14 anos.
  tema: resort
  paginas:
    - home
  ordem: 6008
  fontes:
    - /
g-home-10:
  pergunta: O Grand Oca Maragogi Resort tem day use?
  resposta: O hotel não divulga venda de day use, e este portal trabalha com diárias de hospedagem e pacotes com aéreo para quem pernoita no Grand Oca Maragogi. Para saber se existe alguma modalidade de uso por um dia, fale com a central de reservas 0800 737 6787.
  tema: reservas
  paginas:
    - home
  ordem: 6009
  fontes:
    - /
g-resort-01:
  pergunta: Como as áreas do Grand Oca Maragogi Resort estão distribuídas?
  resposta: O terreno reúne prédios de apartamentos de dois andares e bangalôs térreos entre gramados e coqueiros, a faixa de piscinas que acompanha os bangalôs, a área D’Água dos quartos Deluxe, a rua de pedras com restaurantes e lojas, a Esplanada Tropical dos shows e a praia.
  tema: resort
  paginas:
    - resort
  ordem: 6010
  fontes:
    - /o-resort/
g-resort-02:
  pergunta: Qual é a área total do Grand Oca Maragogi Resort?
  resposta: 'O hotel não divulga a área total em metros quadrados, por isso este site não publica esse dado. Os números disponíveis são outros: 420 unidades de hospedagem, nove categorias, piscinas que se estendem por quase 400 metros e a Praia de Ponta de Mangue a cerca de 10 metros.'
  tema: resort
  paginas:
    - resort
  ordem: 6011
  fontes:
    - /o-resort/
g-resort-03:
  pergunta: Quando o Grand Oca Maragogi Resort foi inaugurado?
  resposta: A data de inauguração não é informada pelo hotel, então o ano de abertura não aparece neste site. O que a fonte indica é que a área D’Água, com solário, piscina de borda infinita e os quartos Deluxe, é a parte mais recente do Grand Oca Maragogi.
  tema: resort
  paginas:
    - resort
  ordem: 6012
  fontes:
    - /o-resort/
g-resort-04:
  pergunta: Em quais países a rede Oca Hotels tem hotéis?
  resposta: A Oca Hotels, rede responsável pelo Grand Oca Maragogi, reúne hotéis no Brasil, em Portugal e na Espanha. Este portal, porém, é da agência de viagens Resorts Online e trata apenas da hospedagem no resort de Maragogi, sem representar os demais empreendimentos do grupo nem o atendimento da rede.
  tema: resort
  paginas:
    - resort
  ordem: 6013
  fontes:
    - /o-resort/
g-resort-05:
  pergunta: O que é a rua de compras do Grand Oca Maragogi?
  resposta: É a via interna de pedras onde ficam as lojas e os pontos da praça de alimentação, como o Onda Oca Hamburguer Bar, a Cantina Mex Oca, a Pizzoca e a Gelattoca. A fachada do Restaurante dos Corais, com o letreiro de coral laranja, também se volta para esse trecho.
  tema: resort
  paginas:
    - resort
  ordem: 6014
  fontes:
    - /o-resort/
g-resort-06:
  pergunta: O Grand Oca Maragogi Resort tem classificação por estrelas?
  resposta: 'O hotel não publica classificação oficial por estrelas, e este site não atribui nenhuma. A referência possível é a própria estrutura: regime all inclusive, 420 unidades em nove categorias, quatro restaurantes, sete bares, Kids Club, academia e centro de mergulho na Praia de Ponta de Mangue.'
  tema: resort
  paginas:
    - resort
  ordem: 6015
  fontes:
    - /o-resort/
g-resort-07:
  pergunta: Onde ficam os prédios de apartamentos e os bangalôs no Grand Oca Maragogi?
  resposta: Os apartamentos Standard e o Standard Comunicante ocupam prédios de dois andares, com varandas de madeira em meio ao gramado e ao coqueiral. Os bangalôs são construções térreas de tijolos aparentes vizinhas às piscinas, e os quartos Deluxe estão nos edifícios mais novos, na área D’Água.
  tema: resort
  paginas:
    - resort
  ordem: 6016
  fontes:
    - /o-resort/
g-resort-08:
  pergunta: O Grand Oca Maragogi Resort tem alguma área exclusiva para adultos?
  resposta: As áreas de lazer são de uso comum. A exceção é a Experiência VIP Premium, armada em um trecho da praia, das 9h às 17h, com hostess, camas na areia, serviço de bebidas e brunch servido no restaurante Ix’U. Esse espaço não admite menores de 14 anos e tem preço próprio.
  tema: resort
  paginas:
    - resort
  ordem: 6017
  fontes:
    - /o-resort/
g-resort-09:
  pergunta: Quantas pessoas o Grand Oca Maragogi Resort recebe?
  resposta: A capacidade total de hóspedes não é divulgada. O hotel informa 420 unidades de hospedagem, com limites que vão de duas a seis pessoas por acomodação, conforme a categoria. Nos restaurantes, o Corais tem salão para 340 pessoas e o Ix’U, ambiente para até 70.
  tema: resort
  paginas:
    - resort
  ordem: 6018
  fontes:
    - /o-resort/
g-resort-10:
  pergunta: O Grand Oca Maragogi Resort tem cabanas e espreguiçadeiras nas áreas abertas?
  resposta: As imagens do resort mostram cabanas de cortinas brancas com espreguiçadeiras sobre o gramado, em frente aos bangalôs e perto dos canteiros floridos, além de espreguiçadeiras e guarda-sóis na faixa de areia de Ponta de Mangue. Nenhuma cobrança ou reserva prévia é informada para esses espaços.
  tema: resort
  paginas:
    - resort
  ordem: 6019
  fontes:
    - /o-resort/
g-servicos-01:
  pergunta: Quais serviços do Grand Oca Maragogi são cobrados à parte?
  resposta: Têm cobrança própria o salão de beleza, as lojas, o centro de mergulho PADI e a agência de viagens que reserva traslados e passeios. Sem custo adicional para o hóspede aparecem o Guest Service, o Wi-Fi, a academia com aulas programadas, a enfermaria de primeiros socorros e a baby area.
  tema: hospedagem
  paginas:
    - servicos
  ordem: 6020
  fontes:
    - /o-resort/servicos/
g-servicos-02:
  pergunta: O Wi-Fi do Grand Oca Maragogi é gratuito?
  resposta: O acesso à internet sem fio consta entre os serviços sem cobrança adicional do Grand Oca Maragogi, disponível nas áreas do resort. A qualidade do sinal pode variar conforme o ponto, a ocupação e o momento da estadia, e o resort não divulga limite de dispositivos nem franquia de dados.
  tema: hospedagem
  paginas:
    - servicos
  ordem: 6021
  fontes:
    - /o-resort/servicos/
g-servicos-03:
  pergunta: O Grand Oca Maragogi oferece berço para bebês?
  resposta: Os bangalôs vista jardim e vista piscina aceitam dois adultos e um bebê em berço, conforme a descrição das categorias. Como o hotel não publica a quantidade de berços nem a regra para as demais categorias, confirme a disponibilidade com a equipe da Resorts Online ao fechar a reserva.
  tema: hospedagem
  paginas:
    - servicos
  ordem: 6022
  fontes:
    - /o-resort/servicos/
g-servicos-04:
  pergunta: As acomodações do Grand Oca Maragogi têm cofre?
  resposta: O cofre aparece na descrição dos quartos Deluxe com duas camas grandes e da Suíte Deluxe, cujo armário reúne cofre e frigobar. Para as outras categorias o hotel não informa o item, então vale perguntar na recepção ou no Guest Service durante a estadia em Ponta de Mangue.
  tema: hospedagem
  paginas:
    - servicos
  ordem: 6023
  fontes:
    - /o-resort/servicos/
g-servicos-05:
  pergunta: Os banheiros do Grand Oca Maragogi têm secador de cabelo e amenities?
  resposta: Sim. O Apartamento Standard e os bangalôs são descritos com banheiro de chuveiro e secador de cabelo. A Suíte traz amenities exclusivos no banheiro de mármore, e a Suíte Deluxe inclui kit de amenities. As fotos mostram box de vidro, bancada e espelho redondo iluminado.
  tema: hospedagem
  paginas:
    - servicos
  ordem: 6024
  fontes:
    - /o-resort/servicos/
g-servicos-06:
  pergunta: Dá para preparar café ou chá no quarto do Grand Oca Maragogi?
  resposta: Nos quartos Deluxe, as fotos registram uma bandeja com chaleira elétrica, xícaras e sachês de chá e café. A Suíte Deluxe conta com cafeteira Nespresso. Nas demais categorias, o hotel descreve frigobar e telefone, sem mencionar equipamento para bebidas quentes dentro da acomodação.
  tema: hospedagem
  paginas:
    - servicos
  ordem: 6025
  fontes:
    - /o-resort/servicos/
g-acomodacoes-01:
  pergunta: Quais configurações de cama as acomodações do Grand Oca Maragogi têm?
  resposta: O Standard combina cama de casal com uma de solteiro ou três camas de solteiro, e o Comunicante distribui uma de casal e três de solteiro em dois quartos. Os bangalôs têm casal ou duas de solteiro, com cama extra no Triplo, e as categorias Deluxe usam camas extragrandes e sofá-cama.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6026
  fontes:
    - /acomodacoes/
g-acomodacoes-02:
  pergunta: As acomodações do Grand Oca Maragogi têm cozinha ou kitchenette?
  resposta: 'Não. Nenhuma das nove categorias é descrita com cozinha ou kitchenette: o item que aparece é o frigobar, com reposição diária dos produtos definidos pelo regime. Os quartos Deluxe trazem bandeja com chaleira elétrica e a Suíte Deluxe, cafeteira Nespresso, mas as refeições acontecem nos restaurantes.'
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6027
  fontes:
    - /acomodacoes/
g-acomodacoes-03:
  pergunta: Quais acomodações do Grand Oca Maragogi são térreas?
  resposta: Os bangalôs vista jardim, vista piscina e triplo são unidades térreas, vizinhas às piscinas principais. Já o Apartamento Standard e o Standard Comunicante ocupam prédios de dois andares, e as duas Suítes ficam no pavimento superior. O hotel não informa se os edifícios têm elevador.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6028
  fontes:
    - /acomodacoes/
g-acomodacoes-04:
  pergunta: As acomodações do Grand Oca Maragogi têm Smart TV?
  resposta: Depende da categoria. O Standard, os bangalôs e o Triplo são descritos com TV LED de 32 polegadas. O Standard Comunicante, o Deluxe com duas camas grandes, o Duplo Deluxe e a Suíte Deluxe aparecem com Smart TV, e a Suíte tem aparelho de 50 polegadas.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6029
  fontes:
    - /acomodacoes/
g-acomodacoes-05:
  pergunta: Como são os banheiros das acomodações do Grand Oca Maragogi?
  resposta: As fotos registram banheiros com box de vidro, bancada e espelho redondo, revestidos de granito escuro no Standard e de madeira nas categorias Deluxe. A Suíte é a única descrita com acabamento em mármore e chuveiro separado, e o Standard Comunicante é a categoria que tem dois banheiros.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6030
  fontes:
    - /acomodacoes/
g-acomodacoes-06:
  pergunta: Qual é o estilo da decoração das acomodações do Grand Oca Maragogi?
  resposta: O Apartamento Standard é apresentado com estilo rústico e aconchegante. Nos bangalôs, as paredes de tijolos aparentes convivem com cabeceira de palha trançada e móveis de vime. Na área D’Água, os quartos Deluxe apostam no azul-turquesa das banquetas e das espreguiçadeiras, com piso de madeira clara.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6031
  fontes:
    - /acomodacoes/
g-acomodacoes-07:
  pergunta: Quais acomodações do Grand Oca Maragogi ficam na área D’Água?
  resposta: 'São três categorias: o Deluxe com duas camas grandes, para até quatro hóspedes, o Duplo Deluxe com sofá-cama, de 50 m² e até cinco pessoas, e a Suíte Deluxe, de 72 m² e até seis. Todas têm varanda voltada para a piscina e para o parque aquático.'
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6032
  fontes:
    - /acomodacoes/
g-acomodacoes-08:
  pergunta: Quais acomodações do Grand Oca Maragogi têm sala de estar?
  resposta: Duas categorias. A Suíte, no pavimento superior, divide-se em sala, quarto e banheiro de mármore, com cama king size. A Suíte Deluxe distribui 72 m² entre quarto e sala com sofá-cama, além da varanda. Nas outras categorias o ambiente é único, com ou sem varanda.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6033
  fontes:
    - /acomodacoes/
g-acomodacoes-09:
  pergunta: Quais acomodações do Grand Oca Maragogi têm vista para a piscina?
  resposta: O Bangalô Vista Piscina, com 48 unidades, é voltado para a água. Na área D’Água, as três categorias Deluxe têm varanda de frente para a piscina e os escorregadores, e a Suíte olha para a piscina central. Os bangalôs vista jardim e o Triplo dão para o verde.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6034
  fontes:
    - /acomodacoes/
g-acomodacoes-10:
  pergunta: As acomodações do Grand Oca Maragogi têm telefone no quarto?
  resposta: O telefone aparece na descrição do Apartamento Standard, do Standard Comunicante e dos três tipos de bangalô, sempre acompanhado de ar-condicionado split e frigobar. Nas categorias Deluxe e nas Suítes, o hotel destaca outros itens, como cofre, Smart TV e frigobar, e não cita o aparelho.
  tema: hospedagem
  paginas:
    - acomodacoes
  ordem: 6035
  fontes:
    - /acomodacoes/
g-comparativo-01:
  pergunta: Quantas unidades tem cada categoria do Grand Oca Maragogi?
  resposta: O hotel divulga 120 apartamentos Standard, 49 bangalôs vista jardim, 48 bangalôs vista piscina, 49 bangalôs triplos e 2 Suítes. Para o Standard Comunicante e para as três categorias Deluxe não há total informado, embora o resort reúna 420 unidades de hospedagem no conjunto.
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6036
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-02:
  pergunta: Qual é a diferença entre o Bangalô Vista Jardim e o Bangalô Vista Piscina?
  resposta: 'A estrutura é idêntica: construção térrea junto às piscinas, cama de casal ou duas de solteiro, ar-condicionado split, TV de 32 polegadas e frigobar, para dois adultos e um bebê em berço. O que muda é a orientação, um voltado ao paisagismo e o outro à água.'
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6037
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-03:
  pergunta: Qual é a diferença entre o Apartamento Standard e os bangalôs do Grand Oca Maragogi?
  resposta: O Standard fica em prédio de dois andares entre os jardins, recebe até três hóspedes e responde pela maior parte do inventário, com 120 unidades. Os bangalôs são construções térreas coladas às piscinas, para dois adultos, e apenas o Triplo acrescenta cama extra para um terceiro hóspede.
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6038
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-04:
  pergunta: Qual é a diferença entre a Suíte e a Suíte Deluxe do Grand Oca Maragogi?
  resposta: A Suíte são duas unidades no pavimento superior, com cama king size, sala, banheiro de mármore e vista parcial para a praia, pensadas para casais. A Suíte Deluxe tem 72 m² na área D’Água, duas camas extragrandes, sofá-cama, Nespresso e varanda, para até seis hóspedes.
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6039
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-05:
  pergunta: Qual é a diferença entre o Deluxe com 2 Camas Grandes e o Duplo Deluxe com Sofá-cama?
  resposta: Os dois estão na área D’Água, com varanda voltada para a piscina. O Deluxe com duas camas grandes recebe até quatro hóspedes. O Duplo Deluxe tem 50 m² e configuração fixa de duas camas de casal mais sofá-cama, chegando a cinco pessoas, no máximo quatro adultos e uma criança.
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6040
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-06:
  pergunta: Quais metragens o Grand Oca Maragogi publica?
  resposta: 'Apenas duas categorias têm área informada: o Duplo Deluxe com Sofá-cama, de 50 m², e a Suíte Deluxe, de 72 m², a mais ampla do resort. Para o Standard, o Comunicante, os bangalôs e a Suíte a metragem não é divulgada, e este site não estima números.'
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6041
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-07:
  pergunta: Qual categoria do Grand Oca Maragogi é melhor para três hóspedes?
  resposta: Duas categorias recebem trios. O Apartamento Standard acomoda três adultos, ou um casal com uma criança de até 12 anos, em prédio voltado para o jardim. O Bangalô Triplo soma uma cama extra à de casal e fica junto às piscinas principais, em ambiente térreo.
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6042
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-08:
  pergunta: Qual categoria do Grand Oca Maragogi é melhor para seis hóspedes?
  resposta: Existem duas saídas para grupos de seis. O Standard Comunicante interliga dois quartos, com duas varandas e dois banheiros, em meio aos jardins. A Suíte Deluxe reúne 72 m², sala de estar e varanda para a piscina da área D’Água, limitada a quatro adultos e duas crianças.
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6043
  fontes:
    - /acomodacoes/comparativo/
g-comparativo-09:
  pergunta: Quais categorias do Grand Oca Maragogi são classificadas como Deluxe?
  resposta: 'São três: o Deluxe com duas camas grandes, o Duplo Deluxe com sofá-cama e a Suíte Deluxe. Todas ficam nos edifícios mais recentes, com varanda, Smart TV, frigobar e acesso ao complexo aquático da área D’Água. O hotel não publica benefícios exclusivos dessas categorias.'
  tema: hospedagem
  paginas:
    - comparativo
  ordem: 6044
  fontes:
    - /acomodacoes/comparativo/
g-all-inclusive-01:
  pergunta: O all inclusive do Grand Oca Maragogi funciona 24 horas?
  resposta: O hotel não divulga nenhum ponto de alimentação aberto 24 horas, e este site não repete essa afirmação. O que existe publicado são os horários das refeições, do café às 7h ao fim do jantar, às 22h, mais os snacks da praça de alimentação e o serviço dos bares.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6045
  fontes:
    - /all-inclusive/
g-all-inclusive-02:
  pergunta: O all inclusive do Grand Oca Maragogi tem alguma refeição no meio da tarde?
  resposta: Sim. Entre o almoço, que termina às 15h, e o jantar, que começa às 19h, o regime oferece o chá da tarde, das 16h30 às 17h30. Os petiscos da praça de alimentação e os snacks dos bares também entram na diária, conforme o ponto de serviço.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6046
  fontes:
    - /all-inclusive/
g-all-inclusive-03:
  pergunta: Os lanches entre as refeições estão incluídos no Grand Oca Maragogi?
  resposta: Sim. A praça de alimentação reúne o Onda Oca Hamburguer Bar, com sanduíches e hambúrgueres, a Cantina Mex Oca, de burritos e tacos, a Pizzoca, de pizzas, e a Gelattoca, de picolés e sorvetes. Os bares completam com lanches e snacks, conforme cada ponto.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6047
  fontes:
    - /all-inclusive/
g-all-inclusive-04:
  pergunta: A água de coco e os sucos estão no all inclusive do Grand Oca Maragogi?
  resposta: Sim. O regime cobre água, água de coco, sucos e refrigerantes, servidos nos restaurantes e nos bares do resort, ao lado de cervejas, caipirinhas, destilados, taças de vinho e coquetéis selecionados. As marcas mudam conforme o ponto de serviço e podem ser alteradas sem aviso prévio.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6048
  fontes:
    - /all-inclusive/
g-all-inclusive-05:
  pergunta: O room service está incluído no all inclusive do Grand Oca Maragogi?
  resposta: Não. O serviço de quarto fica fora do regime, assim como bebidas importadas, espumante, vinho em garrafa e itens que não constam no cardápio all inclusive. Serviços extras não gastronômicos, como spa, mergulho e passeios, também têm cobrança própria, informada no próprio resort.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6049
  fontes:
    - /all-inclusive/
g-all-inclusive-06:
  pergunta: A Experiência VIP Premium está incluída no all inclusive do Grand Oca Maragogi?
  resposta: Não. O espaço montado na faixa de areia, com atendimento dedicado e brunch, abre das 9h às 17h, tem condições e preço próprios e recebe apenas hóspedes acima de 14 anos. Quem não contrata o serviço continua usando restaurantes, bares e praia dentro do regime.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6050
  fontes:
    - /all-inclusive/
g-all-inclusive-07:
  pergunta: Quantos pontos de alimentação o all inclusive do Grand Oca Maragogi reúne?
  resposta: São quatro restaurantes, o Corais, o Ix’U, o Il Giardino e o La Brasa, mais sete bares e uma praça com quatro pontos de petiscos. Quase tudo entra na diária; ficam de fora itens específicos de bebida e os serviços cobrados separadamente, como o room service.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6051
  fontes:
    - /all-inclusive/
g-all-inclusive-08:
  pergunta: O que muda entre o almoço e o jantar no all inclusive do Grand Oca Maragogi?
  resposta: No almoço, das 12h30 às 15h, a escolha fica entre o buffet do Restaurante dos Corais e o churrasco descontraído do La Brasa, onde se come até de traje de banho. No jantar, das 19h às 22h, o Corais divide a cena com os temáticos, que pedem reserva.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6052
  fontes:
    - /all-inclusive/
g-all-inclusive-09:
  pergunta: Existe limite de bebidas no all inclusive do Grand Oca Maragogi?
  resposta: 'O hotel não publica limite de consumo para as bebidas do regime. O que varia é a disponibilidade: certas marcas aparecem apenas em determinados bares ou restaurantes, e o cardápio pode mudar sem aviso. Vinhos em garrafa, espumantes e rótulos importados seguem fora da diária.'
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6053
  fontes:
    - /all-inclusive/
g-all-inclusive-10:
  pergunta: As bebidas do all inclusive são servidas nos restaurantes temáticos do Grand Oca Maragogi?
  resposta: Sim. O Ix’U, o Il Giardino e o La Brasa integram o regime, e as bebidas do cardápio acompanham o jantar, incluindo cervejas em garrafa que o resort reserva a esses ambientes. O Ix’U mantém ainda uma carta exclusiva de vinhos, cujas garrafas não entram na diária.
  tema: all-inclusive
  paginas:
    - allInclusive
  ordem: 6054
  fontes:
    - /all-inclusive/
g-restaurantes-01:
  pergunta: O Grand Oca Maragogi tem praça de alimentação?
  resposta: 'Sim. Além dos quatro restaurantes, o resort mantém uma praça com quatro pontos de petiscos na rua de compras: Onda Oca Hamburguer Bar, Cantina Mex Oca, Pizzoca e Gelattoca. A proposta é lanchar fora dos horários das refeições, com sanduíches, comida mexicana, pizzas e sorvetes.'
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6055
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-02:
  pergunta: Existe traje exigido nos restaurantes do Grand Oca Maragogi?
  resposta: 'O único registro sobre vestimenta é o do La Brasa: no almoço, o churrasco é tão informal que se pode comer até de traje de banho. Para o jantar nos ambientes temáticos, o resort não divulga exigência de traje, apenas a reserva prévia no Guest Service.'
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6056
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-03:
  pergunta: Qual é a capacidade dos restaurantes do Grand Oca Maragogi?
  resposta: O Restaurante dos Corais, principal do resort, tem salão para 340 pessoas, com janelas panorâmicas voltadas ao mar. O Ix’U atende até 70 pessoas em ambiente lounge na beira da praia. Para o Il Giardino e o La Brasa o hotel não divulga número de lugares.
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6057
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-04:
  pergunta: Qual restaurante do Grand Oca Maragogi tem show cooking?
  resposta: O Restaurante dos Corais prepara pratos à vista do hóspede no almoço e no jantar, no formato show cooking, dentro do buffet de culinária regional. É o mesmo salão do café da manhã, servido das 7h às 10h, com mesas de toalha branca sob teto de madeira.
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6058
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-05:
  pergunta: Algum restaurante do Grand Oca Maragogi tem carta de vinhos?
  resposta: Sim, o Ix’U. O restaurante de cozinha fusion mantém uma carta exclusiva de vinhos, em ambiente lounge à beira da praia, com reserva prévia no Guest Service. As taças de vinho selecionadas entram no all inclusive, enquanto garrafas e espumantes são cobrados à parte.
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6059
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-06:
  pergunta: Quais pratos aparecem nos cardápios dos restaurantes temáticos do Grand Oca Maragogi?
  resposta: O Il Giardino traz focaccia, cappelloni ao molho de queijos, spaghetti al nero di seppia e filé mignon. O Ix’U serve pescada amarela com arroz cremoso de camarão. No La Brasa, as entradas incluem pão de alho, choripán e provoleta, seguidas de cortes bovinos e suínos.
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6060
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-07:
  pergunta: Quais sobremesas os restaurantes do Grand Oca Maragogi servem?
  resposta: No Il Giardino, a escolha fica entre tiramisù e panna cotta. O Ix’U oferece brownie de chocolate branco ou petit gâteau. O La Brasa encerra o jantar com pudim, mousse de chocolate e arroz doce, e o buffet do Corais traz sobremesas no almoço e no jantar.
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6061
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-08:
  pergunta: Onde ficam os restaurantes do Grand Oca Maragogi?
  resposta: O Corais tem fachada na rua de pedras e salão voltado para o mar. O Ix’U ocupa um ambiente lounge nas margens da praia. O Il Giardino recebe em salão com painel de tijolos, e o La Brasa trabalha com a cozinha de lenha aparente à mostra.
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6062
  fontes:
    - /all-inclusive/restaurantes/
g-restaurantes-09:
  pergunta: Os restaurantes do Grand Oca Maragogi abrem no almoço e no jantar?
  resposta: O Corais é o único com as três refeições, a partir das 7h, das 12h30 e das 19h. O La Brasa funciona no almoço como churrascaria descontraída e à noite como temático de carnes. O Ix’U e o Il Giardino entram no jantar, sempre com reserva prévia.
  tema: all-inclusive
  paginas:
    - restaurantes
  ordem: 6063
  fontes:
    - /all-inclusive/restaurantes/
g-bares-01:
  pergunta: Qual é o horário dos bares do Grand Oca Maragogi?
  resposta: O resort não publica os horários dos sete bares, porque eles mudam conforme a operação, a ocupação e a época do ano. A orientação é conferir no local, já na chegada, quais pontos estão abertos em cada período do dia e também à noite.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6064
  fontes:
    - /all-inclusive/bares/
g-bares-02:
  pergunta: Qual bar do Grand Oca Maragogi tem terraço com vista para a praia?
  resposta: O Bar Coqueirais, principal do resort, fica ao lado da piscina central e tem terraço panorâmico voltado para a Praia de Ponta de Mangue. Na areia, o Bar Ponta de Mangue serve bebidas com o mar à frente, e o Drink Parrot fica diante do Coqueirais.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6065
  fontes:
    - /all-inclusive/bares/
g-bares-03:
  pergunta: Os bares do Grand Oca Maragogi servem comida?
  resposta: Alguns servem. O Coqueirais tem lanches e snacks ao lado da piscina, e o bar da Piscina D’Água mantém área de snacks e gelados, além de receber o chá da tarde. Os demais pontos aparecem na fonte apenas com serviço de bebidas do regime.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6066
  fontes:
    - /all-inclusive/bares/
g-bares-04:
  pergunta: Quais bares do Grand Oca Maragogi ficam na área das piscinas?
  resposta: Quatro dos sete. O Coqueirais fica ao lado da piscina principal, o Galés funciona dentro da água, o Drink Parrot cuida dos coquetéis em frente ao Coqueirais e o bar da Piscina D’Água atende a nova área, com snacks, gelados e o serviço do chá da tarde.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6067
  fontes:
    - /all-inclusive/bares/
g-bares-05:
  pergunta: Quais bares do Grand Oca Maragogi ficam fora da área das piscinas?
  resposta: São três. O Bar Ponta de Mangue atende na faixa de areia, o Bar Esplanada Tropical fica onde a equipe de animação apresenta os shows e funciona como ponto de convivência em família, e o SportBar ocupa a área esportiva, para acompanhar os jogos.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6068
  fontes:
    - /all-inclusive/bares/
g-bares-06:
  pergunta: As bebidas importadas são servidas nos bares do Grand Oca Maragogi?
  resposta: As bebidas incluídas são as do cardápio all inclusive, com marcas nacionais de cerveja, chope, destilados e coquetéis. Rótulos importados, espumantes e vinhos em garrafa não fazem parte do regime e, quando houver, seguem condições próprias informadas em cada ponto de serviço.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6069
  fontes:
    - /all-inclusive/bares/
g-bares-07:
  pergunta: Onde o chá da tarde é servido no Grand Oca Maragogi?
  resposta: Das 16h30 às 17h30, o chá da tarde é montado no terraço junto ao Restaurante dos Corais e no bar da nova área de piscinas, o mesmo que tem snacks e gelados. O serviço integra o regime e acompanha a programação de cada dia.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6070
  fontes:
    - /all-inclusive/bares/
g-bares-08:
  pergunta: Qual bar do Grand Oca Maragogi fica mais perto dos bangalôs?
  resposta: Os bangalôs ficam ao lado das piscinas principais, e é ali que estão o Bar Coqueirais, na borda, e o Bar Galés, dentro da água. Quem se hospeda nessas unidades pede uma bebida sem atravessar o resort, e o Drink Parrot está a poucos passos.
  tema: all-inclusive
  paginas:
    - bares
  ordem: 6071
  fontes:
    - /all-inclusive/bares/
g-lazer-01:
  pergunta: O que é a Esplanada Tropical do Grand Oca Maragogi?
  resposta: É o espaço onde a equipe de animação apresenta os espetáculos da noite, com temas regionais, nacionais e internacionais para adultos e crianças. O local tem bar próprio e funciona como ponto de convivência das famílias. A agenda varia e pode mudar sem aviso prévio.
  tema: lazer
  paginas:
    - lazer
  ordem: 6072
  fontes:
    - /lazer/
g-lazer-02:
  pergunta: O que é a Arena Taba do Grand Oca Maragogi?
  resposta: É um espaço de apresentações ao ar livre que o resort usa durante o verão, somando-se à Esplanada Tropical na agenda de entretenimento. Como depende da temporada e do tempo, vale conferir na chegada se há alguma atividade marcada ali durante a sua estadia.
  tema: lazer
  paginas:
    - lazer
  ordem: 6073
  fontes:
    - /lazer/
g-lazer-03:
  pergunta: Quem organiza as atividades de lazer no Grand Oca Maragogi?
  resposta: A equipe de animação conduz a programação para adultos, das 9h às 23h, entre atividades esportivas, aquáticas, recreativas e de dança, além dos shows. As crianças têm equipe própria de entretenimento infantil, responsável pelo Kids Club e pelas brincadeiras na piscina e na areia.
  tema: lazer
  paginas:
    - lazer
  ordem: 6074
  fontes:
    - /lazer/
g-lazer-04:
  pergunta: Onde consultar a programação de lazer do dia no Grand Oca Maragogi?
  resposta: A agenda muda ao longo da semana, por isso vale pedir a programação do dia logo na chegada e confirmar com a equipe de animação ou no Guest Service. Horários e modalidades podem ser alterados conforme o tempo, a ocupação e a operação do resort.
  tema: lazer
  paginas:
    - lazer
  ordem: 6075
  fontes:
    - /lazer/
g-lazer-05:
  pergunta: As atividades de lazer do Grand Oca Maragogi estão incluídas na diária?
  resposta: 'A maior parte está: piscinas, parque aquático, playground, Kids Club, academia com aulas, esportes e shows entram no regime. Ficam de fora o centro de mergulho, os serviços do spa e do salão de beleza, os passeios da agência de viagens e o traslado do aeroporto.'
  tema: lazer
  paginas:
    - lazer
  ordem: 6076
  fontes:
    - /lazer/
g-lazer-06:
  pergunta: O Grand Oca Maragogi tem lazer à beira da praia?
  resposta: Sim. A faixa de areia de Ponta de Mangue, logo adiante dos jardins, aparece com espreguiçadeiras e guarda-sóis entre os coqueiros e tem bar com serviço de bebidas. O caiaque entra na programação diurna, e a equipe infantil leva brincadeiras para a areia.
  tema: lazer
  paginas:
    - lazer
  ordem: 6077
  fontes:
    - /lazer/
g-lazer-07:
  pergunta: Quais áreas de lazer do Grand Oca Maragogi funcionam à noite?
  resposta: A Esplanada Tropical concentra os shows, o SportBar transmite os jogos e os restaurantes atendem das 19h às 22h, com os temáticos sob reserva. A programação para adultos se encerra às 23h e, no verão, a Arena Taba pode receber apresentações ao ar livre.
  tema: lazer
  paginas:
    - lazer
  ordem: 6078
  fontes:
    - /lazer/
g-lazer-08:
  pergunta: O Grand Oca Maragogi tem sala de jogos ou cinema?
  resposta: O hotel não informa sala de jogos nem cinema. Os espaços de entretenimento divulgados são a Esplanada Tropical, dos shows, a Arena Taba, usada no verão, o SportBar, para assistir aos jogos, e o Play Zone, tenda de brinquedos voltada ao público infantil.
  tema: lazer
  paginas:
    - lazer
  ordem: 6079
  fontes:
    - /lazer/
g-lazer-09:
  pergunta: O Grand Oca Maragogi tem programação para adolescentes?
  resposta: Não há clube de adolescentes divulgado. O Kids Club atende crianças de 4 a 12 anos e, a partir dessa idade, o hóspede acompanha a programação para adultos, das 9h às 23h, com esportes, atividades aquáticas e shows. A Experiência VIP Premium recebe somente maiores de 14 anos.
  tema: lazer
  paginas:
    - lazer
  ordem: 6080
  fontes:
    - /lazer/
g-lazer-10:
  pergunta: É preciso se inscrever nas atividades de lazer do Grand Oca Maragogi?
  resposta: 'O resort não informa inscrição prévia para as atividades da programação diária, que acontecem nos horários divulgados no local. A reserva aparece em outro contexto: o jantar nos restaurantes temáticos, marcado no Guest Service, com a quantidade de vezes conforme as noites da hospedagem.'
  tema: lazer
  paginas:
    - lazer
  ordem: 6081
  fontes:
    - /lazer/
g-piscinas-01:
  pergunta: As piscinas do Grand Oca Maragogi são aquecidas?
  resposta: O hotel não informa aquecimento em nenhuma das piscinas, por isso este site não afirma que há água aquecida. O que a fonte descreve são várias piscinas com profundidades diferentes ao longo de quase 400 metros, mais a área D’Água e o parque aquático infantil.
  tema: lazer
  paginas:
    - piscinas
  ordem: 6082
  fontes:
    - /lazer/piscinas/
g-piscinas-02:
  pergunta: O Grand Oca Maragogi tem jacuzzi?
  resposta: As imagens da área D’Água mostram uma jacuzzi circular, revestida de pedra escura, junto à piscina de borda infinita e aos edifícios de apartamentos. O resort não publica horário de funcionamento nem regra de uso desse ponto, então vale confirmar na recepção durante a estadia.
  tema: lazer
  paginas:
    - piscinas
  ordem: 6083
  fontes:
    - /lazer/piscinas/
g-piscinas-03:
  pergunta: Como é a piscina de borda infinita do Grand Oca Maragogi?
  resposta: Fica na área D’Água, a parte mais nova do resort, com deck de solário e espreguiçadeiras na beira e os prédios de varandas de vidro ao fundo. É a mesma área que reúne o parque aquático infantil e o bar da Piscina D’Água.
  tema: lazer
  paginas:
    - piscinas
  ordem: 6084
  fontes:
    - /lazer/piscinas/
g-piscinas-04:
  pergunta: As piscinas do Grand Oca Maragogi têm formatos diferentes?
  resposta: Sim. O conjunto inclui uma piscina em formato de lagoa, com ilhas de grama e coqueiros altos ao redor, trechos de contorno sinuoso vistos do alto, uma ponte de madeira sobre a água e caminhos de pedra entre os bangalôs de telhado de cerâmica.
  tema: lazer
  paginas:
    - piscinas
  ordem: 6085
  fontes:
    - /lazer/piscinas/
g-piscinas-05:
  pergunta: O Grand Oca Maragogi tem solário?
  resposta: Sim. A área D’Água tem deck de solário com espreguiçadeiras na borda da piscina, diante dos apartamentos. Nos jardins, cabanas de cortinas brancas abrigam outras espreguiçadeiras, e a faixa de areia recebe guarda-sóis. Nenhum desses espaços aparece com cobrança ou necessidade de reserva.
  tema: lazer
  paginas:
    - piscinas
  ordem: 6086
  fontes:
    - /lazer/piscinas/
g-piscinas-06:
  pergunta: Qual é o horário das piscinas do Grand Oca Maragogi?
  resposta: O resort não publica horário de abertura e de fechamento das piscinas. O que tem hora marcada são as atividades na água, como hidro, hidro fitness e a recreação infantil, que seguem a programação do dia e podem mudar conforme o tempo e a operação.
  tema: lazer
  paginas:
    - piscinas
  ordem: 6087
  fontes:
    - /lazer/piscinas/
g-piscinas-07:
  pergunta: As piscinas do Grand Oca Maragogi têm salva-vidas?
  resposta: O hotel não informa serviço de salva-vidas nas piscinas, e este site não afirma que exista. O que a fonte publica é que as profundidades variam de um trecho para outro e que há áreas rasas e parque aquático voltados às crianças, sempre sob atenção dos responsáveis.
  tema: lazer
  paginas:
    - piscinas
  ordem: 6088
  fontes:
    - /lazer/piscinas/
g-piscinas-08:
  pergunta: Quantas áreas de piscina o Grand Oca Maragogi tem?
  resposta: 'A fonte descreve três conjuntos: a piscina principal, em frente aos bangalôs, a área D’Água, com solário e borda infinita, e o parque aquático infantil, com toboágua e trechos rasos. O número exato de piscinas não é divulgado, apenas a extensão de quase 400 metros.'
  tema: lazer
  paginas:
    - piscinas
  ordem: 6089
  fontes:
    - /lazer/piscinas/
g-criancas-01:
  pergunta: O Grand Oca Maragogi tem baby area?
  resposta: Sim. A baby area é um espaço de apoio às famílias que viajam com bebês e crianças pequenas, citado entre as comodidades do resort. Os menores de até 3 anos podem participar de algumas atividades acompanhados por um responsável, já que a recreação organizada começa aos 4 anos.
  tema: lazer
  paginas:
    - criancas
  ordem: 6090
  fontes:
    - /lazer/criancas/
g-criancas-02:
  pergunta: O que é o Play Zone do Grand Oca Maragogi?
  resposta: É uma tenda colorida com brinquedos infantis, instalada junto a um caminho de piso intertravado, entre os coqueiros das áreas de lazer. Funciona como alternativa ao playground e ao parque aquático para as crianças brincarem fora da água em algum momento do dia.
  tema: lazer
  paginas:
    - criancas
  ordem: 6091
  fontes:
    - /lazer/criancas/
g-criancas-03:
  pergunta: O Grand Oca Maragogi tem toboágua para crianças?
  resposta: Sim. O parque aquático infantil tem escorregadores amarelo e roxo e uma torre de brinquedos aquáticos montada em trecho raso da piscina, cercada por coqueiros e bangalôs. Existe ainda uma piscina infantil rasa com escorregador laranja, pensada para os hóspedes menores.
  tema: lazer
  paginas:
    - criancas
  ordem: 6092
  fontes:
    - /lazer/criancas/
g-criancas-04:
  pergunta: O que é o Family Oca do Grand Oca Maragogi?
  resposta: É uma atividade feita para a família toda, listada na programação das crianças de 8 a 12 anos. Entra na agenda ao lado de gincanas, jogos esportivos e da festa da espuma, e os dias e horários acompanham a programação divulgada no resort durante a estadia.
  tema: lazer
  paginas:
    - criancas
  ordem: 6093
  fontes:
    - /lazer/criancas/
g-criancas-05:
  pergunta: O Grand Oca Maragogi tem esportes dentro da piscina para as crianças?
  resposta: Sim. A programação infantil inclui hidro kids para quem tem de 4 a 7 anos e, na faixa de 8 a 12 anos, basquete e polo aquático, além da corrida de prancha. As atividades acontecem nas piscinas, conforme a agenda do dia e a idade de cada grupo.
  tema: lazer
  paginas:
    - criancas
  ordem: 6094
  fontes:
    - /lazer/criancas/
g-criancas-06:
  pergunta: O Grand Oca Maragogi tem festa da espuma?
  resposta: Sim. A festa da espuma aparece na programação das crianças de 8 a 12 anos, junto com gincanas, jogos esportivos e caminhada ecológica. Como o restante da agenda infantil, depende do dia e pode ser alterada conforme o tempo e a operação do resort.
  tema: lazer
  paginas:
    - criancas
  ordem: 6095
  fontes:
    - /lazer/criancas/
g-criancas-07:
  pergunta: As crianças ficam sozinhas no Kids Club do Grand Oca Maragogi?
  resposta: Entre 4 e 12 anos, as crianças participam das atividades com a equipe de entretenimento infantil, das 9h às 12h e das 14h às 18h. Abaixo dessa idade, entram apenas em algumas brincadeiras com um responsável por perto, e há uma baby area no resort.
  tema: lazer
  paginas:
    - criancas
  ordem: 6096
  fontes:
    - /lazer/criancas/
g-criancas-08:
  pergunta: O Grand Oca Maragogi tem caminhada ecológica para as crianças?
  resposta: 'Sim. A caminhada ecológica integra a programação das crianças de 8 a 12 anos, ao lado de jogos esportivos, gincanas e corrida de prancha. Não há percurso nem duração divulgados: a atividade segue a agenda do Kids Club e a orientação da equipe infantil.'
  tema: lazer
  paginas:
    - criancas
  ordem: 6097
  fontes:
    - /lazer/criancas/
g-criancas-09:
  pergunta: O Grand Oca Maragogi tem cardápio infantil?
  resposta: O hotel não publica um cardápio exclusivo para crianças. O que existe são opções que costumam agradar aos pequenos dentro do regime, como o buffet do Restaurante dos Corais, as massas do Il Giardino e a praça de petiscos com hambúrgueres, pizzas, sorvetes e picolés.
  tema: lazer
  paginas:
    - criancas
  ordem: 6098
  fontes:
    - /lazer/criancas/
g-criancas-10:
  pergunta: As crianças têm equipe própria no Grand Oca Maragogi?
  resposta: Sim. O Kids Club é conduzido por uma equipe de entretenimento infantil, que organiza jogos, oficinas, shows e brincadeiras na piscina e na areia para a faixa de 4 a 12 anos. Os adultos acompanham outra programação, com a equipe de animação, das 9h às 23h.
  tema: lazer
  paginas:
    - criancas
  ordem: 6099
  fontes:
    - /lazer/criancas/
g-esportes-01:
  pergunta: Como é a academia do Grand Oca Maragogi?
  resposta: 'As imagens mostram um espaço amplo, com esteiras e aparelhos de musculação diante de uma parede vermelha. Além do uso dos equipamentos, há aulas marcadas na agenda: Cardio HIT, GAP, funcional, Pilates com bola, alongamento e também o hidro fitness, feito dentro da piscina.'
  tema: lazer
  paginas:
    - esportes
  ordem: 6100
  fontes:
    - /lazer/esportes/
g-esportes-02:
  pergunta: A academia do Grand Oca Maragogi está incluída na diária?
  resposta: A academia aparece entre os serviços sem cobrança adicional, ao lado do Guest Service, do Wi-Fi, da enfermaria e da baby area. Já o centro de mergulho, o spa, o salão de beleza e os passeios reservados pela agência de viagens têm valores próprios, cobrados no resort.
  tema: lazer
  paginas:
    - esportes
  ordem: 6101
  fontes:
    - /lazer/esportes/
g-esportes-03:
  pergunta: O Grand Oca Maragogi tem futebol e jogos com bola?
  resposta: Sim. Jogos e atividades com bola fazem parte da recreação esportiva conduzida pela equipe de animação, ao lado do vôlei e do beach tênis disputados em quadras de areia. As modalidades mudam de um dia para outro e seguem a agenda divulgada no resort.
  tema: lazer
  paginas:
    - esportes
  ordem: 6102
  fontes:
    - /lazer/esportes/
g-esportes-04:
  pergunta: Quem nunca mergulhou pode usar o centro de mergulho do Grand Oca Maragogi?
  resposta: 'O centro tem certificação PADI e oferece aulas, além de levar os hóspedes às piscinas naturais em frente ao resort, com cilindro ou com snorkel. O hotel não publica exigência de experiência anterior nem de certificado: as condições são apresentadas no próprio centro de mergulho.'
  tema: lazer
  paginas:
    - esportes
  ordem: 6103
  fontes:
    - /lazer/esportes/
g-esportes-05:
  pergunta: Os esportes do Grand Oca Maragogi têm horário fixo?
  resposta: Não exatamente. As modalidades entram na programação diurna e variam ao longo da semana, de acordo com o tempo, a ocupação e a operação. Caiaque, vôlei, beach tênis, futebol, hidro e as aulas da academia aparecem em dias e horários anunciados no resort.
  tema: lazer
  paginas:
    - esportes
  ordem: 6104
  fontes:
    - /lazer/esportes/
g-esportes-06:
  pergunta: O Grand Oca Maragogi empresta equipamento para as atividades esportivas?
  resposta: O hotel não detalha o empréstimo de material esportivo. O que a fonte informa é que caiaque, vôlei, beach tênis, futebol e as aulas de ginástica fazem parte da programação incluída, enquanto o equipamento de mergulho fica a cargo do centro PADI, contratado à parte.
  tema: lazer
  paginas:
    - esportes
  ordem: 6105
  fontes:
    - /lazer/esportes/
g-esportes-07:
  pergunta: O Grand Oca Maragogi tem aulas de dança?
  resposta: Sim. A dança está entre as atividades da programação para adultos, que vai das 9h às 23h e reúne ainda esportes, jogos aquáticos e recreação. À noite, a Esplanada Tropical recebe os shows da equipe de animação, com repertório regional, nacional e internacional.
  tema: lazer
  paginas:
    - esportes
  ordem: 6106
  fontes:
    - /lazer/esportes/
g-esportes-08:
  pergunta: A academia do Grand Oca Maragogi tem idade mínima?
  resposta: O resort não publica idade mínima para usar a academia nem para participar das aulas de ginástica. Como as atividades descritas para o público infantil são as do Kids Club, de 4 a 12 anos, vale confirmar a regra com a equipe antes de levar adolescentes ao espaço.
  tema: lazer
  paginas:
    - esportes
  ordem: 6107
  fontes:
    - /lazer/esportes/
g-esportes-09:
  pergunta: O Grand Oca Maragogi tem atividades esportivas na areia?
  resposta: Sim. O caiaque sai da Praia de Ponta de Mangue, dentro da programação diurna, e as quadras de areia recebem vôlei e beach tênis em dias alternados. Para o mar aberto, o centro de mergulho PADI organiza as saídas de snorkel e de cilindro até os recifes.
  tema: lazer
  paginas:
    - esportes
  ordem: 6108
  fontes:
    - /lazer/esportes/
g-bem-estar-01:
  pergunta: É preciso agendar horário no Grand Oca Spa?
  resposta: O atendimento do Grand Oca Spa acontece por agendamento, e os tratamentos, os horários e os valores são informados no próprio resort. Como o espaço não tem agenda publicada, a recomendação prática é procurar a recepção ou o Guest Service no começo da hospedagem.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6109
  fontes:
    - /bem-estar/
g-bem-estar-02:
  pergunta: O Grand Oca Maragogi publica os preços do spa e do salão de beleza?
  resposta: Nenhuma fonte traz valores para o Grand Oca Spa nem para o Espaço Beleza, e este site não estima preços. O hotel informa apenas que esses serviços têm condições próprias, apresentadas no local, fora do que a diária all inclusive cobre durante a estadia.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6110
  fontes:
    - /bem-estar/
g-bem-estar-03:
  pergunta: O Grand Oca Maragogi tem sauna?
  resposta: A sauna não aparece entre os espaços divulgados. Na área de bem-estar, o resort informa o Grand Oca Spa, o Espaço Beleza, aberto todos os dias, e a academia com aulas programadas, somados ao deck de solário e às piscinas da área D’Água.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6111
  fontes:
    - /bem-estar/
g-bem-estar-04:
  pergunta: Dá para fazer as unhas e o cabelo durante a hospedagem no Grand Oca Maragogi?
  resposta: Sim. O Espaço Beleza funciona todos os dias, com serviços de manicure e cabeleireiro cobrados à parte da diária. É o mesmo espaço que aparece entre as comodidades do resort como salão de beleza, e os horários e valores são informados no local.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6112
  fontes:
    - /bem-estar/
g-bem-estar-05:
  pergunta: O Grand Oca Maragogi é indicado para uma viagem de descanso?
  resposta: Para quem busca sossego, o resort reúne a praia a cerca de dez metros, deck de solário na área D’Água, cabanas com espreguiçadeiras nos jardins, spa e salão de beleza. A programação de atividades é opcional, e o Kids Club concentra o movimento das crianças.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6113
  fontes:
    - /bem-estar/
g-bem-estar-06:
  pergunta: Qual é o horário da academia do Grand Oca Maragogi?
  resposta: O resort não publica o horário de funcionamento da academia. O que tem hora definida são as aulas programadas, como Cardio HIT, funcional, Pilates com bola, alongamento e hidro fitness, que entram na agenda do dia e podem mudar conforme a operação e o tempo.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6114
  fontes:
    - /bem-estar/
g-bem-estar-07:
  pergunta: Dá para manter uma alimentação mais leve no Grand Oca Maragogi?
  resposta: O buffet do Restaurante dos Corais serve saladas, pratos quentes, massas e sobremesas no almoço e no jantar, o que permite montar refeições mais simples. Entre as bebidas do regime há água, água de coco e sucos. O resort não divulga menu dietético específico.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6115
  fontes:
    - /bem-estar/
g-bem-estar-08:
  pergunta: Dá para contratar os serviços do spa do Grand Oca Maragogi antes da viagem?
  resposta: Os serviços de bem-estar são contratados no próprio resort, com condições e valores informados lá. A Resorts Online trabalha com a hospedagem e com o pacote que inclui as passagens, e não comercializa tratamentos de spa, serviços de salão de beleza ou aulas de mergulho.
  tema: lazer
  paginas:
    - bemEstar
  ordem: 6116
  fontes:
    - /bem-estar/
g-experiencias-01:
  pergunta: As experiências do Grand Oca Maragogi têm preço publicado?
  resposta: Nenhuma delas. O mergulho com o centro PADI, os passeios e traslados da agência de viagens, o Grand Oca Spa, o Espaço Beleza e a Experiência VIP Premium têm valores informados no momento da contratação, dentro do resort, e por isso não aparecem neste site.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6117
  fontes:
    - /experiencias/
g-experiencias-02:
  pergunta: A Experiência VIP Premium do Grand Oca Maragogi aceita crianças?
  resposta: Não. A entrada é permitida somente a partir dos 14 anos, e o espaço funciona das 9h às 17h. Famílias com crianças menores seguem com o restante da estrutura, incluindo a praia, as piscinas, o parque aquático e o Kids Club, tudo dentro do regime all inclusive.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6118
  fontes:
    - /experiencias/
g-experiencias-03:
  pergunta: Onde é servido o brunch da Experiência VIP Premium do Grand Oca Maragogi?
  resposta: No Ix’U, restaurante de cozinha fusion em ambiente lounge à beira da praia. O brunch faz parte do pacote da experiência, que funciona das 9h às 17h em um trecho reservado da areia, com atendimento dedicado e serviço de bebidas para quem contrata.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6119
  fontes:
    - /experiencias/
g-experiencias-04:
  pergunta: Dá para mergulhar com cilindro no Grand Oca Maragogi?
  resposta: Sim. O centro de mergulho do resort, com certificação PADI, organiza saídas às piscinas naturais em frente à praia tanto em mergulho com cilindro quanto em snorkel, além de dar aulas. O serviço é contratado à parte, e as condições são apresentadas no local.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6120
  fontes:
    - /experiencias/
g-experiencias-05:
  pergunta: Quais experiências do Grand Oca Maragogi são indicadas para casais?
  resposta: Entre as opções pagas, os casais costumam procurar o Grand Oca Spa, o Espaço Beleza, o trecho reservado da Experiência VIP Premium e o jantar no Ix’U, que mantém carta exclusiva de vinhos. As saídas aos recifes também são reservadas na agência de viagens do resort.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6121
  fontes:
    - /experiencias/
g-experiencias-06:
  pergunta: As experiências do Grand Oca Maragogi dependem do tempo?
  resposta: Em parte. O resort avisa que a programação, os horários e o funcionamento das atrações podem mudar sem aviso prévio ou por causa do clima, o que pesa sobretudo nas saídas de mergulho e de snorkel aos recifes. Spa e salão seguem o agendamento combinado.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6122
  fontes:
    - /experiencias/
g-experiencias-07:
  pergunta: As experiências do Grand Oca Maragogi precisam ser reservadas com antecedência?
  resposta: A orientação da fonte é informar-se no resort ou na agência de viagens que funciona lá dentro para contratar mergulho, passeios e traslados. Não há prazo mínimo divulgado, mas convém resolver no início da hospedagem, porque as saídas dependem de disponibilidade e do dia.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6123
  fontes:
    - /experiencias/
g-experiencias-08:
  pergunta: O Grand Oca Maragogi tem experiências gastronômicas cobradas à parte?
  resposta: Sim. A Experiência VIP Premium inclui brunch no Ix’U, bebidas e atendimento na praia, com preço próprio e idade mínima de 14 anos. Fora dela, vinhos em garrafa, espumantes, rótulos importados e o room service também ficam de fora do regime e são cobrados separadamente.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6124
  fontes:
    - /experiencias/
g-experiencias-09:
  pergunta: As experiências do Grand Oca Maragogi são vendidas pela Resorts Online?
  resposta: Não. A agência cuida da hospedagem e dos pacotes com aéreo para o resort. Mergulho, passeios, traslados, spa e salão de beleza são contratados no próprio Grand Oca Maragogi, com a agência de viagens que atende os hóspedes dentro da estrutura do hotel.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6125
  fontes:
    - /experiencias/
g-experiencias-10:
  pergunta: Quais experiências do Grand Oca Maragogi acontecem fora do resort?
  resposta: As saídas aos recifes e às piscinas naturais da Costa dos Corais, organizadas pelo centro de mergulho e pela agência de viagens, além dos traslados até o aeroporto. O spa, o Espaço Beleza e a Experiência VIP Premium, por sua vez, acontecem dentro da área do resort.
  tema: lazer
  paginas:
    - experiencias
  ordem: 6126
  fontes:
    - /experiencias/
g-datas-especiais-01:
  pergunta: Quais feriados têm página própria no site do Grand Oca Maragogi?
  resposta: 'São onze datas: Réveillon, Carnaval, Páscoa, Tiradentes, Dia do Trabalho, Sete de Setembro, Dia das Crianças, Finados, Proclamação da República, Consciência Negra e Natal. Cada página mostra quando o feriado cai e o que esperar da estadia no resort naquele período.'
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6127
  fontes:
    - /datas-especiais/
g-datas-especiais-02:
  pergunta: Quais feriados caem no verão em Maragogi?
  resposta: O Réveillon e o Carnaval são as datas do verão alagoano, justamente quando a Arena Taba, espaço de apresentações ao ar livre, costuma entrar na agenda do resort. São também períodos de alta procura, com condições, noites mínimas e disponibilidade variando a cada ano.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6128
  fontes:
    - /datas-especiais/
g-datas-especiais-03:
  pergunta: Os feriados mudam a programação de lazer do Grand Oca Maragogi?
  resposta: O resort não divulga agenda específica para feriados, por isso este site não descreve atrações exclusivas dessas datas. Vale lembrar que as atividades, os shows e o funcionamento das atrações podem ser alterados sem aviso ou por causa do tempo, em qualquer época do ano.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6129
  fontes:
    - /datas-especiais/
g-datas-especiais-04:
  pergunta: Dá para emendar feriados no Grand Oca Maragogi?
  resposta: Sim. As emendas, sobretudo as de novembro, estão entre os períodos mais procurados do resort, ao lado de Réveillon, Carnaval, Páscoa e Natal. Como as datas mudam a cada ano, as páginas de feriados mostram quando cada uma cai, e a central confirma a disponibilidade.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6130
  fontes:
    - /datas-especiais/
g-datas-especiais-05:
  pergunta: Como saber em que dia cai cada feriado no Grand Oca Maragogi?
  resposta: Cada data especial tem uma página no site, com o dia em que o feriado cai e a janela de noites em volta dele. Assim fica mais simples montar o roteiro, comparar as categorias de acomodação e pedir a cotação já para o período certo.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6131
  fontes:
    - /datas-especiais/
g-datas-especiais-06:
  pergunta: Os horários das refeições mudam nos feriados do Grand Oca Maragogi?
  resposta: O resort não divulga horários diferentes para datas especiais. Seguem valendo o café da manhã a partir das 7h, o almoço ao meio-dia e meia, o chá da tarde às 16h30 e o jantar até as 22h, com a ressalva de que a operação pode mudar.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6132
  fontes:
    - /datas-especiais/
g-datas-especiais-07:
  pergunta: O Carnaval de Maragogi fica perto do Grand Oca Maragogi?
  resposta: O resort está em Ponta de Mangue, ao norte do centro de Maragogi, onde acontecem os bailes, o frevo e os desfiles. A distância normalmente exige transporte, então quem quiser acompanhar a folia precisa combinar táxi, carro alugado ou outro deslocamento até a cidade.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6133
  fontes:
    - /datas-especiais/
g-datas-especiais-08:
  pergunta: O Grand Oca Maragogi tem ceia de Natal ou de Réveillon?
  resposta: O hotel não publica detalhes de ceia nem de festa para essas noites, por isso este site não descreve a programação. O que está confirmado é que o regime all inclusive continua valendo nos feriados, com os quatro restaurantes, os sete bares e a praça de alimentação.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6134
  fontes:
    - /datas-especiais/
g-datas-especiais-09:
  pergunta: Quais acomodações do Grand Oca Maragogi esgotam primeiro nos feriados?
  resposta: A Suíte Deluxe, a maior do resort, é apontada como categoria de procura alta em feriados, e a Suíte tem apenas duas unidades, o que limita a oferta. Para grupos de seis, as alternativas são o Standard Comunicante e a própria Suíte Deluxe, então consulte as datas cedo.
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6135
  fontes:
    - /datas-especiais/
g-datas-especiais-10:
  pergunta: Dá para reservar pacote com aéreo para um feriado no Grand Oca Maragogi?
  resposta: 'Sim. As duas modalidades valem para datas especiais: apenas a hospedagem ou o pacote que soma a diária all inclusive às passagens, normalmente para Recife ou Maceió. Em feriados a antecedência pesa mais, porque voos e categorias ficam limitados conforme a procura do período.'
  tema: reservas
  paginas:
    - datasEspeciais
  ordem: 6136
  fontes:
    - /datas-especiais/
g-destino-01:
  pergunta: Maragogi é a cidade mais turística de Alagoas?
  resposta: É a segunda, atrás de Maceió. Antiga vila de pescadores, a cidade vive hoje do turismo, movimento puxado pelos recifes e pelas piscinas naturais da Costa dos Corais, e mantém no centro três igrejas históricas e um Carnaval de rua bastante animado.
  tema: destino
  paginas:
    - destino
  ordem: 6137
  fontes:
    - /maragogi/
g-destino-02:
  pergunta: As piscinas naturais de Maragogi são rasas?
  resposta: São. A fonte informa profundidade média em torno de um metro na área de corais, o que explica a fama do destino entre quem faz snorkel. Com tão pouca água, é possível observar os bancos de corais e os peixes coloridos sem precisar de cilindro.
  tema: destino
  paginas:
    - destino
  ordem: 6138
  fontes:
    - /maragogi/
g-destino-03:
  pergunta: As piscinas naturais de Maragogi ficam em área protegida?
  resposta: Sim. Os recifes e as piscinas naturais estão em uma APA, Área de Preservação Ambiental, e figuram entre as principais atrações turísticas da cidade. A proteção convive com a visitação, feita em saídas organizadas na região e pelo centro de mergulho que funciona no resort.
  tema: destino
  paginas:
    - destino
  ordem: 6139
  fontes:
    - /maragogi/
g-destino-04:
  pergunta: Que peixes é possível ver nos recifes de Maragogi?
  resposta: 'A fonte não cita nomes de espécies: informa apenas que os bancos de corais reúnem muitas espécies marinhas, entre as quais se destacam os peixes de cores vivas. A observação é feita em mergulho com cilindro ou com snorkel, por causa da água rasa dos recifes.'
  tema: destino
  paginas:
    - destino
  ordem: 6140
  fontes:
    - /maragogi/
g-destino-05:
  pergunta: Quando foi construída a Matriz de Santo Antônio, em Maragogi?
  resposta: No fim do século XIX. A igreja fica no centro da cidade e é o templo histórico mais preservado de Maragogi, que também guarda construções religiosas bem mais antigas, do século XVII, como as de Nossa Senhora da Guia e de São Bento, hoje reduzidas às paredes externas.
  tema: destino
  paginas:
    - destino
  ordem: 6141
  fontes:
    - /maragogi/
g-destino-06:
  pergunta: As igrejas de Nossa Senhora da Guia e São Bento ainda estão de pé?
  resposta: As duas são do século XVII e hoje conservam somente as paredes externas, conforme a fonte. Ficam no centro de Maragogi, perto da Matriz de Santo Antônio, e compõem o roteiro histórico de quem quer conhecer a cidade além das praias e dos recifes.
  tema: destino
  paginas:
    - destino
  ordem: 6142
  fontes:
    - /maragogi/
g-destino-07:
  pergunta: O mar de Maragogi é calmo?
  resposta: A fonte descreve mar azul-esmeralda e, na praia em frente ao resort, águas claras e tranquilas, sobretudo na maré baixa. A cidade fica na Costa dos Corais, no litoral norte de Alagoas, com praias de coqueirais. Nenhuma fonte publica dados de ondas ou de correntes.
  tema: destino
  paginas:
    - destino
  ordem: 6143
  fontes:
    - /maragogi/
g-destino-08:
  pergunta: Como são as praias de Maragogi?
  resposta: A fonte descreve praias de coqueirais, com troncos inclinados sobre a areia, faixas largas de areia e mar azul-esmeralda com recifes próximos. Em frente ao Grand Oca Maragogi fica a Praia de Ponta de Mangue, conhecida pelas águas claras, principalmente quando a maré está baixa.
  tema: destino
  paginas:
    - destino
  ordem: 6144
  fontes:
    - /maragogi/
g-destino-09:
  pergunta: Dá para conhecer as piscinas naturais de Maragogi sem saber nadar?
  resposta: 'Boa parte do passeio acontece em água rasa: a fonte fala em cerca de um metro na faixa de corais, medida que torna o lugar adequado ao snorkel. Ainda assim, nenhuma orientação de segurança é publicada: siga as instruções dos condutores e do centro de mergulho.'
  tema: destino
  paginas:
    - destino
  ordem: 6145
  fontes:
    - /maragogi/
g-fotos-01:
  pergunta: Como filtrar as fotos do Grand Oca Maragogi por área?
  resposta: A galeria é dividida em categorias, como resort, acomodações, restaurantes e bares, piscinas, crianças, esportes e lazer, spa e bem-estar e destino. Basta escolher o filtro desejado para ver apenas aquele conjunto de imagens, com a contagem de fotos ao lado de cada nome.
  tema: resort
  paginas:
    - fotos
  ordem: 6146
  fontes:
    - /fotos/
g-fotos-02:
  pergunta: As fotos do Grand Oca Maragogi abrem em tamanho maior?
  resposta: Sim. Cada imagem da galeria pode ser ampliada, o que ajuda a observar detalhes dos quartos, das piscinas e dos restaurantes antes de escolher a categoria de hospedagem. Os filtros por área permitem ver somente o que interessa ao perfil da sua viagem.
  tema: resort
  paginas:
    - fotos
  ordem: 6147
  fontes:
    - /fotos/
g-fotos-03:
  pergunta: As fotos do site do Grand Oca Maragogi têm descrição para leitores de tela?
  resposta: Sim. Todas as imagens publicadas estão registradas com um texto alternativo próprio, que descreve a cena, como a varanda do quarto Deluxe com espreguiçadeiras ou a piscina em formato de lagoa com ilhas de grama. Isso ajuda quem navega com leitor de tela.
  tema: resort
  paginas:
    - fotos
  ordem: 6148
  fontes:
    - /fotos/
g-fotos-04:
  pergunta: Há fotos aéreas do Grand Oca Maragogi?
  resposta: Sim. A galeria traz vistas do alto do conjunto do resort, dos bangalôs entre os coqueirais, dos edifícios mais novos, da faixa de areia com espreguiçadeiras e das piscinas de contorno sinuoso, além de uma imagem aérea das piscinas naturais da Costa dos Corais.
  tema: resort
  paginas:
    - fotos
  ordem: 6149
  fontes:
    - /fotos/
g-fotos-05:
  pergunta: As fotos do Grand Oca Maragogi mostram a praia?
  resposta: Mostram. Entre as imagens aparecem a Praia de Ponta de Mangue com coqueiros inclinados sobre a areia, a faixa larga de areia sob céu de nuvens, as espreguiçadeiras com guarda-sóis vistas do alto e o nascer do sol sobre o mar calmo.
  tema: resort
  paginas:
    - fotos
  ordem: 6150
  fontes:
    - /fotos/
g-fotos-06:
  pergunta: Dá para usar as fotos do site do Grand Oca Maragogi?
  resposta: As imagens publicadas aqui ilustram as páginas deste portal da Resorts Online. O uso de textos e de fotos por terceiros é tratado nos termos de uso do site, que devem ser consultados antes de qualquer reprodução. Em caso de dúvida, fale com a equipe.
  tema: resort
  paginas:
    - fotos
  ordem: 6151
  fontes:
    - /fotos/
g-como-chegar-01:
  pergunta: Qual rodovia leva ao Grand Oca Maragogi?
  resposta: O acesso é feito pela Rodovia AL-101 Norte, onde o resort fica sem número, em Ponta de Mangue, ao norte do centro de Maragogi, com CEP 57955-000. Como as condições de trânsito mudam, vale conferir a rota atualizada no mapa antes de sair.
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6152
  fontes:
    - /como-chegar/
g-como-chegar-02:
  pergunta: Quanto tempo de carro leva do aeroporto até o Grand Oca Maragogi?
  resposta: 'O tempo de estrada não é publicado neste site porque as fontes divergem entre si. O que está confirmado são as distâncias rodoviárias: cerca de 126 quilômetros desde Recife e cerca de 136 quilômetros desde Maceió, com o trecho final feito de carro ou transfer.'
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6153
  fontes:
    - /como-chegar/
g-como-chegar-03:
  pergunta: Como ir de Recife ao Grand Oca Maragogi?
  resposta: São cerca de 126 quilômetros pelo litoral sul de Pernambuco até Maragogi e, depois, o acesso pela AL-101 Norte até Ponta de Mangue. O aeroporto do Recife, de código REC, costuma ser o mais próximo em distância rodoviária entre os dois usados pelos hóspedes.
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6154
  fontes:
    - /como-chegar/
g-como-chegar-04:
  pergunta: Como ir de Maceió ao Grand Oca Maragogi?
  resposta: São cerca de 136 quilômetros pelo litoral norte de Alagoas até Ponta de Mangue. O aeroporto Zumbi dos Palmares, de código MCZ, pode ser a melhor escolha quando o voo, o horário ou o roteiro pela costa alagoana favorecem essa porta de entrada.
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6155
  fontes:
    - /como-chegar/
g-como-chegar-05:
  pergunta: É melhor contratar transfer ou alugar carro para chegar ao Grand Oca Maragogi?
  resposta: Depende do grupo. O transfer, privativo ou compartilhado, simplifica a chegada de famílias com crianças e bagagem. O carro alugado dá liberdade para conhecer praias e piscinas naturais da região. Compare o custo total, somando passagem, transporte e tempo de viagem, não apenas a distância.
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6156
  fontes:
    - /como-chegar/
g-como-chegar-06:
  pergunta: O transfer até o Grand Oca Maragogi é privativo ou compartilhado?
  resposta: 'As duas formas aparecem na fonte: o traslado entre o aeroporto e o resort pode ser privativo ou compartilhado, contratado conforme a disponibilidade e as condições do serviço. Ele não faz parte do all inclusive, então entra como item separado na organização da viagem.'
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6157
  fontes:
    - /como-chegar/
g-como-chegar-07:
  pergunta: O site do Grand Oca Maragogi mostra a rota no mapa?
  resposta: Sim. A página de como chegar traz o mapa com a rota de carro entre o aeroporto e o resort, além do marcador do endereço em Ponta de Mangue. Mesmo assim, confira a rota no dia da viagem, porque as estradas podem mudar de condição.
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6158
  fontes:
    - /como-chegar/
g-como-chegar-08:
  pergunta: Como planejar o horário de chegada ao Grand Oca Maragogi?
  resposta: O check-in começa às 15h, então vale somar o tempo do voo ao trecho final de estrada, de 126 quilômetros desde Recife ou 136 desde Maceió. Chegar mais cedo é possível, mas o early check-in depende de disponibilidade e das regras da tarifa contratada.
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6159
  fontes:
    - /como-chegar/
g-como-chegar-09:
  pergunta: Dá para chegar ao Grand Oca Maragogi de ônibus?
  resposta: O site não publica informação sobre linhas de ônibus até Ponta de Mangue. As formas de chegada descritas são o carro próprio, pela AL-101 Norte, o carro alugado, o táxi e o traslado entre o aeroporto e o resort, privativo ou compartilhado.
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6160
  fontes:
    - /como-chegar/
g-como-chegar-10:
  pergunta: O que levar em conta ao comparar voos para Recife e Maceió?
  resposta: 'Pese horários, tarifas e o custo do transporte terrestre, porque as distâncias são parecidas: 126 quilômetros de Recife e 136 de Maceió. Um voo mais barato pode sair mais caro com o traslado, e o horário de pouso influencia o momento do check-in.'
  tema: localizacao
  paginas:
    - comoChegar
  ordem: 6161
  fontes:
    - /como-chegar/
g-blog-01:
  pergunta: Quais assuntos o blog do Grand Oca Maragogi traz?
  resposta: 'São três artigos voltados ao planejamento da viagem: como escolher entre apartamentos, bangalôs, suítes e quartos Deluxe, o que levar na mala para a praia e as piscinas e como organizar as férias com crianças em Maragogi, na Costa dos Corais.'
  tema: destino
  paginas:
    - blog
  ordem: 6162
  fontes:
    - /blog/
g-blog-02:
  pergunta: Quem escreve o blog do Grand Oca Maragogi?
  resposta: Os textos são produzidos pela equipe da Resorts Online, agência que mantém este portal e vende hospedagem e pacotes para o resort. Por isso os artigos tratam de planejamento, escolha de categoria e organização da viagem, e não da operação diária do hotel.
  tema: destino
  paginas:
    - blog
  ordem: 6163
  fontes:
    - /blog/
g-blog-03:
  pergunta: O blog do Grand Oca Maragogi ajuda a escolher a acomodação?
  resposta: 'Ajuda. O artigo sobre o tema sugere começar pelo número de hóspedes e depois comparar vista e localização: bangalôs ao lado das piscinas, Standard Comunicante para seis pessoas, quartos Deluxe com varanda na área D’Água e a Suíte Deluxe, de 72 m², a maior de todas.'
  tema: destino
  paginas:
    - blog
  ordem: 6164
  fontes:
    - /blog/
g-blog-04:
  pergunta: O que o blog recomenda levar na mala para Maragogi?
  resposta: A lista reúne roupas leves, duas ou três roupas de banho, canga ou toalha, protetor solar, chapéu, óculos de sol, chinelo e calçado próprio para a água nos passeios aos recifes. Também lembra os documentos com foto de todos, inclusive das crianças.
  tema: destino
  paginas:
    - blog
  ordem: 6165
  fontes:
    - /blog/
g-blog-05:
  pergunta: O blog do Grand Oca Maragogi tem dicas para quem viaja com crianças?
  resposta: Tem. O artigo sobre férias em família explica como funciona a recreação de 4 a 12 anos, onde as crianças passam o dia, entre parque aquático e playground, e quais categorias acomodam grupos maiores. Também lembra de informar a idade de cada criança na cotação.
  tema: destino
  paginas:
    - blog
  ordem: 6166
  fontes:
    - /blog/
g-blog-06:
  pergunta: Os artigos do blog do Grand Oca Maragogi informam a data de atualização?
  resposta: Sim. Cada texto traz a data de publicação e a de atualização, o que ajuda a saber quando as informações foram revisadas pela última vez. Os três artigos no ar foram publicados em novembro de 2026 e tratam de planejamento e de viagem em família.
  tema: destino
  paginas:
    - blog
  ordem: 6167
  fontes:
    - /blog/
g-blog-07:
  pergunta: O blog do Grand Oca Maragogi fala sobre os passeios nas piscinas naturais?
  resposta: Fala. O artigo sobre a mala lembra que o fundo da área de corais tem recifes e sugere calçado próprio para a água, roupa de proteção solar e capa para o celular. As saídas são organizadas pelo centro PADI e pela agência de viagens, à parte.
  tema: destino
  paginas:
    - blog
  ordem: 6168
  fontes:
    - /blog/
g-blog-08:
  pergunta: Em quantas categorias o blog do Grand Oca Maragogi está organizado?
  resposta: 'Em duas: planejamento, que reúne o artigo sobre a escolha da acomodação e o que levar na mala, e família, com o texto sobre férias com crianças. A divisão ajuda a encontrar o conteúdo pelo tipo de dúvida antes de pedir uma cotação.'
  tema: destino
  paginas:
    - blog
  ordem: 6169
  fontes:
    - /blog/
g-blog-09:
  pergunta: O blog do Grand Oca Maragogi trata de acessibilidade?
  resposta: De forma pontual. O artigo sobre a escolha da acomodação lembra que o Standard Comunicante não tem adaptação para mobilidade reduzida e orienta informar a necessidade já na cotação, para que a equipe indique a categoria possível entre as nove do resort.
  tema: destino
  paginas:
    - blog
  ordem: 6170
  fontes:
    - /blog/
g-outros-resorts-01:
  pergunta: O que é a Rede Resort All Inclusive?
  resposta: É o conjunto de portais que a Resorts Online mantém para resorts all inclusive no Brasil, publicados em endereços do tipo resortallinclusive.com.br. Cada site reúne as informações de um resort, e o atendimento das cotações continua com a mesma equipe da agência de viagens.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6171
  fontes:
    - /outros-resorts/
g-outros-resorts-02:
  pergunta: Quais outros resorts aparecem na lista deste site?
  resposta: A relação traz resorts all inclusive de vários estados, como o Enotel Porto de Galinhas, em Pernambuco, e o Vila Galé Marés, em Guarajuba, na Bahia. Cada cartão indica o nome, a cidade ou a região, o estado e um resumo curto da estrutura.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6172
  fontes:
    - /outros-resorts/
g-outros-resorts-03:
  pergunta: Os outros resorts têm o mesmo atendimento do Grand Oca Maragogi?
  resposta: Sim. A mesma equipe da Resorts Online cota hospedagem e pacotes de todos os resorts da relação, por telefone, WhatsApp e e-mail. Isso permite comparar destinos e estruturas em um único contato, sem precisar repetir as informações da viagem a cada consulta.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6173
  fontes:
    - /outros-resorts/
g-outros-resorts-04:
  pergunta: Dá para comparar o Grand Oca Maragogi com outros resorts all inclusive?
  resposta: Dá. A página de outros resorts lista as opções da rede com destino, estado e um resumo da estrutura, o que ajuda a colocar lado a lado praia, piscinas e perfil de público. Para detalhes de datas e condições, a cotação fica com a equipe.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6174
  fontes:
    - /outros-resorts/
g-outros-resorts-05:
  pergunta: Os outros resorts da lista também são all inclusive?
  resposta: Sim. A relação reúne apenas resorts que trabalham com regime all inclusive, em diferentes destinos brasileiros, de praia e de interior. O que muda de um para outro é a estrutura, o tamanho do complexo aquático, o perfil do destino e a programação de lazer.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6175
  fontes:
    - /outros-resorts/
g-outros-resorts-06:
  pergunta: Há outros resorts da rede em Alagoas?
  resposta: Sim. Além do Grand Oca Maragogi, a lista inclui opções alagoanas como o Salinas Maragogi, na mesma cidade, o Japaratinga Lounge Resort, o Maceió Mar, o Pratagy Beach, o Salinas Maceió e o Vila Galé Alagoas, distribuídos pelo litoral do estado.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6176
  fontes:
    - /outros-resorts/
g-outros-resorts-07:
  pergunta: Cada resort da rede tem site próprio?
  resposta: A maior parte tem portal próprio, com endereço em resortallinclusive.com.br, e o cartão leva direto para lá. Para os resorts cujo site ainda não está publicado, o botão abre uma conversa com a equipe, para quem quer pedir a cotação daquele destino.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6177
  fontes:
    - /outros-resorts/
g-outros-resorts-08:
  pergunta: Por que alguns resorts da lista não têm foto?
  resposta: Porque as imagens de outras propriedades só entram no site com autorização de uso. Quando ainda não há foto liberada, o cartão aparece com o fundo azul da marca, sem prejuízo das informações de destino, de estado e do resumo da estrutura de cada resort.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6178
  fontes:
    - /outros-resorts/
g-outros-resorts-09:
  pergunta: A Resorts Online vende resorts fora do Brasil?
  resposta: A agência atua desde 2002 em destinos brasileiros, no Caribe, na Argentina, em outros países sul-americanos e em roteiros internacionais, somando mais de duas décadas de mercado. Esta página, porém, reúne apenas os portais de resorts all inclusive brasileiros mantidos pela rede.
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6179
  fontes:
    - /outros-resorts/
g-outros-resorts-10:
  pergunta: Como pedir cotação de outro resort da rede?
  resposta: 'Pelos mesmos canais usados para o Grand Oca Maragogi: a central de reservas 0800 737 6787, o WhatsApp ou o e-mail da Resorts Online. Informe o destino de interesse, as datas, o número de hóspedes e a idade das crianças para receber as opções.'
  tema: reservas
  paginas:
    - outrosResorts
  ordem: 6180
  fontes:
    - /outros-resorts/
g-reservas-01:
  pergunta: Dá para consultar datas e tarifas do Grand Oca Maragogi direto no site?
  resposta: Sim. A página de reservas traz a busca de tarifas do resort, em que se informam as datas e os hóspedes para ver as opções disponíveis. Quem preferir atendimento humano pode pedir a cotação à equipe da Resorts Online pelos canais da agência.
  tema: reservas
  paginas:
    - reservas
  ordem: 6181
  fontes:
    - /reservas/
g-reservas-02:
  pergunta: Quais são as etapas da reserva do Grand Oca Maragogi?
  resposta: 'São quatro passos: definir as datas e os hóspedes, escolher a acomodação entre as nove categorias, revisar o carrinho ou receber a cotação da equipe e confirmar a reserva. Antes de pagar, vale conferir a regra de cancelamento da tarifa escolhida.'
  tema: reservas
  paginas:
    - reservas
  ordem: 6182
  fontes:
    - /reservas/
g-reservas-03:
  pergunta: O que acontece se o hóspede não comparecer no Grand Oca Maragogi?
  resposta: O não comparecimento, chamado de no-show, segue a regra da tarifa escolhida, informada antes do pagamento. Algumas tarifas promocionais são mais rígidas e podem não gerar devolução. Havendo mudança de planos, avise a equipe antes da data de entrada para avaliar as alternativas.
  tema: reservas
  paginas:
    - reservas
  ordem: 6183
  fontes:
    - /reservas/
g-reservas-04:
  pergunta: Existe direito de arrependimento na reserva do Grand Oca Maragogi?
  resposta: Sim. Compras feitas a distância podem ser canceladas em até sete dias após a contratação, com devolução integral, conforme o artigo 49 do Código de Defesa do Consumidor. Passado esse prazo, valem as condições da tarifa contratada, apresentadas antes do pagamento.
  tema: reservas
  paginas:
    - reservas
  ordem: 6184
  fontes:
    - /reservas/
g-reservas-05:
  pergunta: As tarifas promocionais do Grand Oca Maragogi têm regra de cancelamento diferente?
  resposta: 'Podem ter. O cancelamento segue sempre a regra da tarifa escolhida, e as promocionais às vezes não são reembolsáveis. Por isso a condição aparece antes do pagamento: vale ler com atenção e comparar o desconto com a flexibilidade que a sua viagem exige.'
  tema: reservas
  paginas:
    - reservas
  ordem: 6185
  fontes:
    - /reservas/
g-reservas-06:
  pergunta: Dá para reservar mais de um quarto no Grand Oca Maragogi?
  resposta: Sim. Na solicitação basta informar quantos quartos são necessários, quantos adultos ficam em cada um e a idade de cada criança na data da viagem. Como as categorias recebem de duas a seis pessoas, grupos maiores são distribuídos em mais de uma acomodação.
  tema: reservas
  paginas:
    - reservas
  ordem: 6186
  fontes:
    - /reservas/
g-reservas-07:
  pergunta: O Grand Oca Maragogi cobra taxa de serviço ou taxa turística?
  resposta: O site não publica taxas adicionais para a hospedagem no resort. Os valores e as condições da reserva aparecem na cotação ou na busca de tarifas, antes do pagamento, e é ali que devem ser conferidos itens como regras da tarifa e formas de pagamento.
  tema: reservas
  paginas:
    - reservas
  ordem: 6187
  fontes:
    - /reservas/
g-reservas-08:
  pergunta: A página de reservas do Grand Oca Maragogi mostra os feriados do período?
  resposta: Sim. Entre as seções da página existe um bloco com as datas especiais, útil para saber se a viagem cai em um feriado, quando a procura aumenta. As páginas de cada data indicam o dia exato e ajudam a ajustar o número de noites.
  tema: reservas
  paginas:
    - reservas
  ordem: 6188
  fontes:
    - /reservas/
g-reservas-09:
  pergunta: Dá para reservar o Grand Oca Maragogi para um grupo grande?
  resposta: As acomodações recebem de duas a seis pessoas, então grupos maiores ocupam vários quartos. O Standard Comunicante, com dois ambientes interligados, e a Suíte Deluxe são as categorias de maior capacidade. Para fechar várias unidades, peça a cotação à equipe com antecedência.
  tema: reservas
  paginas:
    - reservas
  ordem: 6189
  fontes:
    - /reservas/
g-reservas-10:
  pergunta: O site publica os preços do Grand Oca Maragogi?
  resposta: 'Não existe tabela fixa: os valores dependem das datas, da categoria, do número de hóspedes e das condições vigentes. Eles aparecem na busca de tarifas ou na cotação enviada pela equipe, que também informa as condições de parcelamento no cartão e o desconto à vista no Pix.'
  tema: reservas
  paginas:
    - reservas
  ordem: 6190
  fontes:
    - /reservas/
g-reservas-hospedagem-01:
  pergunta: Para quem é indicada a reserva de só hospedagem no Grand Oca Maragogi?
  resposta: Para quem já comprou as passagens, vai de carro ou prefere resolver o transporte por conta própria. Nessa modalidade, a cotação cobre apenas as diárias no resort, com o mesmo regime all inclusive do pacote que soma a hospedagem às passagens aéreas.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6191
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-02:
  pergunta: Quais dados informar para reservar só a hospedagem no Grand Oca Maragogi?
  resposta: Informe a data de entrada e a de saída, quantos quartos são necessários, quantos adultos viajam e a idade de cada criança na data da viagem. Com esses dados em mãos, a equipe verifica as categorias disponíveis e apresenta as condições do período.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6192
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-03:
  pergunta: A reserva de só hospedagem inclui o all inclusive do Grand Oca Maragogi?
  resposta: 'Sim. O regime é igual nas duas modalidades: café da manhã, almoço, chá da tarde, jantar, snacks e bebidas selecionadas, além das piscinas, do parque aquático, da recreação infantil e dos esportes. A diferença entre elas está apenas na passagem aérea.'
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6193
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-04:
  pergunta: A reserva de só hospedagem inclui transporte até o Grand Oca Maragogi?
  resposta: Não. O traslado entre o aeroporto e o resort fica fora da diária e também fora do regime all inclusive. Quem chega de avião precisa combinar transfer, táxi ou carro alugado para o trecho final, de 126 quilômetros desde Recife ou 136 desde Maceió.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6194
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-05:
  pergunta: Dá para escolher a categoria na reserva de só hospedagem do Grand Oca Maragogi?
  resposta: 'Sim. São nove categorias: apartamentos Standard, Standard Comunicante, três tipos de bangalô, a Suíte e três opções Deluxe, com capacidades e vistas diferentes. Compare o limite de adultos e de crianças antes de decidir; a equipe indica o que está disponível nas suas datas.'
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6195
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-06:
  pergunta: O número de noites muda os jantares nos restaurantes temáticos do Grand Oca Maragogi?
  resposta: Sim. A quantidade de reservas incluídas no Ix’U, no Il Giardino e no La Brasa varia conforme o número de noites da hospedagem, e as marcações são feitas no Guest Service. Estadias curtas, portanto, tendem a contemplar menos jantares temáticos durante a viagem.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6196
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-07:
  pergunta: A idade das crianças precisa ser informada na reserva de hospedagem?
  resposta: Precisa. A tarifa muda conforme a idade de cada criança, e as gratuidades variam segundo o período e a acomodação escolhida. Informe a idade que a criança terá na data da viagem, porque esse dado também afeta o limite de ocupação de cada categoria.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6197
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-08:
  pergunta: Existe número mínimo de noites no Grand Oca Maragogi?
  resposta: Fora dos feriados, o site não publica exigência de noites mínimas. Em datas especiais, porém, pode haver período mínimo de hospedagem, que muda a cada ano. A central de reservas confirma essa condição junto com a disponibilidade da categoria desejada.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6198
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-09:
  pergunta: Dá para pedir quartos comunicantes no Grand Oca Maragogi?
  resposta: 'O resort tem uma categoria pensada para isso: o Standard Comunicante, com dois quartos ligados por porta, duas varandas e dois banheiros, para até seis hóspedes. Nas outras categorias não há informação sobre unidades vizinhas ou interligadas. Indique a necessidade já na cotação.'
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6199
  fontes:
    - /reservas/hospedagem/
g-reservas-hospedagem-10:
  pergunta: Qual é a diferença entre reservar a hospedagem no site e pela central?
  resposta: As duas opções levam ao mesmo resultado. A busca online mostra datas e tarifas na hora, enquanto a central de reservas 0800 737 6787 atende nos dias úteis, das 10h às 18h, e no sábado, das 10h às 13h, para quem prefere conversar.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 6200
  fontes:
    - /reservas/hospedagem/
g-reservas-pacote-com-aereo-01:
  pergunta: O que o pacote com aéreo para o Grand Oca Maragogi inclui?
  resposta: O pacote junta a hospedagem all inclusive no resort e as passagens aéreas em uma única cotação, feita pela Resorts Online. O regime no hotel é o mesmo da reserva de só hospedagem, e o traslado entre o aeroporto e Ponta de Mangue é tratado separadamente.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6201
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-02:
  pergunta: Quais informações enviar para cotar o pacote com aéreo do Grand Oca Maragogi?
  resposta: Diga a cidade de origem, a data de ida e a de volta, o número de quartos, quantos adultos e a idade das crianças na viagem. Com esses dados, a equipe monta as opções de voo e de categoria disponíveis para o período desejado.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6202
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-03:
  pergunta: O pacote com aéreo inclui o traslado até o Grand Oca Maragogi?
  resposta: O traslado não faz parte do regime all inclusive do resort. Informe na cotação se quer incluir o transporte entre o aeroporto e Ponta de Mangue, porque o serviço, privativo ou compartilhado, depende de disponibilidade e tem condições próprias, à parte das diárias.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6203
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-04:
  pergunta: Para qual aeroporto o pacote do Grand Oca Maragogi costuma emitir as passagens?
  resposta: Em geral para Recife, a cerca de 126 quilômetros do resort, ou para Maceió, a cerca de 136 quilômetros. A escolha depende dos voos que saem da sua cidade, dos horários e do valor, e o trecho final é sempre percorrido por estrada.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6204
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-05:
  pergunta: O pacote com aéreo é mais vantajoso do que comprar tudo separado?
  resposta: Este site não publica comparação de valores entre as duas formas, porque tarifas de hotel e de voo mudam a cada consulta. A vantagem concreta do pacote é resolver hospedagem e passagens em uma cotação única, com o mesmo atendimento do começo ao fim.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6205
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-06:
  pergunta: O pacote com aéreo serve para quem sai de qualquer cidade?
  resposta: A equipe parte da cidade de origem informada na solicitação e monta as opções conforme os voos existentes para Recife ou Maceió. Como a malha aérea varia, algumas origens exigem conexão, o que muda horários e o tempo total de viagem até Maragogi.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6206
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-07:
  pergunta: O pacote com aéreo muda o all inclusive no Grand Oca Maragogi?
  resposta: Não. Dentro do resort, quem reserva o pacote tem acesso às mesmas refeições, bebidas selecionadas, piscinas, recreação e esportes de quem compra apenas as diárias. O que o pacote acrescenta é a passagem aérea na mesma cotação, cuidada pela agência.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6207
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-08:
  pergunta: Quem emite as passagens do pacote do Grand Oca Maragogi?
  resposta: A Resorts Online, agência de viagens que opera este portal e atua no mercado desde 2002. Ela reúne o voo e as diárias no resort em uma só proposta, informa as condições de pagamento e acompanha o cliente até a confirmação da reserva.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6208
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-09:
  pergunta: O pacote com aéreo é fechado pelo site ou pela equipe?
  resposta: As duas formas existem. A página do pacote traz a ferramenta de busca para consultar combinações de voo e hospedagem, e a equipe também monta a proposta a partir dos dados enviados por telefone, WhatsApp, e-mail ou pelo formulário publicado no site.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6209
  fontes:
    - /reservas/pacote-com-aereo/
g-reservas-pacote-com-aereo-10:
  pergunta: A distância até o aeroporto influencia a escolha do voo para o Grand Oca Maragogi?
  resposta: Influencia o custo total. As distâncias são próximas, 126 quilômetros desde Recife e 136 desde Maceió, e o trecho final é feito de carro ou transfer. Um voo mais barato pode exigir transporte mais caro, e o horário de pouso afeta o dia da chegada.
  tema: reservas
  paginas:
    - reservasPacoteComAereo
  ordem: 6210
  fontes:
    - /reservas/pacote-com-aereo/
g-politica-hospedagem-01:
  pergunta: O Grand Oca Maragogi serve bebida alcoólica para menores de 18 anos?
  resposta: Não. Bebidas alcoólicas não são servidas a menores de 18 anos, como manda a lei, e a regra vale para restaurantes, bares e qualquer ponto de serviço do resort. Para o público infantil, o regime inclui água, água de coco, sucos e refrigerantes.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6211
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-02:
  pergunta: Que autorização é exigida para menores que viajam sem os pais?
  resposta: Menores de 18 anos acompanhados de outro adulto precisam de autorização expressa dos pais ou do responsável legal. Como o modelo exigido pode variar, confirme com a equipe qual documento é aceito antes de viajar, para não haver surpresa no momento do check-in.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6212
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-03:
  pergunta: As crianças precisam de documento para se hospedar no Grand Oca Maragogi?
  resposta: Sim. Toda criança apresenta documento que comprove a identidade e a filiação, como a certidão de nascimento ou o RG. A exigência alcança também os bebês, e o documento de cada hóspede é solicitado no registro feito na chegada ao resort.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6213
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-04:
  pergunta: Hóspedes estrangeiros precisam de passaporte no Grand Oca Maragogi?
  resposta: Sim. No registro de hóspedes, os brasileiros informam o CPF e os estrangeiros apresentam o passaporte, sempre acompanhado de documento oficial com foto. Também são pedidos endereço completo com CEP, telefone e e-mail de contato de quem assina a hospedagem.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6214
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-05:
  pergunta: As acomodações do Grand Oca Maragogi são para não fumantes?
  resposta: O hotel não publica regra sobre fumantes nas acomodações, então este site não afirma que haja proibição ou permissão. Para evitar dúvida na chegada, pergunte na recepção ou no Guest Service qual é a orientação vigente para quartos, varandas e áreas comuns.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6215
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-06:
  pergunta: O Grand Oca Maragogi exige depósito ou garantia na reserva?
  resposta: Não há informação publicada sobre depósito de garantia ou caução para a hospedagem. As condições de pagamento e a regra da tarifa aparecem antes do fechamento da reserva, e a equipe da Resorts Online esclarece o que é cobrado em cada situação.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6216
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-07:
  pergunta: As regras de hospedagem do Grand Oca Maragogi são do hotel ou da agência?
  resposta: As duas coisas. Horários, crianças, restaurantes temáticos e uso das áreas seguem o que o resort publica. As condições de cancelamento, de alteração e de não comparecimento são as da agência que vendeu, porque reservas feitas por intermediários seguem as regras do parceiro.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6217
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-08:
  pergunta: Quem responde pelas regras durante a estadia no Grand Oca Maragogi?
  resposta: 'Pedidos do dia a dia, como a reserva de um restaurante temático ou uma dúvida sobre a programação, são resolvidos no Guest Service, ao lado da recepção. A Resorts Online responde pelo que envolve a reserva: datas, categoria, pagamento e documentos exigidos.'
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6218
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-09:
  pergunta: Alterar a data da reserva do Grand Oca Maragogi tem custo?
  resposta: A alteração segue a regra da tarifa escolhida e depende da disponibilidade para as novas datas. Em algumas tarifas existe diferença de valor a pagar; em outras, a mudança pode não ser permitida. Confirme com a equipe antes de desfazer qualquer planejamento.
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6219
  fontes:
    - /politica-de-hospedagem/
g-politica-hospedagem-10:
  pergunta: O que é a Ficha Nacional de Registro de Hóspedes?
  resposta: 'É o registro preenchido na chegada, com os dados de todos os hóspedes: documento oficial com foto, CPF ou passaporte, endereço completo com CEP, telefone e e-mail. Ter essas informações à mão agiliza o check-in, que no resort começa a partir das 15h.'
  tema: hospedagem
  paginas:
    - politicaHospedagem
  ordem: 6220
  fontes:
    - /politica-de-hospedagem/
g-contato-01:
  pergunta: Qual é o horário de atendimento da Resorts Online?
  resposta: A central atende de segunda a sexta, das 10h às 18h, e no sábado, das 10h às 13h. Fora desses períodos, dá para deixar a mensagem pelo formulário do site ou por e-mail, e a equipe responde pelo endereço ou pelo telefone informado.
  tema: reservas
  paginas:
    - contato
  ordem: 6221
  fontes:
    - /fale-conosco/
g-contato-02:
  pergunta: O site publica o telefone do Grand Oca Maragogi?
  resposta: 'Não. Este portal é da agência Resorts Online, e os canais divulgados são os dela: a central de reservas 0800 737 6787, o WhatsApp e o e-mail de reservas. Para assuntos internos da estadia, o hóspede procura o Guest Service no próprio resort.'
  tema: reservas
  paginas:
    - contato
  ordem: 6222
  fontes:
    - /fale-conosco/
g-contato-03:
  pergunta: Qual é o e-mail para falar sobre o Grand Oca Maragogi?
  resposta: As mensagens podem ser enviadas para reservas@resortallinclusive.com.br, endereço da Resorts Online usado para cotações e dúvidas sobre a hospedagem. O site também tem formulário próprio, em que se informam nome, e-mail, telefone, datas, hóspedes e a mensagem. A equipe responde em seguida.
  tema: reservas
  paginas:
    - contato
  ordem: 6223
  fontes:
    - /fale-conosco/
g-contato-04:
  pergunta: A Resorts Online tem site institucional e redes sociais?
  resposta: Sim. A agência mantém um site institucional próprio, fora deste portal, e um perfil no Instagram. Os canais de atendimento para reservas no Grand Oca Maragogi continuam sendo a central telefônica, o WhatsApp, o e-mail e o formulário publicado nesta página.
  tema: reservas
  paginas:
    - contato
  ordem: 6224
  fontes:
    - /fale-conosco/
g-contato-05:
  pergunta: Que informações ter em mãos ao entrar em contato sobre o Grand Oca Maragogi?
  resposta: Tenha as datas de entrada e de saída, a quantidade de quartos, o número de adultos e a idade de cada criança na viagem. Para o pacote com aéreo, inclua a cidade de origem. Com isso, a primeira resposta já traz opções concretas.
  tema: reservas
  paginas:
    - contato
  ordem: 6225
  fontes:
    - /fale-conosco/
g-contato-06:
  pergunta: Dá para tirar dúvidas sobre o resort sem fechar reserva?
  resposta: Dá. A equipe de consultores atende quem ainda está comparando opções e ajuda a entender diferenças de categoria, capacidade e vista entre as nove acomodações, além do que o all inclusive cobre. Não é preciso ter data definida para a primeira consulta.
  tema: reservas
  paginas:
    - contato
  ordem: 6226
  fontes:
    - /fale-conosco/
g-contato-07:
  pergunta: A mensagem enviada pelo site vai para o hotel ou para a agência?
  resposta: Vai para a Resorts Online, que opera este portal e cuida das cotações de hospedagem e de pacotes. Assuntos que dependem da operação interna, como pedidos durante a estadia, precisam ser tratados com a equipe do resort, no Guest Service ou na recepção.
  tema: reservas
  paginas:
    - contato
  ordem: 6227
  fontes:
    - /fale-conosco/
g-contato-08:
  pergunta: A Resorts Online atende hospedagem e pacote no mesmo canal?
  resposta: 'Sim. A mesma equipe cuida das duas modalidades: só as diárias no Grand Oca Maragogi ou o pacote que soma a hospedagem às passagens. Basta dizer qual interessa no primeiro contato, por telefone, WhatsApp, e-mail ou pelo formulário do site.'
  tema: reservas
  paginas:
    - contato
  ordem: 6228
  fontes:
    - /fale-conosco/
g-contato-09:
  pergunta: Qual é a razão social da Resorts Online?
  resposta: A agência se apresenta como Resorts Online Viagens e Turismo, com sede em São Paulo, na Rua Vergueiro, 2253, conjunto 1216, no bairro Vila Mariana. Esse é o endereço administrativo da empresa, sem relação com a localização do resort em Maragogi.
  tema: reservas
  paginas:
    - contato
  ordem: 6229
  fontes:
    - /fale-conosco/
g-contato-10:
  pergunta: O que acontece com os dados enviados no contato do Grand Oca Maragogi?
  resposta: Os dados informados em cotações e mensagens são tratados conforme a política de privacidade publicada neste site, que explica o que é coletado, para que serve, com quem é compartilhado, por quanto tempo fica guardado e como exercer os direitos previstos na legislação.
  tema: reservas
  paginas:
    - contato
  ordem: 6230
  fontes:
    - /fale-conosco/
g-quem-somos-01:
  pergunta: Quando a Resorts Online foi fundada?
  resposta: Em maio de 2002, em São Paulo. São mais de duas décadas no mercado de turismo, com atuação em destinos brasileiros e internacionais. Hoje a agência mantém portais de resorts all inclusive, entre eles este site dedicado ao Grand Oca Maragogi, em Alagoas.
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6231
  fontes:
    - /quem-somos/
g-quem-somos-02:
  pergunta: Em quais destinos a Resorts Online atua?
  resposta: 'A agência informa atuação em destinos no Brasil, no Caribe, na Argentina, na América do Sul e em outros destinos internacionais. Este portal, porém, trata de um único hotel: o Grand Oca Maragogi, na Praia de Ponta de Mangue, no litoral alagoano.'
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6232
  fontes:
    - /quem-somos/
g-quem-somos-03:
  pergunta: Qual é a relação entre este site e o portal Resort All Inclusive?
  resposta: Resort All Inclusive é a submarca com que a Resorts Online publica seus sites de resorts, e este endereço é o dedicado ao Grand Oca Maragogi. O rodapé e esta página trazem o aviso de que o portal pertence a uma agência de viagens.
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6233
  fontes:
    - /quem-somos/
g-quem-somos-04:
  pergunta: Como a Resorts Online trabalha?
  resposta: 'A agência apresenta quatro pilares: consultores treinados para indicar o resort certo a cada perfil, flexibilidade de datas e de número de noites, tarifas especiais consultadas com a equipe e a escolha entre só hospedagem ou pacote com passagens, no mesmo atendimento.'
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6234
  fontes:
    - /quem-somos/
g-quem-somos-05:
  pergunta: A Resorts Online permite escolher o número de noites?
  resposta: Sim. A agência destaca a flexibilidade de datas e a liberdade de definir quantas noites a viagem terá, o que muda, por exemplo, a quantidade de jantares incluídos nos restaurantes temáticos. A disponibilidade é confirmada na cotação de cada período.
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6235
  fontes:
    - /quem-somos/
g-quem-somos-06:
  pergunta: A Resorts Online publica avaliações de hóspedes do Grand Oca Maragogi?
  resposta: Não. Sem depoimentos com autorização ou fonte pública verificável, o site não exibe notas, estrelas nem comentários de hóspedes, e também não usa esse tipo de dado nas páginas do resort. A descrição se apoia apenas em informações confirmadas sobre a estrutura.
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6236
  fontes:
    - /quem-somos/
g-quem-somos-07:
  pergunta: Por que o site informa que é de uma agência de viagens?
  resposta: 'Para deixar claro quem vende a hospedagem. O aviso aparece no rodapé e nesta página: trata-se de um site da Resorts Online, que comercializa diárias e pacotes para o Grand Oca Maragogi, sem substituir o hotel nem o atendimento próprio dele.'
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6237
  fontes:
    - /quem-somos/
g-quem-somos-08:
  pergunta: A Resorts Online tem tarifas que não aparecem no site?
  resposta: A agência informa que algumas tarifas não são publicadas e podem ser consultadas com a equipe. Por isso vale comparar o resultado da busca online com a cotação feita por telefone, WhatsApp ou e-mail antes de fechar a hospedagem no resort.
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6238
  fontes:
    - /quem-somos/
g-quem-somos-09:
  pergunta: Qual é a proposta de atendimento da Resorts Online?
  resposta: A agência diz cuidar dos detalhes da viagem, da escolha do resort ao dia do check-in, com atendimento humanizado e ágil. Na prática, isso aparece na indicação de categorias, no acerto das datas e no acompanhamento da reserva até a confirmação.
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6239
  fontes:
    - /quem-somos/
g-quem-somos-10:
  pergunta: A Resorts Online vende passagens aéreas separadamente?
  resposta: Neste portal, as duas modalidades oferecidas são a hospedagem no Grand Oca Maragogi e o pacote que reúne diárias e passagens na mesma cotação. A venda de bilhete aéreo isolado não é apresentada aqui; para outras necessidades, consulte a equipe da agência.
  tema: reservas
  paginas:
    - quemSomos
  ordem: 6240
  fontes:
    - /quem-somos/
d-acomodacao-apartamento-standard-01:
  pergunta: Qual é a metragem do Apartamento Standard do Grand Oca Maragogi?
  resposta: O Grand Oca Maragogi não divulga a metragem do Apartamento Standard. As únicas áreas publicadas pelo resort são as do Duplo Deluxe, com 50 metros quadrados, e da Suíte Deluxe, com 72. A categoria Standard reúne 120 unidades de um ambiente, voltadas para os jardins e o coqueiral.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 7000
  fontes:
    - /acomodacoes/apartamento-standard/
d-acomodacao-apartamento-standard-02:
  pergunta: Como é o banheiro do Apartamento Standard do Grand Oca Maragogi?
  resposta: O banheiro do Apartamento Standard tem chuveiro e secador de cabelo. O quarto conta com ar-condicionado split, TV de 32 polegadas, frigobar e telefone. Quem precisa de dois banheiros encontra essa configuração no Standard Comunicante, que une dois quartos em uma só reserva.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 7001
  fontes:
    - /acomodacoes/apartamento-standard/
d-acomodacao-apartamento-standard-03:
  pergunta: Uma criança de 13 anos entra na capacidade do Apartamento Standard?
  resposta: Não como criança. A categoria limita a 12 anos a idade considerada infantil, então um hóspede de 13 anos ocupa a terceira vaga como adulto, no formato de três adultos. Informe a idade exata de cada passageiro ao pedir a cotação à equipe da Resorts Online.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 7002
  fontes:
    - /acomodacoes/apartamento-standard/
d-acomodacao-apartamento-standard-04:
  pergunta: Qual é a voltagem das tomadas no Apartamento Standard do Grand Oca Maragogi?
  resposta: As tomadas do Apartamento Standard seguem o padrão do resort, de 220 volts. Vale conferir se carregadores, chapinhas e barbeadores são bivolt antes de viajar, ou levar um adaptador adequado. O quarto tem frigobar e telefone, e o banheiro já conta com secador de cabelo.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 7003
  fontes:
    - /acomodacoes/apartamento-standard/
d-acomodacao-apartamento-standard-05:
  pergunta: Qual é a diferença entre o Apartamento Standard e o Bangalô Triplo?
  resposta: As duas categorias recebem até três hóspedes, mas em formatos diferentes. O Apartamento Standard fica em prédios de dois andares cercados por jardins e coqueiros, com camas de casal e de solteiro. O Bangalô Triplo é térreo, ao lado das piscinas principais, e usa uma cama extra para o terceiro hóspede.
  tema: hospedagem
  paginas:
    - acomodacao:apartamento-standard
  ordem: 7004
  fontes:
    - /acomodacoes/apartamento-standard/
d-acomodacao-standard-comunicante-01:
  pergunta: Qual é a metragem do Standard Comunicante do Grand Oca Maragogi?
  resposta: 'O resort não publica a metragem do Standard Comunicante. O que está confirmado é a configuração: dois quartos interligados, duas varandas e dois banheiros, com uma cama de casal e três de solteiro, para até seis hóspedes. As áreas divulgadas pelo Grand Oca Maragogi são só as das categorias Deluxe.'
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 7005
  fontes:
    - /acomodacoes/standard-comunicante/
d-acomodacao-standard-comunicante-02:
  pergunta: Quantas unidades do Standard Comunicante o Grand Oca Maragogi tem?
  resposta: O resort não divulga quantos Standard Comunicantes existem. Entre as categorias com total informado estão os 120 Apartamentos Standard, os 49 Bangalôs Vista Jardim, os 48 Vista Piscina, os 49 Bangalôs Triplos e as duas Suítes. A oferta do Comunicante depende da data e aparece na cotação.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 7006
  fontes:
    - /acomodacoes/standard-comunicante/
d-acomodacao-standard-comunicante-03:
  pergunta: O Standard Comunicante tem Smart TV e frigobar nos dois quartos?
  resposta: A categoria informa ar-condicionado split, Smart TV, frigobar e telefone, além de grandes janelas voltadas para os jardins. Como o Standard Comunicante reúne dois quartos, vale confirmar na cotação como esses itens estão distribuídos entre os ambientes antes de fechar a reserva do grupo.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 7007
  fontes:
    - /acomodacoes/standard-comunicante/
d-acomodacao-standard-comunicante-04:
  pergunta: Qual é a diferença entre o Standard Comunicante e a Suíte Deluxe?
  resposta: As duas recebem até seis hóspedes, mas são opostas no estilo. O Standard Comunicante tem decoração rústica, dois quartos e dois banheiros em meio aos jardins. A Suíte Deluxe tem 72 metros quadrados na área D’Água, com sala de estar, varanda para a piscina e cafeteira Nespresso.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 7008
  fontes:
    - /acomodacoes/standard-comunicante/
d-acomodacao-standard-comunicante-05:
  pergunta: O Standard Comunicante serve para dois casais com filhos?
  resposta: Sim. A configuração de uma cama de casal e três de solteiro, dividida entre dois quartos com banheiros independentes, atende duas famílias que viajam juntas e preferem ambientes separados. O total de seis hóspedes é o limite da categoria, e a reserva é feita de uma só vez.
  tema: hospedagem
  paginas:
    - acomodacao:standard-comunicante
  ordem: 7009
  fontes:
    - /acomodacoes/standard-comunicante/
d-acomodacao-bangalo-vista-jardim-01:
  pergunta: Qual é a metragem do Bangalô Vista Jardim do Grand Oca Maragogi?
  resposta: 'O resort não publica a área do Bangalô Vista Jardim. A categoria é descrita pela configuração: uma construção térrea de um ambiente, com cama de casal ou duas de solteiro, para dois adultos. Entre as acomodações do Grand Oca Maragogi, só as categorias Deluxe têm metragem divulgada.'
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 7010
  fontes:
    - /acomodacoes/bangalo-vista-jardim/
d-acomodacao-bangalo-vista-jardim-02:
  pergunta: O Bangalô Vista Jardim do Grand Oca Maragogi é térreo?
  resposta: Sim. O Bangalô Vista Jardim é uma construção térrea, sem escadas, no mesmo nível do jardim e da área das piscinas. Quem tem dificuldade de locomoção deve informar a necessidade na cotação, porque o resort não confirma adaptação de acessibilidade nas suas categorias de hospedagem.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 7011
  fontes:
    - /acomodacoes/bangalo-vista-jardim/
d-acomodacao-bangalo-vista-jardim-03:
  pergunta: O Bangalô Vista Jardim tem varanda?
  resposta: 'A ficha do Bangalô Vista Jardim não indica varanda privativa: a vista do jardim é aproveitada pelas janelas do quarto. No Grand Oca Maragogi, as categorias que o resort descreve com varanda são o Standard Comunicante e os três quartos Deluxe da área D’Água.'
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 7012
  fontes:
    - /acomodacoes/bangalo-vista-jardim/
d-acomodacao-bangalo-vista-jardim-04:
  pergunta: O frigobar do Bangalô Vista Jardim é reposto durante a estadia?
  resposta: O frigobar faz parte do Bangalô Vista Jardim, e a reposição de itens selecionados está prevista no all inclusive do Grand Oca Maragogi. Bebidas importadas, espumante e vinho em garrafa ficam fora do plano, assim como o room service. Confirme o que entra na hospedagem ao reservar.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 7013
  fontes:
    - /acomodacoes/bangalo-vista-jardim/
d-acomodacao-bangalo-vista-jardim-05:
  pergunta: Dá para pedir duas camas de solteiro no Bangalô Vista Jardim?
  resposta: A categoria é vendida com uma cama de casal ou duas de solteiro, conforme a disponibilidade no período. O pedido deve ser registrado na cotação, para a Resorts Online encaminhá-lo ao resort, que confirma a montagem na chegada. Os dois formatos recebem dois adultos, com a opção de um bebê em berço.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-jardim
  ordem: 7014
  fontes:
    - /acomodacoes/bangalo-vista-jardim/
d-acomodacao-bangalo-vista-piscina-01:
  pergunta: O Bangalô Vista Piscina fica perto dos bares do Grand Oca Maragogi?
  resposta: Sim. Os bangalôs ficam junto às piscinas que se estendem por quase 400 metros, e uma delas abriga o bar Galés, servido dentro da água. Os demais bares do resort, como o Coqueirais, o Drink Parrot e o SportBar, completam as opções de bebida ao longo do dia.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 7015
  fontes:
    - /acomodacoes/bangalo-vista-piscina/
d-acomodacao-bangalo-vista-piscina-02:
  pergunta: O Bangalô Vista Piscina fica na área D’Água?
  resposta: Não. O Bangalô Vista Piscina fica junto às piscinas principais, de frente para a água, enquanto a área D’Água é a parte mais nova do Grand Oca Maragogi e abriga os quartos Deluxe, o parque aquático e o solário. As duas áreas ficam dentro do mesmo resort.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 7016
  fontes:
    - /acomodacoes/bangalo-vista-piscina/
d-acomodacao-bangalo-vista-piscina-03:
  pergunta: Do Bangalô Vista Piscina dá para ir à praia caminhando?
  resposta: Dá. Os bangalôs ocupam a área das piscinas, e o resort inteiro está a uns 10 metros da areia, de frente para a Praia de Ponta de Mangue. O percurso é curto e plano, e na faixa de areia funciona um bar com serviço de bebidas.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 7017
  fontes:
    - /acomodacoes/bangalo-vista-piscina/
d-acomodacao-bangalo-vista-piscina-04:
  pergunta: Um casal com duas crianças cabe no Bangalô Vista Piscina?
  resposta: Não cabe. A categoria é limitada a duas pessoas adultas, admitindo apenas um bebê acomodado em berço, e portanto não atende duas crianças. Famílias maiores podem avaliar o Bangalô Triplo e o Apartamento Standard, para três hóspedes, ou o Duplo Deluxe, que chega a cinco.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 7018
  fontes:
    - /acomodacoes/bangalo-vista-piscina/
d-acomodacao-bangalo-vista-piscina-05:
  pergunta: O Bangalô Vista Piscina custa mais que o Vista Jardim?
  resposta: A tarifa de cada categoria depende da data, do número de noites, da ocupação e da antecedência, e nenhum valor é publicado aqui. A diferença entre o Bangalô Vista Piscina e o Vista Jardim, quando existe, aparece na cotação da Resorts Online, pelo telefone 0800 737 6787.
  tema: reservas
  paginas:
    - acomodacao:bangalo-vista-piscina
  ordem: 7019
  fontes:
    - /acomodacoes/bangalo-vista-piscina/
d-acomodacao-bangalo-triplo-01:
  pergunta: Como é a cama extra do Bangalô Triplo do Grand Oca Maragogi?
  resposta: O Bangalô Triplo recebe uma cama extra, além da cama de casal ou das duas de solteiro, e é assim que a categoria chega a três hóspedes. O formato é prático para casais com uma criança, e o pedido de configuração deve constar na cotação da hospedagem.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 7020
  fontes:
    - /acomodacoes/bangalo-triplo/
d-acomodacao-bangalo-triplo-02:
  pergunta: Qual é a metragem do Bangalô Triplo do Grand Oca Maragogi?
  resposta: O resort não informa a área do Bangalô Triplo, como também não divulga a dos outros bangalôs e dos apartamentos Standard. A descrição fala de um ambiente térreo, ao lado das piscinas principais, voltado para os jardins, com ar-condicionado split, TV de 32 polegadas, frigobar e telefone.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 7021
  fontes:
    - /acomodacoes/bangalo-triplo/
d-acomodacao-bangalo-triplo-03:
  pergunta: Qual é a diferença entre o Bangalô Triplo e o Duplo Deluxe?
  resposta: O Bangalô Triplo recebe até três hóspedes em um ambiente térreo entre os jardins, perto das piscinas principais. O Duplo Deluxe tem 50 metros quadrados na área D’Água, com duas camas de casal, sofá-cama e varanda para a piscina, e chega a cinco pessoas, sendo quatro adultos.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 7022
  fontes:
    - /acomodacoes/bangalo-triplo/
d-acomodacao-bangalo-triplo-04:
  pergunta: O Bangalô Triplo tem varanda?
  resposta: A descrição do Bangalô Triplo não cita varanda privativa. O quarto é térreo e voltado para os jardins do Grand Oca Maragogi, com as piscinas principais ao lado. Entre as acomodações com varanda, o resort lista o Standard Comunicante e as três categorias Deluxe da área nova.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-triplo
  ordem: 7023
  fontes:
    - /acomodacoes/bangalo-triplo/
d-acomodacao-suite-01:
  pergunta: Qual é a metragem da Suíte do Grand Oca Maragogi?
  resposta: 'O Grand Oca Maragogi não divulga a metragem das Suítes. A categoria é descrita pelos ambientes: sala, quarto e banheiro em mármore, no andar superior, com cama king size. São apenas duas unidades no resort, o que torna a disponibilidade bastante restrita ao longo do ano.'
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 7024
  fontes:
    - /acomodacoes/suite/
d-acomodacao-suite-02:
  pergunta: Quantos ambientes tem a Suíte do Grand Oca Maragogi?
  resposta: 'A Suíte tem três ambientes: sala de estar, quarto com cama king size e banheiro amplo em mármore, com chuveiro separado. É uma das poucas categorias do resort com sala própria, ao lado da Suíte Deluxe, que tem sala com sofá-cama na área D’Água.'
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 7025
  fontes:
    - /acomodacoes/suite/
d-acomodacao-suite-03:
  pergunta: A Suíte do Grand Oca Maragogi serve para família com crianças?
  resposta: A Suíte é pensada para casais, e a capacidade é confirmada caso a caso na cotação. Famílias com crianças encontram mais espaço no Standard Comunicante, com dois quartos e dois banheiros, no Duplo Deluxe, para cinco hóspedes, e na Suíte Deluxe, que recebe até seis pessoas.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 7026
  fontes:
    - /acomodacoes/suite/
d-acomodacao-suite-04:
  pergunta: Como é o banheiro em mármore da Suíte do Grand Oca Maragogi?
  resposta: O banheiro da Suíte é amplo e revestido em mármore, com chuveiro separado e kit de amenities exclusivo. É um dos itens que diferenciam a categoria das demais, junto da cama king size e da Smart TV de 50 polegadas.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 7027
  fontes:
    - /acomodacoes/suite/
d-acomodacao-suite-05:
  pergunta: O room service está incluído na Suíte do Grand Oca Maragogi?
  resposta: O serviço de quarto fica fora do plano all inclusive, inclusive para quem se hospeda nas Suítes, e o resort não publica cardápio nem condições de cobrança. As refeições incluídas são servidas nos restaurantes e nos bares, e o frigobar da categoria conta com serviço premium.
  tema: hospedagem
  paginas:
    - acomodacao:suite
  ordem: 7028
  fontes:
    - /acomodacoes/suite/
d-acomodacao-deluxe-duas-camas-grandes-01:
  pergunta: O Deluxe com 2 Camas Grandes tem cofre?
  resposta: Sim. O Deluxe com 2 Camas Grandes informa cofre, frigobar, Smart TV e ar-condicionado, além da varanda voltada para a piscina. É um dos quartos da área D’Água, a parte mais recente do Grand Oca Maragogi, com ambiente amplo, iluminado e de decoração mais clara.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 7029
  fontes:
    - /acomodacoes/deluxe-duas-camas-grandes/
d-acomodacao-deluxe-duas-camas-grandes-02:
  pergunta: O Deluxe com 2 Camas Grandes tem sofá-cama?
  resposta: Não. A categoria trabalha apenas com duas camas extragrandes e recebe até quatro hóspedes. Quem precisa de uma quinta vaga deve olhar o Duplo Deluxe com Sofá-cama, de 50 metros quadrados, ou, para seis pessoas, a Suíte Deluxe e o Standard Comunicante.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 7030
  fontes:
    - /acomodacoes/deluxe-duas-camas-grandes/
d-acomodacao-deluxe-duas-camas-grandes-03:
  pergunta: A varanda do Deluxe com 2 Camas Grandes é tranquila?
  resposta: A varanda dá para a piscina e o parque aquático, uma área de bastante movimento durante o dia. Para quem busca silêncio, os apartamentos Standard e os bangalôs vista jardim ficam voltados para o verde e o coqueiral, longe da parte mais animada do resort.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 7031
  fontes:
    - /acomodacoes/deluxe-duas-camas-grandes/
d-acomodacao-deluxe-duas-camas-grandes-04:
  pergunta: O Deluxe com 2 Camas Grandes fica perto do parque aquático?
  resposta: Fica. Os quartos Deluxe ocupam a área D’Água, que reúne piscinas, solário, borda infinita, parque aquático e um bar com snacks e gelados, onde também é servido o chá da tarde. Dá para sair do quarto e chegar à água sem atravessar o resort.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 7032
  fontes:
    - /acomodacoes/deluxe-duas-camas-grandes/
d-acomodacao-deluxe-duas-camas-grandes-05:
  pergunta: O Deluxe com 2 Camas Grandes serve para dois casais?
  resposta: Sim. As duas camas extragrandes atendem quatro hóspedes, e a categoria é indicada tanto para casais quanto para amigos que viajam juntos. Não há sala separada do quarto, então quem quer mais privacidade pode comparar com o Standard Comunicante, que tem dois quartos e dois banheiros.
  tema: hospedagem
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 7033
  fontes:
    - /acomodacoes/deluxe-duas-camas-grandes/
d-acomodacao-duplo-deluxe-sofa-cama-01:
  pergunta: O Duplo Deluxe com Sofá-cama tem sala separada?
  resposta: Não. Os 50 metros quadrados do Duplo Deluxe formam um ambiente único, com as duas camas de casal e o sofá-cama no mesmo espaço, mais a varanda. Quem quer uma sala de estar à parte precisa da Suíte Deluxe, de 72 metros quadrados, também na área D’Água.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 7034
  fontes:
    - /acomodacoes/duplo-deluxe-sofa-cama/
d-acomodacao-duplo-deluxe-sofa-cama-02:
  pergunta: Cinco adultos podem ficar no Duplo Deluxe com Sofá-cama?
  resposta: Não. O limite da categoria é de quatro adultos e uma criança, somando cinco hóspedes. Para cinco adultos, o caminho é dividir o grupo em dois quartos ou escolher o Standard Comunicante, que recebe seis pessoas em dois ambientes. A idade das crianças deve constar na cotação.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 7035
  fontes:
    - /acomodacoes/duplo-deluxe-sofa-cama/
d-acomodacao-duplo-deluxe-sofa-cama-03:
  pergunta: Quantos banheiros tem o Duplo Deluxe com Sofá-cama?
  resposta: O Duplo Deluxe tem um banheiro, com chuveiro e secador de cabelo, o que vale considerar quando cinco pessoas viajam juntas. Para contar com dois banheiros, o Standard Comunicante é a alternativa do Grand Oca Maragogi, com um em cada um dos dois quartos interligados.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 7036
  fontes:
    - /acomodacoes/duplo-deluxe-sofa-cama/
d-acomodacao-duplo-deluxe-sofa-cama-04:
  pergunta: O Duplo Deluxe com Sofá-cama tem cofre e Smart TV?
  resposta: A categoria informa ar-condicionado, frigobar e Smart TV, e tem a varanda virada para a água da ala mais nova. O cofre consta na descrição de outras categorias Deluxe, então vale confirmar esse item e os demais equipamentos na cotação, antes de fechar a reserva.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 7037
  fontes:
    - /acomodacoes/duplo-deluxe-sofa-cama/
d-acomodacao-duplo-deluxe-sofa-cama-05:
  pergunta: Qual é a diferença entre o Duplo Deluxe e o Deluxe com 2 Camas Grandes?
  resposta: O Duplo Deluxe tem 50 metros quadrados, duas camas de casal e um sofá-cama, e recebe cinco hóspedes. O Deluxe com 2 Camas Grandes trabalha com duas camas extragrandes e até quatro pessoas, sem metragem divulgada. Os dois ficam na área D’Água, com varanda para a piscina.
  tema: hospedagem
  paginas:
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 7038
  fontes:
    - /acomodacoes/duplo-deluxe-sofa-cama/
d-acomodacao-suite-deluxe-01:
  pergunta: Quantos ambientes tem a Suíte Deluxe do Grand Oca Maragogi?
  resposta: A Suíte Deluxe tem dois ambientes internos, quarto e sala de estar, além da varanda voltada para a piscina da área D’Água. São 72 metros quadrados, com duas camas extragrandes no quarto e um sofá-cama na sala, que acomoda parte do grupo com mais privacidade.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 7039
  fontes:
    - /acomodacoes/suite-deluxe/
d-acomodacao-suite-deluxe-02:
  pergunta: A Suíte Deluxe tem cofre e kit de amenities?
  resposta: Sim. A categoria informa cofre, frigobar, Smart TV e kit de amenities, além da cafeteira Nespresso que a diferencia das demais. É a acomodação de padrão mais alto do Grand Oca Maragogi, dentro da área D’Água, a parte mais recente do resort, de frente para a piscina.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 7040
  fontes:
    - /acomodacoes/suite-deluxe/
d-acomodacao-suite-deluxe-03:
  pergunta: Por que a Suíte Deluxe esgota rápido nos feriados?
  resposta: A Suíte Deluxe é uma das categorias mais procuradas em feriados e no fim de ano, porque acomoda até seis hóspedes com mais espaço. Como o resort não divulga quantas unidades existem, a oferta pode acabar cedo, e a consulta antecipada à Resorts Online amplia as opções.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 7041
  fontes:
    - /acomodacoes/suite-deluxe/
d-acomodacao-suite-deluxe-04:
  pergunta: A Suíte Deluxe é maior que o Duplo Deluxe com Sofá-cama?
  resposta: 'Sim. Com 72 metros quadrados, a Suíte Deluxe é a maior categoria do Grand Oca Maragogi, à frente do Duplo Deluxe, de 50. As outras categorias não têm área divulgada, e a diferença aparece também nos ambientes: a Suíte Deluxe soma sala de estar, varanda e cafeteira Nespresso.'
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 7042
  fontes:
    - /acomodacoes/suite-deluxe/
d-acomodacao-suite-deluxe-05:
  pergunta: Quantos banheiros tem a Suíte Deluxe do Grand Oca Maragogi?
  resposta: O resort não informa quantos banheiros a Suíte Deluxe tem, embora a categoria receba até seis hóspedes em 72 metros quadrados. Quem considera esse ponto decisivo pode avaliar o Standard Comunicante, que tem dois banheiros e duas varandas, um para cada um dos dois quartos.
  tema: hospedagem
  paginas:
    - acomodacao:suite-deluxe
  ordem: 7043
  fontes:
    - /acomodacoes/suite-deluxe/
d-restaurante-restaurante-dos-corais-01:
  pergunta: O café da manhã do Restaurante dos Corais tem comida regional?
  resposta: Tem. O buffet matinal reúne mais de 70 itens, com destaque para as tapiocas, o bolo de goma e os doces típicos de Alagoas, ao lado das demais opções servidas no salão. É oferecido das 7h às 10h e faz parte da hospedagem all inclusive.
  tema: all-inclusive
  paginas:
    - restaurante:restaurante-dos-corais
  ordem: 7044
  fontes:
    - /all-inclusive/restaurantes/restaurante-dos-corais/
d-restaurante-restaurante-dos-corais-02:
  pergunta: O que é o show cooking do Restaurante dos Corais?
  resposta: É o serviço em que parte dos pratos é finalizada na hora, à vista de quem está no salão, e acontece no almoço e no jantar. O restante do buffet traz saladas, pratos quentes, massas, acompanhamentos e sobremesas, com cardápio que se renova ao longo da hospedagem.
  tema: all-inclusive
  paginas:
    - restaurante:restaurante-dos-corais
  ordem: 7045
  fontes:
    - /all-inclusive/restaurantes/restaurante-dos-corais/
d-restaurante-restaurante-dos-corais-03:
  pergunta: Onde é servido o chá da tarde perto do Restaurante dos Corais?
  resposta: O chá da tarde acontece das 16h30 às 17h30, no terraço junto ao Restaurante dos Corais, e também na área da Piscina D’Água, cujo bar serve snacks e gelados. Fica entre o almoço, que termina às 15h, e o jantar, que começa às 19h.
  tema: all-inclusive
  paginas:
    - restaurante:restaurante-dos-corais
  ordem: 7046
  fontes:
    - /all-inclusive/restaurantes/restaurante-dos-corais/
d-restaurante-restaurante-dos-corais-04:
  pergunta: As crianças têm o que comer no buffet do Restaurante dos Corais?
  resposta: O buffet reúne saladas, massas, pratos quentes e sobremesas, o que facilita montar o prato dos pequenos, e a alimentação das crianças entra na hospedagem. Entre as refeições, a praça de alimentação do resort oferece hambúrgueres, pizzas, sorvetes e picolés para os intervalos do dia.
  tema: all-inclusive
  paginas:
    - restaurante:restaurante-dos-corais
  ordem: 7047
  fontes:
    - /all-inclusive/restaurantes/restaurante-dos-corais/
d-restaurante-restaurante-dos-corais-05:
  pergunta: Dá para almoçar fora do Restaurante dos Corais durante a estadia?
  resposta: Dá. O Corais serve as três refeições em buffet, sem reserva, e o La Brasa funciona no almoço como espaço de churrasco descontraído. Nos jantares, o Ix’U, o Il Giardino e o próprio La Brasa pedem reserva no Guest Service, em quantidade que depende das noites contratadas.
  tema: all-inclusive
  paginas:
    - restaurante:restaurante-dos-corais
  ordem: 7048
  fontes:
    - /all-inclusive/restaurantes/restaurante-dos-corais/
d-restaurante-ixu-01:
  pergunta: Quantas pessoas o Ix’U atende por vez?
  resposta: O Ix’U tem espaço para até 70 pessoas, em ambiente lounge montado às margens da praia. É bem menor que o Restaurante dos Corais, que atende 340 lugares em buffet, e por isso trabalha com reserva prévia, marcada no Guest Service depois da chegada ao resort.
  tema: all-inclusive
  paginas:
    - restaurante:ixu
  ordem: 7049
  fontes:
    - /all-inclusive/restaurantes/ixu/
d-restaurante-ixu-02:
  pergunta: O Ix’U é servido à la carte ou em buffet?
  resposta: O atendimento é à la carte, com cardápio de cozinha fusion, diferente do buffet do restaurante principal. Quem janta escolhe entrada, prato principal e sobremesa entre as opções do dia, e os itens podem mudar sem aviso prévio, conforme a operação do Grand Oca Maragogi.
  tema: all-inclusive
  paginas:
    - restaurante:ixu
  ordem: 7050
  fontes:
    - /all-inclusive/restaurantes/ixu/
d-restaurante-ixu-03:
  pergunta: Os vinhos da carta do Ix’U estão incluídos?
  resposta: O Ix’U tem carta exclusiva de vinhos, e o plano all inclusive contempla vinhos em taça selecionados. Vinho em garrafa, espumante e bebidas importadas ficam fora do pacote e seguem condições próprias, informadas pelo resort durante a hospedagem. Confirme o que vale no Guest Service.
  tema: all-inclusive
  paginas:
    - restaurante:ixu
  ordem: 7051
  fontes:
    - /all-inclusive/restaurantes/ixu/
d-restaurante-ixu-04:
  pergunta: O brunch da experiência VIP Premium acontece no Ix’U?
  resposta: Acontece. A VIP Premium funciona das 9h às 17h, com área exclusiva na praia, camas de praia, atendimento de hostess, bebidas selecionadas e esse brunch servido no Ix’U. Tem preço próprio, fora do plano all inclusive, e não aceita hóspedes com menos de 14 anos.
  tema: all-inclusive
  paginas:
    - restaurante:ixu
  ordem: 7052
  fontes:
    - /all-inclusive/restaurantes/ixu/
d-restaurante-ixu-05:
  pergunta: Crianças podem jantar no Ix’U?
  resposta: O resort não divulga restrição de idade para o jantar no Ix’U, ao contrário da experiência VIP Premium, que exige 14 anos ou mais. Como o restaurante trabalha com serviço à mesa e reserva prévia, vale combinar o horário e conferir as opções do cardápio na chegada.
  tema: all-inclusive
  paginas:
    - restaurante:ixu
  ordem: 7053
  fontes:
    - /all-inclusive/restaurantes/ixu/
d-restaurante-il-giardino-01:
  pergunta: O Il Giardino serve buffet ou pratos à la carte?
  resposta: O resort descreve o Il Giardino como um buffet de comida italiana, com massas e receitas tradicionais do país, e não como serviço à mesa. O cardápio de referência tem entrada, massas, prato principal e sobremesa, e pode ser alterado conforme a operação de cada noite.
  tema: all-inclusive
  paginas:
    - restaurante:il-giardino
  ordem: 7054
  fontes:
    - /all-inclusive/restaurantes/il-giardino/
d-restaurante-il-giardino-02:
  pergunta: Em que horário o Il Giardino funciona?
  resposta: Não há horário próprio divulgado para o Il Giardino. O jantar no resort acontece entre 19h e 22h, e a reserva do restaurante italiano é feita no Guest Service, ao lado da recepção, que informa o horário disponível para cada noite da hospedagem.
  tema: all-inclusive
  paginas:
    - restaurante:il-giardino
  ordem: 7055
  fontes:
    - /all-inclusive/restaurantes/il-giardino/
d-restaurante-il-giardino-03:
  pergunta: Quantos jantares no Il Giardino a hospedagem inclui?
  resposta: A quantidade depende do número de noites contratadas, e o resort não publica uma tabela fixa. O Il Giardino divide essas reservas com o Ix’U e com o jantar do La Brasa, todas marcadas no Guest Service, de acordo com a disponibilidade de cada data.
  tema: all-inclusive
  paginas:
    - restaurante:il-giardino
  ordem: 7056
  fontes:
    - /all-inclusive/restaurantes/il-giardino/
d-restaurante-il-giardino-04:
  pergunta: O Il Giardino tem opção vegetariana?
  resposta: Não há cardápio vegetariano publicado para o Il Giardino. O menu de referência traz focaccia de tomate e mozzarella e massas com molho de queijos, pratos sem carne, e o buffet principal do resort serve saladas e opções variadas. Informe restrições alimentares ao reservar a mesa.
  tema: all-inclusive
  paginas:
    - restaurante:il-giardino
  ordem: 7057
  fontes:
    - /all-inclusive/restaurantes/il-giardino/
d-restaurante-il-giardino-05:
  pergunta: O que fazer se não houver horário livre no Il Giardino?
  resposta: Se as reservas incluídas já tiverem sido usadas ou não houver mesa livre, o Restaurante dos Corais atende o jantar em buffet das 19h às 22h, sem necessidade de marcação. A praça de alimentação do resort continua como alternativa para quem quer apenas um lanche.
  tema: all-inclusive
  paginas:
    - restaurante:il-giardino
  ordem: 7058
  fontes:
    - /all-inclusive/restaurantes/il-giardino/
d-restaurante-la-brasa-01:
  pergunta: Dá para almoçar no La Brasa todos os dias da estadia?
  resposta: O almoço de churrasco do La Brasa integra o plano all inclusive e não figura entre os serviços que exigem marcação. Já o jantar temático de carnes depende das reservas incluídas, em quantidade que varia com as noites e é confirmada no Guest Service do resort.
  tema: all-inclusive
  paginas:
    - restaurante:la-brasa
  ordem: 7059
  fontes:
    - /all-inclusive/restaurantes/la-brasa/
d-restaurante-la-brasa-02:
  pergunta: O La Brasa tem opções para quem não come carne?
  resposta: O cardápio de referência é de churrasco, com entradas, cortes, espetinhos e acompanhamentos, e não há menu específico divulgado para quem não come carne. Nesse caso, o buffet do Restaurante dos Corais serve saladas, massas e pratos quentes no almoço e no jantar.
  tema: all-inclusive
  paginas:
    - restaurante:la-brasa
  ordem: 7060
  fontes:
    - /all-inclusive/restaurantes/la-brasa/
d-restaurante-la-brasa-03:
  pergunta: O La Brasa agrada às crianças?
  resposta: O formato informal do almoço costuma funcionar bem com os pequenos, entre carnes grelhadas, acompanhamentos simples e sobremesas como pudim, mousse de chocolate e arroz doce. À noite, o espaço vira restaurante temático e exige reserva, então vale combinar o horário com a família antes.
  tema: all-inclusive
  paginas:
    - restaurante:la-brasa
  ordem: 7061
  fontes:
    - /all-inclusive/restaurantes/la-brasa/
d-restaurante-la-brasa-04:
  pergunta: As bebidas do La Brasa entram no all inclusive?
  resposta: As bebidas seguem a regra geral do plano, que contempla água, água de coco, sucos, refrigerantes, cervejas, caipirinhas, destilados, vinhos em taça e coquetéis. Bebidas importadas, espumante e vinho em garrafa não integram o pacote e têm condições próprias, informadas pelo resort.
  tema: all-inclusive
  paginas:
    - restaurante:la-brasa
  ordem: 7062
  fontes:
    - /all-inclusive/restaurantes/la-brasa/
d-restaurante-la-brasa-05:
  pergunta: O La Brasa é um dos restaurantes temáticos do resort?
  resposta: É. O La Brasa integra o trio de temáticos do Grand Oca Maragogi, ao lado do Ix’U, de cozinha fusion, e do Il Giardino, italiano. Os três pedem reserva no Guest Service para o jantar, enquanto o Restaurante dos Corais atende em buffet, sem marcação.
  tema: all-inclusive
  paginas:
    - restaurante:la-brasa
  ordem: 7063
  fontes:
    - /all-inclusive/restaurantes/la-brasa/
d-restaurante-praca-de-alimentacao-01:
  pergunta: Onde fica a Praça de Alimentação do Grand Oca Maragogi?
  resposta: Os pontos de petiscos ficam na rua de compras do resort, mesma área do Onda Oca Hamburguer Bar, da Cantina Mex Oca, da Pizzoca e da Gelattoca. É um espaço de passagem entre as lojas, procurado nos intervalos dos horários das refeições principais.
  tema: all-inclusive
  paginas:
    - restaurante:praca-de-alimentacao
  ordem: 7064
  fontes:
    - /all-inclusive/restaurantes/praca-de-alimentacao/
d-data-especial-carnaval-01:
  pergunta: O que fazer no Grand Oca Maragogi em vez de sair para a folia no Carnaval?
  resposta: Quem prefere ficar na hospedagem encontra piscinas distribuídas por quase 400 metros, com profundidades diferentes, em frente aos bangalôs, e a faixa de areia logo adiante. A programação diária de lazer segue no feriado, com atividades para adultos e crianças ao longo do dia.
  tema: lazer
  paginas:
    - data-especial:carnaval
  ordem: 7065
  fontes:
    - /datas-especiais/carnaval/
d-data-especial-carnaval-02:
  pergunta: Os bares do resort funcionam durante o Carnaval?
  resposta: 'No Carnaval, os sete bares seguem a operação habitual: Coqueirais, Galés, dentro da piscina, Drink Parrot, Ponta de Mangue, na areia, Esplanada Tropical, bar da Piscina D’Água e SportBar. As bebidas selecionadas do plano all inclusive acompanham a hospedagem em todos eles.'
  tema: all-inclusive
  paginas:
    - data-especial:carnaval
  ordem: 7066
  fontes:
    - /datas-especiais/carnaval/
d-data-especial-carnaval-03:
  pergunta: A agência de viagens do resort organiza traslados no Carnaval?
  resposta: A agência que funciona dentro do resort reserva traslados e passeios pela região, contratados à parte da hospedagem. Como o Grand Oca Maragogi está em Ponta de Mangue, ao norte do centro, quem quer acompanhar os desfiles e os bailes da cidade depende de transporte.
  tema: localizacao
  paginas:
    - data-especial:carnaval
  ordem: 7067
  fontes:
    - /datas-especiais/carnaval/
d-data-especial-carnaval-04:
  pergunta: As crianças têm atividades no resort durante o Carnaval?
  resposta: A recreação mantém no feriado atividades como gincanas, caminhada ecológica, polo e basquete aquático e oficinas para a faixa de 4 a 12 anos. Os horários seguem a agenda do Kids Club, e a lista de cada dia é divulgada pela equipe durante a estadia.
  tema: lazer
  paginas:
    - data-especial:carnaval
  ordem: 7068
  fontes:
    - /datas-especiais/carnaval/
d-data-especial-carnaval-05:
  pergunta: Dá para mergulhar nas piscinas naturais durante o Carnaval?
  resposta: Dá. O centro de mergulho com certificação PADI organiza aulas e saídas aos recifes da Costa dos Corais, contratadas à parte. Os horários dependem das marés e das condições do mar no dia, e a procura pelos passeios é maior em feriados como esse.
  tema: destino
  paginas:
    - data-especial:carnaval
  ordem: 7069
  fontes:
    - /datas-especiais/carnaval/
d-data-especial-carnaval-06:
  pergunta: O Carnaval cai na alta temporada de Maragogi?
  resposta: O Carnaval acontece no verão, uma das épocas de maior ocupação na região, quando o resort monta a Arena Taba e mantém shows na Esplanada Tropical. Como a data depende do calendário da Páscoa, ela muda todos os anos, e as categorias se esgotam mais rápido.
  tema: destino
  paginas:
    - data-especial:carnaval
  ordem: 7070
  fontes:
    - /datas-especiais/carnaval/
d-data-especial-pascoa-01:
  pergunta: Quais acomodações atendem famílias numerosas na Páscoa?
  resposta: 'No feriadão, as famílias grandes costumam procurar as categorias de maior capacidade. Duas chegam a seis hóspedes: o Standard Comunicante, com dois quartos e dois banheiros, e a maior acomodação do resort, de 72 metros quadrados. Uma terceira, o Duplo Deluxe, acomoda cinco pessoas.'
  tema: hospedagem
  paginas:
    - data-especial:pascoa
  ordem: 7071
  fontes:
    - /datas-especiais/pascoa/
d-data-especial-pascoa-02:
  pergunta: Que esportes e atividades os adultos encontram na Páscoa?
  resposta: A agenda para adultos vai das 9h às 23h e inclui caiaque, hidroginástica, vôlei, beach tênis, futebol e aulas de dança, além da academia. No feriadão, as atividades seguem a programação vigente, que pode mudar conforme o clima e a operação do resort.
  tema: lazer
  paginas:
    - data-especial:pascoa
  ordem: 7072
  fontes:
    - /datas-especiais/pascoa/
d-data-especial-pascoa-03:
  pergunta: Os restaurantes temáticos funcionam no feriado da Páscoa?
  resposta: Funcionam. O Ix’U, o Il Giardino e o jantar do La Brasa seguem abertos, com reserva prévia no Guest Service, e o Restaurante dos Corais serve as três refeições em buffet. O número de jantares incluídos depende da quantidade de noites reservadas.
  tema: all-inclusive
  paginas:
    - data-especial:pascoa
  ordem: 7073
  fontes:
    - /datas-especiais/pascoa/
d-data-especial-pascoa-04:
  pergunta: Quais bebidas acompanham a hospedagem na Páscoa?
  resposta: Entram no plano a água, a água de coco, os sucos, os refrigerantes, as cervejas, as caipirinhas, os destilados, o vinho servido em taça, os coquetéis e os snacks, com reposição do frigobar. Rótulos importados, espumantes, garrafas de vinho e o serviço de quarto são cobrados separadamente.
  tema: all-inclusive
  paginas:
    - data-especial:pascoa
  ordem: 7074
  fontes:
    - /datas-especiais/pascoa/
d-data-especial-pascoa-05:
  pergunta: A que horas o quarto fica pronto na Sexta-feira Santa?
  resposta: A entrada no apartamento começa às 15h, e a saída vai até as 12h do último dia. Na Sexta-feira Santa, quando muita gente chega na mesma data, a entrada antecipada depende de disponibilidade, então vale combinar o horário de chegada com a equipe da Resorts Online.
  tema: hospedagem
  paginas:
    - data-especial:pascoa
  ordem: 7075
  fontes:
    - /datas-especiais/pascoa/
d-data-especial-pascoa-06:
  pergunta: O que a área D’Água oferece no feriadão da Páscoa?
  resposta: Essa é a ala mais recente do resort, com piscinas, borda infinita, solário, parque aquático e um bar de snacks e gelados. Nela ficam os quartos Deluxe, com varanda voltada para a água, bastante procurados por famílias nos feriados de março e abril.
  tema: lazer
  paginas:
    - data-especial:pascoa
  ordem: 7076
  fontes:
    - /datas-especiais/pascoa/
d-data-especial-tiradentes-01:
  pergunta: Quais acomodações combinam com um casal no feriado de Tiradentes?
  resposta: Para dois hóspedes, as opções são os Bangalôs Vista Jardim e Vista Piscina, térreos e instalados ao lado das piscinas, e as duas Suítes do andar superior, com cama king size e vista parcial para a Praia de Ponta de Mangue. A oferta é limitada.
  tema: hospedagem
  paginas:
    - data-especial:tiradentes
  ordem: 7077
  fontes:
    - /datas-especiais/tiradentes/
d-data-especial-tiradentes-02:
  pergunta: Quais serviços o resort mantém abertos no feriado de Tiradentes?
  resposta: A estrutura inclui Guest Service ao lado da recepção, enfermaria, lojas e fitness center, em funcionamento também nos feriados. No Guest Service são marcadas as reservas dos restaurantes temáticos, o que importa numa estadia curta, com menos noites para dividir entre os jantares.
  tema: resort
  paginas:
    - data-especial:tiradentes
  ordem: 7078
  fontes:
    - /datas-especiais/tiradentes/
d-data-especial-tiradentes-03:
  pergunta: O que o resort serve no fim da tarde no feriado de Tiradentes?
  resposta: 'Há uma pausa entre as refeições quentes: o chá da tarde ocupa a hora entre 16h30 e 17h30, depois do almoço e antes do serviço noturno. O bar da Piscina D’Água complementa com snacks e gelados, útil nas tardes mais curtas do mês de abril.'
  tema: all-inclusive
  paginas:
    - data-especial:tiradentes
  ordem: 7079
  fontes:
    - /datas-especiais/tiradentes/
d-data-especial-tiradentes-04:
  pergunta: O que fica fora do all inclusive numa estadia de Tiradentes?
  resposta: 'Mesmo em poucos dias vale saber o que não entra: bebidas importadas, espumante, vinho em garrafa, serviço de quarto e a experiência VIP Premium, que tem preço próprio e exige 14 anos. Salão de beleza, spa e mergulho também seguem condições separadas.'
  tema: all-inclusive
  paginas:
    - data-especial:tiradentes
  ordem: 7080
  fontes:
    - /datas-especiais/tiradentes/
d-data-especial-tiradentes-05:
  pergunta: A praia do resort fica aberta no feriado de Tiradentes?
  resposta: A Praia de Ponta de Mangue está a poucos metros das piscinas, com um bar na areia e atividades como caiaque na agenda do dia. No feriado de abril, praia e piscinas seguem disponíveis conforme a programação vigente, que pode mudar por causa do clima.
  tema: lazer
  paginas:
    - data-especial:tiradentes
  ordem: 7081
  fontes:
    - /datas-especiais/tiradentes/
d-data-especial-tiradentes-06:
  pergunta: Onde lanchar fora dos horários das refeições em Tiradentes?
  resposta: A praça de alimentação reúne o Onda Oca Hamburguer Bar, a Cantina Mex Oca, com burritos e tacos, a Pizzoca, de pizzas, e a Gelattoca, de sorvetes e picolés. É uma alternativa prática em um feriado de poucos dias, entre a piscina e a praia.
  tema: all-inclusive
  paginas:
    - data-especial:tiradentes
  ordem: 7082
  fontes:
    - /datas-especiais/tiradentes/
d-data-especial-dia-do-trabalho-01:
  pergunta: O resort tem academia no feriado de 1º de maio?
  resposta: A academia oferece aulas como Cardio HIT, GAP, treino funcional, Pilates com bola, alongamento e hidro fitness, dentro da programação para adultos. No feriado, a agenda segue o calendário vigente do resort, que pode mudar conforme o clima e a operação de cada dia.
  tema: lazer
  paginas:
    - data-especial:dia-do-trabalho
  ordem: 7083
  fontes:
    - /datas-especiais/dia-do-trabalho/
d-data-especial-dia-do-trabalho-02:
  pergunta: O parque aquático abre no feriado do Dia do Trabalho?
  resposta: O parque aquático tem toboáguas e áreas rasas e fica na ala D’Água, a mais nova do resort. No feriado de 1º de maio, funciona de acordo com a agenda do dia, e as crianças contam ainda com playground e piscinas de profundidades variadas.
  tema: lazer
  paginas:
    - data-especial:dia-do-trabalho
  ordem: 7084
  fontes:
    - /datas-especiais/dia-do-trabalho/
d-data-especial-dia-do-trabalho-03:
  pergunta: É possível cancelar a viagem do feriado de 1º de maio?
  resposta: A regra depende da tarifa escolhida, informada antes do pagamento, e as promocionais podem não prever reembolso. Contratações feitas a distância admitem desistência em até sete dias, conforme o artigo 49 do Código de Defesa do Consumidor. Confirme a condição aplicável antes de pagar.
  tema: reservas
  paginas:
    - data-especial:dia-do-trabalho
  ordem: 7085
  fontes:
    - /datas-especiais/dia-do-trabalho/
d-data-especial-dia-do-trabalho-04:
  pergunta: Como é o café da manhã no feriado de 1º de maio?
  resposta: O café é servido das 7h às 10h no Restaurante dos Corais, em buffet com mais de 70 itens, entre tapiocas, bolo de goma e doces regionais. No feriado, o horário segue o padrão da casa, que pode ser ajustado conforme a ocupação do período.
  tema: all-inclusive
  paginas:
    - data-especial:dia-do-trabalho
  ordem: 7086
  fontes:
    - /datas-especiais/dia-do-trabalho/
d-data-especial-dia-do-trabalho-05:
  pergunta: Onde as crianças brincam fora da água no feriado de maio?
  resposta: Fora da piscina, há playground com cama elástica e escorregadores e o Play Zone, espaço de brinquedos do resort. A recreação atende de 4 a 12 anos, das 9h às 12h e das 14h às 18h, com jogos e oficinas também durante o feriado.
  tema: lazer
  paginas:
    - data-especial:dia-do-trabalho
  ordem: 7087
  fontes:
    - /datas-especiais/dia-do-trabalho/
d-data-especial-dia-do-trabalho-06:
  pergunta: Vale conhecer o centro de Maragogi no feriado de 1º de maio?
  resposta: 'O centro guarda três igrejas históricas: a Matriz de Santo Antônio, do fim do século XIX, e as de Nossa Senhora da Guia e São Bento, do século XVII. Como o resort fica em Ponta de Mangue, a ida até lá exige carro, táxi ou traslado.'
  tema: destino
  paginas:
    - data-especial:dia-do-trabalho
  ordem: 7088
  fontes:
    - /datas-especiais/dia-do-trabalho/
d-data-especial-sete-de-setembro-01:
  pergunta: Os restaurantes ficam lotados no feriado de 7 de Setembro?
  resposta: O Restaurante dos Corais atende 340 pessoas de frente para o mar, e as refeições são distribuídas em janelas ao longo do dia, o que ajuda a organizar o fluxo. Os três temáticos, com reserva, e a praça de alimentação dividem a demanda do período.
  tema: all-inclusive
  paginas:
    - data-especial:sete-de-setembro
  ordem: 7089
  fontes:
    - /datas-especiais/sete-de-setembro/
d-data-especial-sete-de-setembro-02:
  pergunta: Como pagar a reserva do feriado de 7 de Setembro?
  resposta: A Resorts Online parcela em até 10 vezes sem juros no cartão de crédito e concede 5% de desconto para quem paga à vista no Pix, nas tarifas elegíveis. As condições variam conforme a oferta e o período, e valem as exibidas no momento de fechar.
  tema: reservas
  paginas:
    - data-especial:sete-de-setembro
  ordem: 7090
  fontes:
    - /datas-especiais/sete-de-setembro/
d-data-especial-sete-de-setembro-03:
  pergunta: O resort tem Wi-Fi para os hóspedes no feriado de setembro?
  resposta: Há rede sem fio disponível nas áreas do resort, com qualidade e alcance que variam conforme o local e o número de pessoas conectadas. Em datas de maior ocupação, como esse feriado, vale confirmar os detalhes do acesso com a recepção no momento da chegada.
  tema: resort
  paginas:
    - data-especial:sete-de-setembro
  ordem: 7091
  fontes:
    - /datas-especiais/sete-de-setembro/
d-data-especial-sete-de-setembro-04:
  pergunta: Quais documentos levar para o feriado de 7 de Setembro?
  resposta: Na chegada são pedidos documento oficial com foto de todos os hóspedes, inclusive das crianças, CPF, endereço completo e contato. Menores de 18 anos só se hospedam com os pais ou responsável legal e, acompanhados de outro adulto, precisam de autorização expressa dos pais.
  tema: hospedagem
  paginas:
    - data-especial:sete-de-setembro
  ordem: 7092
  fontes:
    - /datas-especiais/sete-de-setembro/
d-data-especial-sete-de-setembro-05:
  pergunta: A experiência VIP Premium serve para o feriado de setembro?
  resposta: A VIP Premium é um serviço adicional, com área reservada na praia, camas de praia, hostess, bebidas selecionadas e brunch no Ix’U, das 9h às 17h. Tem preço próprio, fora do plano, e não aceita menores de 14 anos, o que exclui famílias com crianças.
  tema: all-inclusive
  paginas:
    - data-especial:sete-de-setembro
  ordem: 7093
  fontes:
    - /datas-especiais/sete-de-setembro/
d-data-especial-sete-de-setembro-06:
  pergunta: Quais categorias têm varanda para aproveitar o feriado de setembro?
  resposta: 'Quatro categorias aparecem com esse item: o Standard Comunicante, cujos dois quartos têm uma cada, e os quartos Deluxe, o Duplo Deluxe e a Suíte Deluxe, de frente para a piscina da ala nova. As outras acomodações não registram esse espaço externo na descrição.'
  tema: hospedagem
  paginas:
    - data-especial:sete-de-setembro
  ordem: 7094
  fontes:
    - /datas-especiais/sete-de-setembro/
d-data-especial-dia-das-criancas-01:
  pergunta: Quais oficinas as crianças fazem no Dia das Crianças?
  resposta: A recreação inclui oficinas de massinha, brigadeiro, cupcake e pizza, atividades que costumam agradar justamente nessa data. Elas fazem parte do Kids Club e seguem a agenda divulgada durante a hospedagem, que muda conforme o dia da semana, o clima e a operação.
  tema: lazer
  paginas:
    - data-especial:dia-das-criancas
  ordem: 7095
  fontes:
    - /datas-especiais/dia-das-criancas/
d-data-especial-dia-das-criancas-02:
  pergunta: Quais brincadeiras na água o resort oferece no Dia das Crianças?
  resposta: Na água, a programação infantil tem hidro kids, polo e basquete aquático e jogos nas partes rasas das piscinas, que variam de profundidade. O parque aquático com toboáguas completa o dia, e os pequenos devem estar sempre com um responsável nas áreas de banho.
  tema: lazer
  paginas:
    - data-especial:dia-das-criancas
  ordem: 7096
  fontes:
    - /datas-especiais/dia-das-criancas/
d-data-especial-dia-das-criancas-03:
  pergunta: O que são a festa da espuma e o Family Oca?
  resposta: 'São duas atrações da recreação: a festa da espuma, voltada à turma menor, e o Family Oca, que reúne pais e filhos na mesma brincadeira. Há ainda uma caminhada ecológica pela área verde, e os horários de cada uma saem na agenda diária do resort.'
  tema: lazer
  paginas:
    - data-especial:dia-das-criancas
  ordem: 7097
  fontes:
    - /datas-especiais/dia-das-criancas/
d-data-especial-dia-das-criancas-04:
  pergunta: Quais são os horários das refeições para quem viaja com crianças?
  resposta: 'As refeições têm janelas definidas: café das 7h às 10h, almoço das 12h30 às 15h, chá da tarde das 16h30 às 17h30 e jantar das 19h às 22h. Com crianças pequenas, vale organizar as sonecas e os banhos em torno desses intervalos, que podem mudar.'
  tema: all-inclusive
  paginas:
    - data-especial:dia-das-criancas
  ordem: 7098
  fontes:
    - /datas-especiais/dia-das-criancas/
d-data-especial-dia-das-criancas-05:
  pergunta: E se chover no feriado do Dia das Crianças?
  resposta: O resort prepara uma agenda específica para dias chuvosos, com brincadeiras sob cobertura, e a estrutura de alimentação segue aberta. Algumas atividades ao ar livre podem ser remarcadas ou trocadas de lugar, então a equipe de recreação informa a lista válida logo no início da manhã.
  tema: lazer
  paginas:
    - data-especial:dia-das-criancas
  ordem: 7099
  fontes:
    - /datas-especiais/dia-das-criancas/
d-data-especial-dia-das-criancas-06:
  pergunta: Bebês de colo têm estrutura no feriado do Dia das Crianças?
  resposta: Têm. O resort mantém uma baby area para famílias com crianças pequenas, e os bangalôs recebem dois adultos e um bebê em berço. Menores de 4 anos participam de algumas atividades com um responsável por perto, já que a recreação começa a partir dessa idade.
  tema: lazer
  paginas:
    - data-especial:dia-das-criancas
  ordem: 7100
  fontes:
    - /datas-especiais/dia-das-criancas/
d-data-especial-finados-01:
  pergunta: Quais categorias têm mais chance de vaga na ponte de Finados?
  resposta: 'As categorias mais numerosas tendem a oferecer mais alternativas em pontes curtas: o Apartamento Standard soma 120 unidades, e os bangalôs reúnem 49 Vista Jardim, 48 Vista Piscina e 49 Triplos. As duas Suítes, no extremo oposto, se esgotam com facilidade nessas datas.'
  tema: hospedagem
  paginas:
    - data-especial:finados
  ordem: 7101
  fontes:
    - /datas-especiais/finados/
d-data-especial-finados-02:
  pergunta: O resort tem estacionamento para quem vai de carro em Finados?
  resposta: O Grand Oca Maragogi não divulga informações sobre estacionamento, e este site não publica dados que o resort não confirma. Quem pretende dirigir até Ponta de Mangue no feriado pode pedir essa confirmação à central da Resorts Online, no 0800 737 6787, antes de viajar.
  tema: resort
  paginas:
    - data-especial:finados
  ordem: 7102
  fontes:
    - /datas-especiais/finados/
d-data-especial-finados-03:
  pergunta: A recreação infantil funciona no feriado de Finados?
  resposta: Funciona. O Kids Club atende a faixa de 4 a 12 anos em dois turnos, pela manhã e à tarde, inclusive em feriados, com jogos, oficinas e brincadeiras na piscina e na areia. Quem chega recebe a agenda do período na recepção ou com os recreadores.
  tema: lazer
  paginas:
    - data-especial:finados
  ordem: 7103
  fontes:
    - /datas-especiais/finados/
d-data-especial-finados-04:
  pergunta: O que levar na mala para o feriado de Finados?
  resposta: Para poucos dias bastam roupas leves, duas roupas de banho, chinelo, chapéu, óculos de sol e protetor solar. As tomadas dos apartamentos são de 220 volts, então confira se os carregadores são bivolt, e leve calçado para a água se pretende visitar os recifes.
  tema: hospedagem
  paginas:
    - data-especial:finados
  ordem: 7104
  fontes:
    - /datas-especiais/finados/
d-data-especial-finados-05:
  pergunta: Qual é a rota até o resort no feriado de Finados?
  resposta: O endereço é na Rodovia AL-101 Norte, em Ponta de Mangue, a cerca de 126 quilômetros do Recife, 136 de Maceió e 153 de Caruaru. Em feriados, o movimento nas estradas aumenta, e o trecho final costuma ser feito de carro, táxi ou traslado.
  tema: localizacao
  paginas:
    - data-especial:finados
  ordem: 7105
  fontes:
    - /datas-especiais/finados/
d-data-especial-finados-06:
  pergunta: Vale incluir o aéreo na reserva do feriado de Finados?
  resposta: As duas formas existem. A reserva apenas da hospedagem serve para quem já tem passagem ou vai de carro, e o pacote com aéreo reúne hotel e voos em uma cotação. Em feriados, voos e categorias se esgotam antes, e a antecedência amplia as escolhas.
  tema: reservas
  paginas:
    - data-especial:finados
  ordem: 7106
  fontes:
    - /datas-especiais/finados/
d-data-especial-proclamacao-da-republica-01:
  pergunta: O resort tem lojas para visitar no feriado de 15 de Novembro?
  resposta: Há uma rua de compras com lojas, onde também funciona a praça de alimentação, com hamburgueria, cantina mexicana, pizzaria e sorveteria. É um espaço útil nas tardes do feriado, quando o movimento se divide entre as piscinas, a faixa de areia e as compras.
  tema: resort
  paginas:
    - data-especial:proclamacao-da-republica
  ordem: 7107
  fontes:
    - /datas-especiais/proclamacao-da-republica/
d-data-especial-proclamacao-da-republica-02:
  pergunta: O salão de beleza e a academia abrem no feriado de 15 de Novembro?
  resposta: O salão de beleza atende sete dias por semana, e o fitness center funciona dentro da programação para adultos, das 9h às 23h. Serviços de beleza, spa e mergulho seguem condições próprias, não incluídas no plano all inclusive, e os valores não são divulgados.
  tema: resort
  paginas:
    - data-especial:proclamacao-da-republica
  ordem: 7108
  fontes:
    - /datas-especiais/proclamacao-da-republica/
d-data-especial-proclamacao-da-republica-03:
  pergunta: Quais acomodações recebem seis pessoas no feriado de 15 de Novembro?
  resposta: São duas. Uma delas distribui o grupo em dois quartos ligados, com banheiro e varanda em cada um, cercados pelo gramado. A outra é a Suíte Deluxe, na ala nova, que recebe o mesmo total em 72 metros quadrados, com limite de quatro adultos e duas crianças.
  tema: hospedagem
  paginas:
    - data-especial:proclamacao-da-republica
  ordem: 7109
  fontes:
    - /datas-especiais/proclamacao-da-republica/
d-data-especial-proclamacao-da-republica-04:
  pergunta: O que fazer à noite no resort no feriado de 15 de Novembro?
  resposta: À noite, há shows na Esplanada Tropical, que funciona também como bar, e o SportBar atende quem prefere um ambiente voltado aos esportes. As atrações específicas do feriado, quando houver, são divulgadas pelo resort perto da data, junto da agenda diária de lazer.
  tema: lazer
  paginas:
    - data-especial:proclamacao-da-republica
  ordem: 7110
  fontes:
    - /datas-especiais/proclamacao-da-republica/
d-data-especial-proclamacao-da-republica-05:
  pergunta: Qual é o horário de entrada e saída no feriado de 15 de Novembro?
  resposta: O apartamento é liberado às 15h, e a devolução acontece até o meio-dia. Em emendas de feriado, com muita gente chegando e partindo na mesma data, antecipar a entrada ou esticar a saída fica sujeito à ocupação e pode ter cobrança própria, conforme a recepção informar.
  tema: hospedagem
  paginas:
    - data-especial:proclamacao-da-republica
  ordem: 7111
  fontes:
    - /datas-especiais/proclamacao-da-republica/
d-data-especial-proclamacao-da-republica-06:
  pergunta: Preciso levar adaptador de tomada para o feriado de 15 de Novembro?
  resposta: A rede elétrica dos quartos é de 220 volts, então aparelhos que só funcionam em 110 pedem adaptador. Para esse feriado, a mala pede roupas leves, traje de banho, protetor solar e, se houver visita aos recifes no roteiro, um calçado que possa entrar na água.
  tema: hospedagem
  paginas:
    - data-especial:proclamacao-da-republica
  ordem: 7112
  fontes:
    - /datas-especiais/proclamacao-da-republica/
d-data-especial-consciencia-negra-01:
  pergunta: Quais atividades os adultos encontram no feriado da Consciência Negra?
  resposta: 'Das nove da manhã às onze da noite, o resort mantém opções para o público adulto: aulas de dança, partidas de vôlei, de beach tênis e de futebol, remada de caiaque e hidroginástica. No feriado de novembro, a lista segue a agenda em vigor e pode mudar.'
  tema: lazer
  paginas:
    - data-especial:consciencia-negra
  ordem: 7113
  fontes:
    - /datas-especiais/consciencia-negra/
d-data-especial-consciencia-negra-02:
  pergunta: Os jantares temáticos funcionam no feriado da Consciência Negra?
  resposta: 'Funcionam normalmente. São três casas: uma de cozinha fusion à beira da praia, uma italiana e uma de carnes na brasa, todas com mesa marcada antes, no balcão do Guest Service. O total de noites contratadas define quantos desses jantares entram na hospedagem.'
  tema: all-inclusive
  paginas:
    - data-especial:consciencia-negra
  ordem: 7114
  fontes:
    - /datas-especiais/consciencia-negra/
d-data-especial-consciencia-negra-03:
  pergunta: Quais acomodações combinam com um casal no feriado de 20 de novembro?
  resposta: O fim de semana prolongado combina com os bangalôs, térreos e vizinhos das piscinas, e com os quartos Deluxe da ala nova, que têm varanda voltada para a água. As duas Suítes do andar superior são a alternativa mais exclusiva, com disponibilidade bastante restrita.
  tema: hospedagem
  paginas:
    - data-especial:consciencia-negra
  ordem: 7115
  fontes:
    - /datas-especiais/consciencia-negra/
d-data-especial-consciencia-negra-04:
  pergunta: Dá para visitar as piscinas naturais no feriado de 20 de novembro?
  resposta: Dá. As piscinas naturais da Costa dos Corais têm profundidade média de cerca de um metro e ficam em área de preservação ambiental, adequada ao snorkel. Os passeios são organizados pelo centro de mergulho PADI e pela agência do resort, contratados à parte, conforme a maré.
  tema: destino
  paginas:
    - data-especial:consciencia-negra
  ordem: 7116
  fontes:
    - /datas-especiais/consciencia-negra/
d-data-especial-consciencia-negra-05:
  pergunta: Onde provar a comida regional durante o feriado da Consciência Negra?
  resposta: O restaurante principal trabalha com buffet de culinária regional nas três refeições, com estações de preparo à vista e receitas do Nordeste entre as opções. Fica de frente para o mar, atende sem necessidade de marcar mesa e dispensa a reserva pedida pelos temáticos.
  tema: all-inclusive
  paginas:
    - data-especial:consciencia-negra
  ordem: 7117
  fontes:
    - /datas-especiais/consciencia-negra/
d-data-especial-consciencia-negra-06:
  pergunta: Como é a cidade de Maragogi no feriado de 20 de novembro?
  resposta: Maragogi é a segunda cidade mais turística de Alagoas, atrás de Maceió, e vive do turismo depois de um passado de pesca e cana-de-açúcar. Quem quiser conhecer o centro no feriado precisa de transporte, porque a hospedagem fica em Ponta de Mangue, mais ao norte.
  tema: destino
  paginas:
    - data-especial:consciencia-negra
  ordem: 7118
  fontes:
    - /datas-especiais/consciencia-negra/
d-data-especial-natal-01:
  pergunta: Quais acomodações reúnem a família toda no Natal?
  resposta: Para juntar todos, o Standard Comunicante acomoda seis hóspedes em dois quartos e dois banheiros, e a Suíte Deluxe, de 72 metros quadrados, também recebe seis, com sala de estar e varanda. O Duplo Deluxe, de 50 metros quadrados, chega a cinco pessoas.
  tema: hospedagem
  paginas:
    - data-especial:natal
  ordem: 7119
  fontes:
    - /datas-especiais/natal/
d-data-especial-natal-02:
  pergunta: O espumante do brinde de Natal está incluído?
  resposta: O plano abrange bebidas selecionadas, como sucos, refrigerantes, cervejas, caipirinhas, destilados, coquetéis e vinhos em taça. Espumante, vinho em garrafa e bebidas importadas não integram o cardápio padrão, o que vale saber para quem pretende brindar a data, e seguem condições próprias do resort.
  tema: all-inclusive
  paginas:
    - data-especial:natal
  ordem: 7120
  fontes:
    - /datas-especiais/natal/
d-data-especial-natal-03:
  pergunta: O que as crianças fazem no resort durante o Natal?
  resposta: Os pequenos dividem o dia entre os toboáguas do parque aquático, os trechos rasos das várias piscinas e o playground com cama elástica. A turma de 4 a 12 anos tem recreação em dois turnos, e a lista de atrações do feriado sai perto da data.
  tema: lazer
  paginas:
    - data-especial:natal
  ordem: 7121
  fontes:
    - /datas-especiais/natal/
d-data-especial-natal-04:
  pergunta: Dá para passar o Natal e o Réveillon no mesmo resort?
  resposta: Dá, conforme a disponibilidade. O Natal é em 25 de dezembro e a virada, em 31, o que permite estadias longas entre as duas datas. Como ambas concentram procura, o mínimo de noites e as categorias livres são confirmados na cotação pela equipe da Resorts Online.
  tema: reservas
  paginas:
    - data-especial:natal
  ordem: 7122
  fontes:
    - /datas-especiais/natal/
d-data-especial-natal-05:
  pergunta: O Natal coincide com as férias escolares em Maragogi?
  resposta: Coincide. A data cai no período de férias escolares e no verão do Nordeste, quando a procura pela região sobe e as categorias de maior capacidade são as primeiras a acabar. Quanto mais cedo a consulta, maior a chance de escolher a acomodação preferida.
  tema: destino
  paginas:
    - data-especial:natal
  ordem: 7123
  fontes:
    - /datas-especiais/natal/
d-data-especial-natal-06:
  pergunta: Dá para chegar ao resort no dia 24 de dezembro?
  resposta: Dá, e o quarto é liberado a partir das 15h também na véspera, com devolução até o meio-dia na saída. Quem desembarca na manhã do dia 24 e quer subir antes depende da ocupação, por isso vale alinhar esse detalhe com a equipe antes de viajar.
  tema: hospedagem
  paginas:
    - data-especial:natal
  ordem: 7124
  fontes:
    - /datas-especiais/natal/
d-data-especial-reveillon-01:
  pergunta: Como é a praia do resort na virada do ano?
  resposta: A hospedagem fica a uns 10 metros da areia, com um bar na faixa de praia, e as piscinas se estendem por quase 400 metros em frente aos bangalôs. É essa estrutura que o hóspede encontra na virada, somada à programação divulgada pelo resort.
  tema: lazer
  paginas:
    - data-especial:reveillon
  ordem: 7125
  fontes:
    - /datas-especiais/reveillon/
d-data-especial-reveillon-02:
  pergunta: Vale incluir o aéreo na reserva do Réveillon?
  resposta: Depende de como o grupo pretende viajar. Quem já resolveu o deslocamento fecha apenas a diária, e quem ainda não comprou a passagem pode cotar hotel e voo juntos. Na virada do ano, as duas frentes ficam disputadas ao mesmo tempo, o que torna a decisão antecipada decisiva.
  tema: reservas
  paginas:
    - data-especial:reveillon
  ordem: 7126
  fontes:
    - /datas-especiais/reveillon/
d-data-especial-reveillon-03:
  pergunta: Como pagar a reserva do Réveillon?
  resposta: 'Há duas formas principais: o cartão de crédito, dividido em até dez parcelas sem acréscimo, e o Pix, que dá 5% de abatimento no pagamento integral. A regra vale para as tarifas elegíveis e muda conforme a oferta, por isso sempre valem as condições mostradas na hora.'
  tema: reservas
  paginas:
    - data-especial:reveillon
  ordem: 7127
  fontes:
    - /datas-especiais/reveillon/
d-data-especial-reveillon-04:
  pergunta: E se chover na noite da virada?
  resposta: A chuva pode alterar as atividades ao ar livre, e existe uma programação alternativa em espaços cobertos, além dos restaurantes, dos bares e da academia. Este site não publica previsão do tempo, então vale acompanhar as condições da região nos dias que antecedem a viagem.
  tema: lazer
  paginas:
    - data-especial:reveillon
  ordem: 7128
  fontes:
    - /datas-especiais/reveillon/
d-data-especial-reveillon-05:
  pergunta: Onde reservar os jantares temáticos durante o Réveillon?
  resposta: O Guest Service funciona ao lado da recepção e é onde se marcam os jantares nos restaurantes temáticos, item concorrido no fim de ano. O resort mantém ainda enfermaria, lojas e fitness center, e a agência interna organiza traslados e passeios, contratados à parte.
  tema: all-inclusive
  paginas:
    - data-especial:reveillon
  ordem: 7129
  fontes:
    - /datas-especiais/reveillon/
d-data-especial-reveillon-06:
  pergunta: O café da manhã é servido no dia 1º de janeiro?
  resposta: Sim. O buffet matinal, com mais de 70 itens, abre às 7h e encerra às 10h também no primeiro dia do ano, no salão de frente para o mar. A operação pode ajustar esse intervalo em datas de grande movimento e avisa os hóspedes quando isso acontece.
  tema: all-inclusive
  paginas:
    - data-especial:reveillon
  ordem: 7130
  fontes:
    - /datas-especiais/reveillon/
d-guia-cidade-de-maragogi-01:
  pergunta: Qual é o endereço do Grand Oca Maragogi na cidade de Maragogi?
  resposta: O resort fica na Rodovia AL-101 Norte, sem número, em Ponta de Mangue, município de Maragogi, Alagoas, CEP 57955-000. É um endereço fora do centro urbano, a poucos metros da faixa de areia, em uma área de coqueirais do litoral norte alagoano.
  tema: localizacao
  paginas:
    - guia:cidade-de-maragogi
  ordem: 7131
  fontes:
    - /maragogi/cidade-de-maragogi/
d-guia-cidade-de-maragogi-02:
  pergunta: Maragogi fica em Alagoas ou em Pernambuco?
  resposta: Maragogi fica em Alagoas, no litoral norte do estado, entre Recife e Maceió, a cerca de 126 quilômetros da capital pernambucana e 136 da alagoana. Caruaru, no interior de Pernambuco, está a 153 quilômetros. A cidade integra o trecho conhecido como Costa dos Corais.
  tema: localizacao
  paginas:
    - guia:cidade-de-maragogi
  ordem: 7132
  fontes:
    - /maragogi/cidade-de-maragogi/
d-guia-cidade-de-maragogi-03:
  pergunta: Quem organiza os traslados dos aeroportos até Maragogi?
  resposta: Quem chega de avião desembarca no Recife ou em Maceió e segue por estrada até a cidade, de automóvel, táxi ou veículo fretado. Existe uma agência de viagens instalada no próprio resort, que cuida desse deslocamento e das excursões locais, cobrados separadamente da diária.
  tema: localizacao
  paginas:
    - guia:cidade-de-maragogi
  ordem: 7133
  fontes:
    - /maragogi/cidade-de-maragogi/
d-guia-cidade-de-maragogi-04:
  pergunta: Onde provar a comida típica da região de Maragogi?
  resposta: A cozinha regional aparece no buffet do Restaurante dos Corais, com tapiocas, bolo de goma e doces típicos entre os mais de 70 itens do café da manhã. Para conhecer os restaurantes da cidade, é preciso transporte, já que o resort fica em Ponta de Mangue.
  tema: destino
  paginas:
    - guia:cidade-de-maragogi
  ordem: 7134
  fontes:
    - /maragogi/cidade-de-maragogi/
d-guia-costa-dos-corais-01:
  pergunta: Como são as praias da Costa dos Corais?
  resposta: A Costa dos Corais tem praias de coqueirais e mar azul-esmeralda, com recifes e piscinas naturais junto à costa, em área de preservação ambiental. É nesse trecho do litoral norte de Alagoas que ficam Maragogi e a Praia de Ponta de Mangue, onde está o resort.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 7135
  fontes:
    - /maragogi/costa-dos-corais/
d-guia-costa-dos-corais-02:
  pergunta: As piscinas naturais ficam longe do Grand Oca Maragogi?
  resposta: Elas ficam no mar, em frente ao litoral de Maragogi, e são alcançadas em passeios organizados pela agência do resort e pelo centro de mergulho PADI, contratados à parte. Os horários dependem da maré, e o resort fica na Praia de Ponta de Mangue.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 7136
  fontes:
    - /maragogi/costa-dos-corais/
d-guia-costa-dos-corais-03:
  pergunta: O que fazer na faixa de areia em frente ao resort?
  resposta: A Praia de Ponta de Mangue tem águas claras e tranquilas, sobretudo quando a maré baixa, e coqueirais ao fundo. Na areia funciona um bar com serviço de bebidas, e o caiaque está entre as atividades diurnas oferecidas na programação do Grand Oca Maragogi.
  tema: lazer
  paginas:
    - guia:costa-dos-corais
  ordem: 7137
  fontes:
    - /maragogi/costa-dos-corais/
d-guia-costa-dos-corais-04:
  pergunta: Preciso levar máscara de snorkel para os recifes de Maragogi?
  resposta: Não é obrigatório. O centro de mergulho do resort, com certificação PADI, conduz as saídas de snorkel e de mergulho na região dos recifes, contratadas à parte. Ainda assim, quem tem a própria máscara pode levá-la, e calçado para a água ajuda, porque o fundo tem corais.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 7138
  fontes:
    - /maragogi/costa-dos-corais/
d-post-como-escolher-acomodacao-01:
  pergunta: Quantas categorias de acomodação o Grand Oca Maragogi tem?
  resposta: 'São 420 unidades divididas em nove categorias, organizadas em quatro formatos: apartamentos Standard, bangalôs, Suítes e quartos Deluxe da ala D’Água. Entender esses grupos é o primeiro passo da escolha, porque cada um tem capacidade, vista e estilo de decoração próprios.'
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 7139
  fontes:
    - /blog/como-escolher-acomodacao/
d-post-como-escolher-acomodacao-02:
  pergunta: É melhor escolher bangalô ou apartamento no Grand Oca Maragogi?
  resposta: Os apartamentos Standard ficam em edifícios de dois pavimentos, no meio do gramado e do coqueiral, com decoração rústica. Já os bangalôs são casinhas de um piso só, vizinhas da área de lazer, voltadas ao verde ou à água. A decisão passa por escadas e movimento.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 7140
  fontes:
    - /blog/como-escolher-acomodacao/
d-post-como-escolher-acomodacao-03:
  pergunta: Que acomodação escolher para três pessoas?
  resposta: Há duas saídas para trios. O Apartamento Standard traz cama de casal e uma de solteiro, ou três de solteiro, e aceita três adultos ou dois adultos e uma criança de até 12 anos. O Bangalô Triplo chega ao mesmo total usando uma cama extra.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 7141
  fontes:
    - /blog/como-escolher-acomodacao/
d-post-como-escolher-acomodacao-04:
  pergunta: O resort divulga a metragem de todas as acomodações?
  resposta: 'Não. São publicadas apenas duas áreas: 50 metros quadrados no Duplo Deluxe com Sofá-cama e 72 na Suíte Deluxe. Standard, Standard Comunicante, bangalôs, Suítes e o Deluxe com 2 Camas Grandes não têm metragem divulgada, e a comparação se faz pela capacidade e pelos ambientes.'
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 7142
  fontes:
    - /blog/como-escolher-acomodacao/
d-post-como-escolher-acomodacao-05:
  pergunta: A idade das crianças muda a acomodação indicada?
  resposta: Muda. O Apartamento Standard considera criança até 12 anos, os bangalôs aceitam um bebê em berço, o Duplo Deluxe admite quatro adultos e uma criança, e a Suíte Deluxe, quatro adultos e duas crianças. Informe cada idade na cotação, porque ela define a tarifa.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 7143
  fontes:
    - /blog/como-escolher-acomodacao/
d-post-como-escolher-acomodacao-06:
  pergunta: Quais categorias do Grand Oca Maragogi têm varanda?
  resposta: O resort descreve varanda no Standard Comunicante, que tem duas, uma por quarto, e nas três categorias Deluxe da ala nova, todas de frente para a piscina. Nas demais, a vista do jardim, do coqueiral ou da água é aproveitada pelas janelas do quarto.
  tema: hospedagem
  paginas:
    - post:como-escolher-acomodacao
  ordem: 7144
  fontes:
    - /blog/como-escolher-acomodacao/
d-post-o-que-levar-na-mala-01:
  pergunta: Que roupa levar para os jantares nos restaurantes do resort?
  resposta: Não há código de vestimenta publicado. O único registro de informalidade é o almoço do La Brasa, em que se pode comer até em traje de banho. Para os jantares nos restaurantes temáticos, que pedem reserva no Guest Service, vale separar uma troca de roupa mais arrumada.
  tema: hospedagem
  paginas:
    - post:o-que-levar-na-mala
  ordem: 7145
  fontes:
    - /blog/o-que-levar-na-mala/
d-post-o-que-levar-na-mala-02:
  pergunta: Preciso levar medicamentos para o Grand Oca Maragogi?
  resposta: Leve os remédios de uso contínuo em quantidade suficiente, com a receita, porque o resort informa lojas e enfermaria, mas não farmácia. O Guest Service, ao lado da recepção, orienta os hóspedes em caso de necessidade, e a cidade de Maragogi fica a alguns quilômetros.
  tema: hospedagem
  paginas:
    - post:o-que-levar-na-mala
  ordem: 7146
  fontes:
    - /blog/o-que-levar-na-mala/
d-post-o-que-levar-na-mala-03:
  pergunta: O que levar na mala das crianças?
  resposta: Inclua fraldas, se for o caso, chapéu, roupa de banho extra, brinquedos de areia e uma blusa leve para o fim do dia. O resort tem baby area, recreação a partir dos quatro anos e berço nos bangalôs, confirmado na reserva da categoria escolhida.
  tema: hospedagem
  paginas:
    - post:o-que-levar-na-mala
  ordem: 7147
  fontes:
    - /blog/o-que-levar-na-mala/
d-post-o-que-levar-na-mala-04:
  pergunta: Preciso levar secador de cabelo para o Grand Oca Maragogi?
  resposta: Não é preciso. Os banheiros das acomodações do Grand Oca Maragogi contam com secador de cabelo. Como as tomadas são de 220 volts, vale conferir a voltagem de chapinha, barbeador ou qualquer outro aparelho que não seja bivolt antes de colocá-lo na mala.
  tema: hospedagem
  paginas:
    - post:o-que-levar-na-mala
  ordem: 7148
  fontes:
    - /blog/o-que-levar-na-mala/
d-post-o-que-levar-na-mala-05:
  pergunta: Preciso levar dinheiro para gastos extras no resort?
  resposta: O plano cobre refeições, snacks e bebidas selecionadas, mas bebidas importadas, espumante, vinho em garrafa e serviço de quarto ficam de fora. Salão de beleza, mergulho, passeios e a experiência VIP Premium têm condições próprias, então vale prever uma reserva de dinheiro para esses itens.
  tema: all-inclusive
  paginas:
    - post:o-que-levar-na-mala
  ordem: 7149
  fontes:
    - /blog/o-que-levar-na-mala/
d-post-o-que-levar-na-mala-06:
  pergunta: Vale levar roupa de esporte para o Grand Oca Maragogi?
  resposta: Vale levar tênis e roupa leve de treino. A programação para adultos vai das 9h às 23h e reúne academia, com aulas de funcional, Pilates com bola e alongamento, além de vôlei, beach tênis, futebol, caiaque e hidroginástica, que ocupam boa parte do dia.
  tema: lazer
  paginas:
    - post:o-que-levar-na-mala
  ordem: 7150
  fontes:
    - /blog/o-que-levar-na-mala/
d-post-resort-com-criancas-01:
  pergunta: As refeições das crianças estão incluídas na hospedagem?
  resposta: Estão. As crianças comem nos mesmos restaurantes e horários dos adultos, dentro do plano all inclusive, e a praça de alimentação serve lanches nos intervalos. A tarifa, no entanto, varia conforme a idade de cada uma, que precisa ser informada no momento da cotação.
  tema: all-inclusive
  paginas:
    - post:resort-com-criancas
  ordem: 7151
  fontes:
    - /blog/resort-com-criancas/
d-post-resort-com-criancas-02:
  pergunta: Que oficinas a recreação do resort oferece às crianças?
  resposta: As oficinas incluem massinha, brigadeiro, cupcake e pizza, somadas a jogos e gincanas, dentro dos turnos das 9h às 12h e das 14h às 18h. A agenda muda ao longo da semana, e a equipe divulga a lista de atividades de cada dia na estadia.
  tema: lazer
  paginas:
    - post:resort-com-criancas
  ordem: 7152
  fontes:
    - /blog/resort-com-criancas/
d-post-resort-com-criancas-03:
  pergunta: O que fazer com as crianças em dia de chuva no resort?
  resposta: Há uma programação alternativa para dias de chuva, com atividades em espaços cobertos, e os restaurantes, os bares e a academia continuam abertos. Modalidades, horários e locais podem mudar conforme o clima e a operação, então vale conferir a agenda com a equipe de recreação.
  tema: lazer
