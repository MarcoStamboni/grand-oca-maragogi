  ordem: 1403
  fontes: *a6
d-05:
  pergunta: Como era Maragogi antes do turismo?
  resposta: Maragogi era uma vila de pescadores, e a pesca e a agricultura, em especial a cana-de-açúcar, eram as principais fontes de recursos. Hoje o turismo é a principal atividade da região, e a cidade é a segunda mais turística de Alagoas, atrás da capital, Maceió.
  tema: destino
  paginas:
    - guia:costa-dos-corais
  ordem: 1404
  fontes: *a6
d-06:
  pergunta: Que igrejas históricas Maragogi tem?
  resposta: 'Maragogi tem três igrejas que formam seu principal patrimônio arquitetônico: a Matriz de Santo Antônio, construída no fim do século XIX, e as igrejas de Nossa Senhora da Guia e de São Bento, do século XVII, que hoje conservam apenas as paredes externas.'
