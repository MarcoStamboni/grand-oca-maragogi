r-10:
  pergunta: O Grand Oca Maragogi tem lojas e salão de beleza?
  resposta: Sim. O Grand Oca Maragogi Resort tem lojas para comprar lembranças, moda e artesanato local e um salão de beleza que abre todos os dias, com serviços de manicure e cabeleireiro. Esses serviços não fazem parte da diária all inclusive, e as condições são informadas no resort.
  tema: resort
  paginas:
    - servicos
    - fotos
    - blog
  ordem: 109
  fontes: *id001
r-11:
  pergunta: O Grand Oca Maragogi tem agência de viagens?
  resposta: Sim. O Grand Oca Maragogi Resort conta com uma agência de viagens interna, onde é possível reservar traslados e passeios pelos arredores, como as saídas às piscinas naturais da Costa dos Corais. Esses serviços são contratados à parte, e valores e horários são informados no momento da contratação.
  tema: resort
  paginas:
    - servicos
    - fotos
    - blog
  ordem: 110
  fontes: *id001
r-12:
  pergunta: O Grand Oca Maragogi tem academia?
  resposta: Sim. O Grand Oca Maragogi Resort tem academia, com programação de aulas como Cardio HIT, GAP, funcional, Pilates com bola e alongamento, além de hidro fitness na piscina. As modalidades e os horários seguem a agenda vigente e podem mudar conforme o período e a operação do resort.
  tema: resort
  paginas:
    - blog
  ordem: 111
  fontes: *id001
l-01:
  pergunta: Onde fica o Grand Oca Maragogi Resort?
  resposta: O Grand Oca Maragogi Resort fica em Ponta de Mangue, no município de Maragogi, no litoral norte de Alagoas, entre as cidades de Recife e Maceió. A região é conhecida como Costa dos Corais, por causa dos recifes, das piscinas naturais, das praias de coqueirais e do mar azul-esverdeado.
