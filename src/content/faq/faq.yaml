po-01:
  pergunta: Qual é o horário de check-in e check-out no Grand Oca Maragogi?
  resposta: No Grand Oca Maragogi, o check-in começa às 15h e o check-out deve ser feito até as 12h. Early check-in e late check-out, quando oferecidos, dependem de disponibilidade e das regras da reserva. Organize o horário de chegada considerando o início oficial do check-in.
  tema: reservas
  paginas:
    - blog
    - acomodacao:duplo-deluxe-sofa-cama
  ordem: 1600
  fontes: *a7
po-02:
  pergunta: Dá para fazer early check-in ou late check-out no Grand Oca Maragogi?
  resposta: Early check-in e late check-out dependem de disponibilidade e das regras da reserva e, quando oferecidos, podem ter condições próprias. A recomendação é combinar com a equipe da Resorts Online antes da viagem e confirmar com a recepção na chegada, já que o horário padrão é check-in às 15h e check-out às 12h.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 1601
  fontes: *a7
po-03:
  pergunta: Quais documentos são necessários para se hospedar no Grand Oca Maragogi?
  resposta: No check-in, são pedidos documento oficial com foto de todos os hóspedes, inclusive das crianças, CPF (estrangeiros apresentam o passaporte), endereço completo com CEP e telefone e e-mail de contato. As informações alimentam a Ficha Nacional de Registro de Hóspedes.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 1602
  fontes: *a7
po-04:
  pergunta: Menores de 18 anos podem se hospedar sozinhos no Grand Oca Maragogi?
  resposta: Não. Menores de 18 anos só se hospedam acompanhados dos pais ou de um responsável legal e, com outro adulto, precisam de autorização expressa dos pais, conforme o Estatuto da Criança e do Adolescente. Toda criança apresenta documento com a filiação, e bebidas alcoólicas não são servidas a menores.
  tema: reservas
  paginas:
    - reservasHospedagem
  ordem: 1603
  fontes: *a7
po-05:
  pergunta: Até que idade a criança é considerada na capacidade das acomodações?
  resposta: Depende da categoria. O Apartamento Standard considera crianças de até 12 anos na capacidade, e o Bangalô aceita um bebê em berço. As categorias com crianças contam limites de adultos e crianças, como o Duplo Deluxe, com no máximo quatro adultos e uma criança. Confirme na cotação.
  tema: reservas
  paginas:
    - politicaHospedagem
  ordem: 1604
  fontes: *a7
po-06:
  pergunta: O Grand Oca Maragogi muda a programação sem aviso?
  resposta: Sim. Modalidades, horários, disponibilidade, locais e programação podem mudar de acordo com o período, o clima e a operação do resort, e marcas, receitas e pontos de serviço do all inclusive também. O Grand Oca Maragogi orienta consultar a programação vigente durante a hospedagem.
  tema: reservas
  paginas:
    - politicaHospedagem
    - acomodacao:suite
  ordem: 1605
  fontes: *a7
po-07:
  pergunta: O Grand Oca Maragogi tem política para o uso das piscinas por crianças?
  resposta: O resort não divulga regras específicas de idade para as piscinas. Em geral, menores de idade devem estar acompanhados por um responsável nas áreas de água, e as atividades do Kids Club são organizadas por faixa etária. Confirme eventuais restrições com a equipe na chegada.
  tema: reservas
  paginas:
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 1606
  fontes: *a7
