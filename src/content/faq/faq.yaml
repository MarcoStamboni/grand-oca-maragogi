  resposta: O Grand Oca Maragogi oferece café da manhã, almoço, chá da tarde e jantar, além de snacks em diferentes pontos do resort, como a praça de alimentação, e sorvetes. A maior parte das refeições é servida em buffet no Restaurante dos Corais, de frente para o mar.
