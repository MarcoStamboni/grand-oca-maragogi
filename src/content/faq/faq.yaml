  resposta: O Ix’U é um restaurante moderno de cozinha fusion, em ambiente lounge às margens da praia, no Grand Oca Maragogi. Mistura culturas e sabores entre o antigo e o moderno, tem espaço para até 70 pessoas e carta exclusiva de vinhos, e é uma experiência diferenciada em Maragogi.
