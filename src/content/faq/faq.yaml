dg-01:
  pergunta: O Grand Oca Maragogi é all inclusive nos feriados?
  resposta: Sim. O sistema all inclusive do Grand Oca Maragogi vale também nos feriados, com refeições, snacks, bebidas selecionadas e lazer incluídos, conforme as regras do plano contratado. Nas datas de alta procura, o resort pode divulgar programação própria, e as condições mudam conforme o ano e a categoria.
