# Perguntas frequentes do Grand Oca Maragogi Resort (fatos: docs/conteudo-grand-oca-maragogi.md).
# Regra AEO da rede: cada página indexável mostra EXATAMENTE 15 perguntas (14 do assunto da página
# + "Onde fazer a sua reserva...", marcada para "todas"), conferido por src/lib/faq-paginas.test.ts.
# paginas: chaves de src/data/rotas.ts, páginas de detalhe ("acomodacao:<id>", "restaurante:<id>",
# "guia:<id>", "data-especial:<id>", "post:<id>") ou "todas". Uma mesma pergunta pode servir a mais de
# uma página do mesmo assunto.
# tema: agrupa as perguntas na página /perguntas-frequentes/.
# Meta AEO: resposta direta de 40 a 60 palavras (conferida por teste).

r-01:
  pergunta: O que é o Grand Oca Maragogi Resort?
  resposta: O Grand Oca Maragogi Resort, também chamado de Grand Oca Maragogi Beach & Leisure Resort, é um resort all inclusive pé na areia na Praia de Ponta de Mangue, em Maragogi, Alagoas, com 420 unidades de hospedagem, várias piscinas, quatro restaurantes, sete bares e estrutura de lazer para casais e famílias.
  tema: resort
  paginas:
    - home
    - acomodacao:apartamento-standard
  ordem: 100
  fontes: &a1
    - /resort/
r-02:
  pergunta: O Grand Oca Maragogi é um resort pé na areia?
  resposta: Sim. O Grand Oca Maragogi Resort fica de frente para a Praia de Ponta de Mangue, a cerca de 10 metros do mar, em uma área de coqueirais. Os hóspedes caminham da piscina até a areia em poucos passos, e há um bar na área da praia com serviço de bebidas.
  tema: resort
  paginas:
    - home
  ordem: 101
  fontes: *a1
r-03:
  pergunta: Quantas unidades de hospedagem o Grand Oca Maragogi tem?
  resposta: O Grand Oca Maragogi Resort tem 420 unidades de hospedagem, distribuídas em nove categorias, de apartamentos Standard e bangalôs a suítes e quartos Deluxe. Todas ficam em uma grande área de jardins e coqueiros, com vista para as piscinas ou para o verde, e recebem de uma a seis pessoas.
  tema: resort
  paginas:
    - home
  ordem: 102
  fontes: *a1
r-04:
  pergunta: O Grand Oca Maragogi faz parte de qual rede hoteleira?
  resposta: O Grand Oca Maragogi Resort pertence à rede Oca Hotels, que tem hotéis no Brasil, em Portugal e na Espanha. Este site é um portal da agência Resorts Online, que vende hospedagem e pacotes para o resort, e não representa o site oficial do hotel nem o seu atendimento.
  tema: resort
  paginas:
    - resort
    - quemSomos
  ordem: 103
  fontes: *a1
r-05:
  pergunta: Para quem o Grand Oca Maragogi é indicado?
  resposta: O Grand Oca Maragogi Resort é indicado para casais e famílias que querem praia, piscinas e all inclusive no litoral norte de Alagoas. As crianças contam com Kids Club, parque aquático e playground, e os adultos, com esportes, academia, bares e shows, além de passeios pelas piscinas naturais da região.
  tema: resort
  paginas:
    - resort
    - quemSomos
  ordem: 104
  fontes: *a1
r-06:
  pergunta: Quais são os principais diferenciais do Grand Oca Maragogi?
  resposta: Os principais diferenciais do Grand Oca Maragogi Resort são a localização pé na areia na Praia de Ponta de Mangue, as piscinas distribuídas por quase 400 metros, a nova área D’Água com parque aquático, os restaurantes temáticos incluídos no all inclusive e o centro de mergulho PADI para explorar os recifes.
  tema: resort
  paginas:
    - resort
    - post:como-escolher-acomodacao
  ordem: 105
  fontes: *a1
r-07:
  pergunta: O Grand Oca Maragogi tem Wi-Fi?
  resposta: Sim. O Grand Oca Maragogi Resort oferece acesso à internet Wi-Fi para os hóspedes nas áreas do resort, A qualidade e a abrangência do sinal podem variar conforme o local, a ocupação e o período da estadia. Vale confirmar os detalhes com a recepção.
  tema: resort
  paginas:
    - resort
  ordem: 106
  fontes: *a1
r-08:
  pergunta: O que é o Guest Service do Grand Oca Maragogi?
  resposta: O Guest Service é o departamento de atendimento ao hóspede do Grand Oca Maragogi, instalado ao lado da recepção. É lá que os hóspedes fazem a reserva dos restaurantes temáticos Ix’U, Il Giardino e La Brasa, que fazem parte do all inclusive, e tiram dúvidas sobre a programação do dia.
  tema: resort
  paginas:
    - servicos
  ordem: 107
  fontes: *a1
r-09:
  pergunta: O Grand Oca Maragogi tem enfermaria?
  resposta: Sim. O Grand Oca Maragogi Resort conta com serviço de enfermaria para primeiros socorros durante a estadia. Em caso de necessidade, o hóspede pode procurar a recepção ou o Guest Service, que orientam sobre o atendimento, e quem usa medicação contínua deve levar a própria receita e os remédios.
  tema: resort
  paginas:
    - servicos
  ordem: 108
  fontes: *a1
r-10:
  pergunta: O Grand Oca Maragogi tem lojas e salão de beleza?
  resposta: Sim. O Grand Oca Maragogi Resort tem lojas para comprar lembranças, moda e artesanato local e um salão de beleza que abre todos os dias, com serviços de manicure e cabeleireiro. Esses serviços não fazem parte da diária all inclusive, e as condições são informadas no resort.
  tema: resort
  paginas:
    - servicos
  ordem: 109
  fontes: *a1
r-11:
  pergunta: O Grand Oca Maragogi tem agência de viagens?
  resposta: Sim. O Grand Oca Maragogi Resort conta com uma agência de viagens interna, onde é possível reservar traslados e passeios pelos arredores, como as saídas às piscinas naturais da Costa dos Corais. Esses serviços são contratados à parte, e valores e horários são informados no momento da contratação.
  tema: resort
  paginas:
    - servicos
  ordem: 110
  fontes: *a1
r-12:
  pergunta: O Grand Oca Maragogi tem academia?
  resposta: Sim. O Grand Oca Maragogi Resort tem academia, com programação de aulas como Cardio HIT, GAP, funcional, Pilates com bola e alongamento, além de hidro fitness na piscina. As modalidades e os horários seguem a agenda vigente e podem mudar conforme o período e a operação do resort.
  tema: resort
  paginas:
    - blog
  ordem: 111
  fontes: *a1
l-01:
  pergunta: Onde fica o Grand Oca Maragogi Resort?
  resposta: O Grand Oca Maragogi Resort fica em Ponta de Mangue, no município de Maragogi, no litoral norte de Alagoas, entre as cidades de Recife e Maceió. A região é conhecida como Costa dos Corais, por causa dos recifes, das piscinas naturais, das praias de coqueirais e do mar azul-esverdeado.
  tema: localizacao
  paginas:
    - home
    - quemSomos
  ordem: 200
  fontes: &a2
    - /como-chegar/
l-02:
  pergunta: Qual é o endereço do Grand Oca Maragogi Resort?
  resposta: O endereço do Grand Oca Maragogi Resort é Rodovia AL-101 Norte, s/n, Ponta de Mangue, Maragogi, Alagoas. O CEP informado nos canais atuais do resort e da agência é 57955-000. Para chegar de carro, vale conferir a rota atualizada no mapa disponível na página Como chegar.
  tema: localizacao
  paginas:
    - comoChegar
    - data-especial:finados
  ordem: 201
  fontes: *a2
l-03:
  pergunta: O Grand Oca Maragogi fica em frente à praia?
  resposta: Sim. O Grand Oca Maragogi fica em frente à Praia de Ponta de Mangue, uma das praias mais conhecidas da região de Maragogi, a cerca de 10 metros do resort. A estrutura inclui um bar na área da praia, com serviço de bebidas e vista para o mar.
  tema: localizacao
  paginas:
    - fotos
    - guia:costa-dos-corais
  ordem: 202
  fontes: *a2
l-04:
  pergunta: Como é a Praia de Ponta de Mangue, em frente ao resort?
  resposta: A Praia de Ponta de Mangue é conhecida pelas águas claras e tranquilas, sobretudo em períodos de maré baixa, e tem coqueirais ao fundo. É uma das praias mais procuradas de Maragogi e fica a poucos passos do Grand Oca Maragogi, que também integra a região dos recifes e das piscinas naturais.
  tema: localizacao
  paginas:
    - comoChegar
    - data-especial:proclamacao-da-republica
  ordem: 203
  fontes: *a2
l-05:
  pergunta: O Grand Oca Maragogi fica perto do centro de Maragogi?
  resposta: O Grand Oca Maragogi fica em Ponta de Mangue, ao norte do centro de Maragogi, e normalmente é necessário usar algum transporte para chegar à cidade. Quem prefere passear por lá pode combinar táxi, transfer ou carro alugado, e a agência de viagens do resort também reserva passeios pela região.
  tema: localizacao
  paginas:
    - comoChegar
    - data-especial:natal
  ordem: 204
  fontes: *a2
l-06:
  pergunta: O Grand Oca Maragogi fica mais perto de Recife ou de Maceió?
  resposta: 'O Grand Oca Maragogi fica entre as duas capitais, com distância ligeiramente menor por Recife: cerca de 126 km, contra cerca de 136 km de Maceió. A melhor escolha depende dos voos, dos horários e das tarifas disponíveis, e o trecho final é feito de carro, táxi ou transfer.'
  tema: localizacao
  paginas:
    - comoChegar
    - data-especial:consciencia-negra
  ordem: 205
  fontes: *a2
l-07:
  pergunta: Qual é a distância de Recife até o Grand Oca Maragogi?
  resposta: A distância do Recife até o Grand Oca Maragogi Resort é de aproximadamente 126 km. O trecho é feito de carro, táxi ou transfer, pelo litoral sul de Pernambuco até Maragogi, e o tempo de estrada varia conforme o trânsito e as condições da rodovia.
  tema: localizacao
  paginas:
    - reservasPacoteComAereo
    - data-especial:pascoa
  ordem: 206
  fontes: *a2
l-08:
  pergunta: Qual é a distância de Maceió até o Grand Oca Maragogi?
  resposta: A distância de Maceió até o Grand Oca Maragogi Resort é de aproximadamente 136 km, pelo litoral norte de Alagoas até Ponta de Mangue. O trajeto costuma ser feito de carro, táxi ou transfer, e o tempo depende do trânsito e das condições da estrada no dia da viagem.
  tema: localizacao
  paginas:
    - reservasPacoteComAereo
  ordem: 207
  fontes: *a2
l-09:
  pergunta: Qual a distância do Grand Oca Maragogi até Caruaru?
  resposta: O Grand Oca Maragogi Resort informa uma distância de cerca de 153 km até Caruaru, em Pernambuco, além de 126 km até Recife e 136 km até Maceió. A Praia de Ponta de Mangue, por sua vez, fica a apenas 10 metros do resort, em frente aos jardins.
  tema: localizacao
  paginas:
    - reservasPacoteComAereo
    - data-especial:tiradentes
  ordem: 208
  fontes: *a2
l-10:
  pergunta: Qual aeroporto é melhor para chegar ao Grand Oca Maragogi?
  resposta: O Grand Oca Maragogi pode ser acessado pelo Aeroporto do Recife (REC) ou pelo Aeroporto de Maceió (MCZ). O Recife fica um pouco mais perto por estrada, mas a melhor opção depende do voo, da tarifa e da logística do transfer. Compare o custo total, e não só a distância.
  tema: localizacao
  paginas:
    - reservasPacoteComAereo
  ordem: 209
  fontes: *a2
l-11:
  pergunta: Maragogi vai ter aeroporto próprio?
  resposta: Sim. Está em construção o Aeroporto Costa dos Corais, em Maragogi, que deverá facilitar o acesso aéreo à região. Ainda não há uma data definitiva de início das operações, e o aeroporto não opera voos comerciais regulares, então por enquanto é preciso chegar pelos aeroportos de Recife ou de Maceió.
  tema: localizacao
  paginas:
    - data-especial:dia-do-trabalho
  ordem: 210
  fontes: *a2
l-12:
  pergunta: É preciso alugar carro para se hospedar no Grand Oca Maragogi?
  resposta: Não necessariamente. O Grand Oca Maragogi pode ser acessado por transfer, táxi ou carro particular, e o resort concentra restaurantes, bares, piscinas, lazer e praia em um só local. O carro alugado só ajuda a quem quer passear pela região com mais liberdade, fora do resort.
  tema: localizacao
  paginas:
    - destino
  ordem: 211
  fontes: *a2
l-13:
  pergunta: O Grand Oca Maragogi oferece transfer do aeroporto?
  resposta: O Grand Oca Maragogi conta com a agência de viagens do resort, que reserva traslados e passeios, e também pode ter opções de transfer conforme a disponibilidade e as condições da reserva. Valores e horários são informados no momento da contratação, e o serviço não faz parte da diária.
  tema: localizacao
  paginas:
    - destino
    - data-especial:sete-de-setembro
  ordem: 212
  fontes: *a2
l-15:
  pergunta: O Grand Oca Maragogi fica perto das piscinas naturais?
  resposta: Sim. O Grand Oca Maragogi fica em uma região próxima aos recifes e às piscinas naturais de Maragogi, na área de Ponta de Mangue. O centro de mergulho do resort oferece aulas e passeios até esses pontos, em mergulho com cilindro ou em snorkel, contratados à parte.
  tema: localizacao
  paginas:
    - data-especial:dia-das-criancas
  ordem: 214
  fontes: *a2
a-01:
  pergunta: Quais tipos de acomodação o Grand Oca Maragogi tem?
  resposta: 'O Grand Oca Maragogi Resort tem nove categorias de acomodação: Apartamento Standard, Standard Comunicante, Bangalô Vista Jardim, Bangalô Vista Piscina, Bangalô Triplo, Suíte, Deluxe com 2 Camas Grandes, Duplo Deluxe com Sofá-cama e Suíte Deluxe, com capacidades de uma a seis pessoas.'
  tema: hospedagem
  paginas:
    - acomodacoes
    - reservasHospedagem
    - post:como-escolher-acomodacao
  ordem: 300
  fontes: &a3
    - /acomodacoes/
a-02:
  pergunta: Qual é a maior acomodação do Grand Oca Maragogi?
  resposta: A Suíte Deluxe é a maior acomodação do Grand Oca Maragogi Resort, com 72 m² e capacidade para até seis hóspedes, no máximo quatro adultos e duas crianças. Tem duas camas extragrandes, sala de estar com sofá-cama, cafeteira Nespresso, Smart TV e varanda com vista para a piscina da área D’Água.
  tema: hospedagem
  paginas:
    - acomodacoes
    - acomodacao:apartamento-standard
    - post:como-escolher-acomodacao
  ordem: 301
  fontes: *a3
a-03:
  pergunta: Qual acomodação do Grand Oca Maragogi é melhor para famílias?
  resposta: Depende do número de hóspedes. O Duplo Deluxe acomoda cinco em 50 m², o Standard Comunicante reúne até seis em dois quartos, a Suíte Deluxe recebe até seis, com no máximo quatro adultos e duas crianças. A idade das crianças muda a tarifa, então informe-a na cotação.
  tema: hospedagem
  paginas:
    - acomodacoes
    - acomodacao:apartamento-standard
  ordem: 302
  fontes: *a3
a-04:
  pergunta: Qual acomodação do Grand Oca Maragogi é melhor para casais?
  resposta: Para casais, o Grand Oca Maragogi oferece o Bangalô, a Suíte, com cama king e vista parcial para a praia, e os quartos Deluxe da área D’Água, com varanda para a piscina. A escolha depende principalmente da vista, da localização dentro do resort e do nível de conforto desejado.
  tema: hospedagem
  paginas:
    - acomodacoes
    - acomodacao:apartamento-standard
  ordem: 303
  fontes: *a3
a-05:
  pergunta: O Grand Oca Maragogi tem acomodação adaptada para mobilidade reduzida?
  resposta: O Grand Oca Maragogi informa que o Standard Comunicante não possui adaptação para hóspedes com deficiência física ou mobilidade reduzida. Quem precisa de acessibilidade deve informar a necessidade na hora da cotação, para a equipe da Resorts Online confirmar com o resort a categoria mais adequada para a viagem.
  tema: hospedagem
  paginas:
    - comparativo
    - acomodacao:deluxe-duas-camas-grandes
  ordem: 304
  fontes: *a3
a-06:
  pergunta: Os quartos do Grand Oca Maragogi têm varanda?
  resposta: Algumas categorias têm varanda, como os quartos Deluxe, o Duplo Deluxe e a Suíte Deluxe, todos com vista para a piscina da área D’Água, e o Standard Comunicante, com duas varandas. As demais variam, e a vista pode ser para o jardim, a piscina ou áreas do resort.
  tema: hospedagem
  paginas:
    - comparativo
    - acomodacao:standard-comunicante
  ordem: 305
  fontes: *a3
a-07:
  pergunta: Os quartos do Grand Oca Maragogi têm ar-condicionado, TV e frigobar?
  resposta: Sim. As acomodações do Grand Oca Maragogi têm ar-condicionado, TV ou Smart TV, frigobar, telefone e banheiro privativo com chuveiro e secador de cabelo, com variações de itens conforme a categoria. Os apartamentos também informam cofre e amenities. Confirme os detalhes da categoria escolhida na cotação com a equipe.
  tema: hospedagem
  paginas:
    - comparativo
    - acomodacao:bangalo-vista-jardim
  ordem: 306
  fontes: *a3
a-08:
  pergunta: Qual é a voltagem dos apartamentos do Grand Oca Maragogi?
  resposta: Os apartamentos do Grand Oca Maragogi Resort têm tomadas de 220 volts. Quem viaja com aparelhos de 110 volts, como alguns carregadores, secadores e barbeadores, deve conferir se são bivolt ou levar um adaptador adequado, para evitar danos aos equipamentos durante a estadia.
  tema: hospedagem
  paginas:
    - comparativo
    - acomodacao:bangalo-vista-jardim
  ordem: 307
  fontes: *a3
a-09:
  pergunta: Qual acomodação do Grand Oca Maragogi tem vista para o mar?
  resposta: As duas Suítes do andar superior têm vista para a piscina e vista parcial para a Praia de Ponta de Mangue. As demais categorias têm vista para jardins, coqueiral ou piscinas, e o resort fica a cerca de 10 metros da praia, então o mar está sempre a poucos passos.
  tema: hospedagem
  paginas:
    - fotos
    - acomodacao:bangalo-vista-jardim
  ordem: 308
  fontes: *a3
a-10:
  pergunta: O que é a área D’Água do Grand Oca Maragogi?
  resposta: A área D’Água é a parte mais nova do Grand Oca Maragogi Resort, com piscinas, solário, borda infinita, parque aquático, um bar com snacks e gelados e os quartos Deluxe, de varanda para a piscina. Ficam nela o Deluxe, o Duplo Deluxe e a Suíte Deluxe.
  tema: hospedagem
  paginas:
    - fotos
    - acomodacao:bangalo-vista-jardim
  ordem: 309
  fontes: *a3
a-11:
  pergunta: Os bangalôs do Grand Oca Maragogi aceitam bebê em berço?
  resposta: Sim. Os Bangalôs Vista Jardim e Vista Piscina do Grand Oca Maragogi acomodam dois adultos e um bebê em berço, com cama de casal ou duas camas de solteiro. Confirme a disponibilidade do berço com a equipe da Resorts Online ao fazer a cotação da categoria escolhida.
  tema: hospedagem
  paginas:
    - acomodacao:bangalo-vista-piscina
