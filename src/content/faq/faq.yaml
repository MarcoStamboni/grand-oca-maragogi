  resposta: 'O Grand Oca Maragogi Resort tem nove categorias de acomodação: Apartamento Standard, Standard Comunicante, Bangalô Vista Jardim, Bangalô Vista Piscina, Bangalô Triplo, Suíte, Deluxe com 2 Camas Grandes, Duplo Deluxe com Sofá-cama e Suíte Deluxe, com capacidades de uma a seis pessoas.'
