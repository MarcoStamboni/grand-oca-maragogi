  resposta: As imagens são fotografias do Grand Oca Maragogi, tratadas para realçar as cores. Decoração, mobiliário, jardins e a aparência das áreas podem mudar com o tempo e com a estação, então as imagens servem como referência e não substituem a descrição de cada categoria.
