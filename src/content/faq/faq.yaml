  resposta: O Grand Oca Maragogi informa cerca de 126 km até Recife e 136 km até Maceió, além de 153 km até Caruaru. As distâncias são rodoviárias e aproximadas. O tempo de viagem varia conforme o trânsito e as condições da estrada, então vale conferir a rota no mapa antes de sair.
