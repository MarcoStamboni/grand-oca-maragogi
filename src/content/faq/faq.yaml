d-02:
  pergunta: O que é a Costa dos Corais?
  resposta: A Costa dos Corais é o nome dado ao litoral de Maragogi e da região, famoso pelos recifes de corais, pelas piscinas naturais, pelas praias de coqueirais e pelo mar azul-esverdeado. A área é protegida como APA, Área de Preservação Ambiental, e atrai mergulhadores e turistas do Brasil e do mundo.
  tema: destino
  paginas:
    - destino
  ordem: 1401
  fontes: *a6
d-03:
  pergunta: O que são as piscinas naturais de Maragogi?
  resposta: As piscinas naturais de Maragogi são áreas de águas rasas e cristalinas formadas pelos recifes de corais, com muitos peixes coloridos. Ficam em área de preservação ambiental e são ideais para mergulho e snorkel, já que a profundidade média da área de corais não passa de cerca de um metro.
  tema: destino
  paginas:
