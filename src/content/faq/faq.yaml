d-06:
  pergunta: Que igrejas históricas Maragogi tem?
  resposta: 'Maragogi tem três igrejas que formam seu principal patrimônio arquitetônico: a Matriz de Santo Antônio, construída no fim do século XIX, e as igrejas de Nossa Senhora da Guia e de São Bento, do século XVII, que hoje conservam apenas as paredes externas.'
