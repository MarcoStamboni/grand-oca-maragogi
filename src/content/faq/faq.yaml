  ordem: 1703
  fontes: *a7
ag-05:
  pergunta: O endereço da Resorts Online é o do hotel?
  resposta: Não. A Resorts Online fica em São Paulo, na Rua Vergueiro, 2253, conjunto 1216, Vila Mariana, e é uma agência independente do hotel. O Grand Oca Maragogi Resort fica na Rodovia AL-101 Norte, em Ponta de Mangue, Maragogi (AL), a cerca de 10 metros da praia, e funciona com atendimento próprio.
