f-03:
  pergunta: Por que algumas fotos não mostram pessoas?
  resposta: As imagens do site foram escolhidas sem pessoas, para mostrar os ambientes do resort, como acomodações, piscinas, restaurantes e jardins, com clareza e sem interferir no direito de imagem de ninguém. A vida do resort, com hóspedes e atividades, é percebida melhor pessoalmente.
