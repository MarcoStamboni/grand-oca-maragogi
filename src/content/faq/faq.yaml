d-02:
  pergunta: O que é a Costa dos Corais?
  resposta: A Costa dos Corais é o nome dado ao litoral de Maragogi e da região, famoso pelos recifes de corais, pelas piscinas naturais, pelas praias de coqueirais e pelo mar azul-esverdeado. A área é protegida como APA, Área de Preservação Ambiental, e atrai mergulhadores e turistas do Brasil e do mundo.
