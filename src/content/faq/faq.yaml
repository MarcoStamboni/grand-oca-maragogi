dg-03:
  pergunta: Os feriados têm noites mínimas no Grand Oca Maragogi?
  resposta: Em períodos de alta procura, como Réveillon, Carnaval e Natal, pode haver exigência de noites mínimas, que varia a cada ano. O resort não publica uma regra fixa, então a equipe da Resorts Online confirma o mínimo de noites na hora da cotação para as datas escolhidas.
