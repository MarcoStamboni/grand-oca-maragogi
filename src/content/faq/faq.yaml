  fontes: *a7
rs-10:
  pergunta: O voucher da reserva é enviado na hora?
  resposta: Quando o pagamento é aprovado no motor online, a reserva fica garantida e o voucher é enviado imediatamente. Se a cotação for feita com a equipe da Resorts Online, o voucher segue após o pagamento acertado, e a equipe informa as regras da reserva por WhatsApp ou telefone.
