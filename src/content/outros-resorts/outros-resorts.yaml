# Resorts all inclusive da rede Resort All Inclusive (página /outros-resorts/ e carrossel da home).
# Lista do cliente (19/10/2026). O resort do próprio site sai da lista sozinho.
# Ligado neste site (recursos.outrosResorts = true no site.config.ts).
# - `url`: portal do resort em *.resortallinclusive.com.br. Sem url, "Ver detalhes" vira a cotação
#   pelo WhatsApp (PENDENTE: domínios dos resorts novos, a enviar pelo cliente).
# - `resumo`: só com fatos conferidos. Sem resumo, o site mostra um texto neutro com o destino.
# - `destino`/`uf`: cidade ou região do resort (conferidas em 19/10/2026).
# Fotos de outros resorts só com autorização de uso.

# --- Portais já publicados (aparecem primeiro) -------------------------------------------------

grand-oca-maragogi:
  nome: Grand Oca Maragogi Resort
  ordem: 1
  destino: Maragogi
  uf: AL
  resumo: Resort pé na areia na Praia de Ponta de Mangue, com piscinas, Kids Club e acomodações para casais e famílias.
  url: https://grandocamaragogi.resortallinclusive.com.br/
  foto: rede/grand-oca-maragogi.jpg

